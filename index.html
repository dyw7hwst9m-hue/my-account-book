<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>สมุดบัญชี</title>

<style>
:root{
  --bg:#fff7fb;
  --card:#ffffff;
  --soft:#fff0f7;
  --soft2:#faf6fa;
  --pink:#cc6695;
  --pink2:#e9a5c4;
  --ink:#29252b;
  --muted:#968e97;
  --line:#eee4ea;
  --green:#62ad85;
  --red:#d76d78;
  --blue:#5e9ee6;
  --shadow:0 8px 25px rgba(180,100,145,.08);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Thai",
    "Noto Sans",
    sans-serif;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:18px;
}

/* =========================
   TOP
========================= */

.topbar{
  background:white;
  border-radius:25px;
  padding:9px;
  box-shadow:var(--shadow);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  position:sticky;
  top:8px;
  z-index:20;
}

.nav-btn{
  border:0;
  background:transparent;
  border-radius:20px;
  padding:13px 8px;
  color:#777;
  min-height:70px;
}

.nav-btn.active{
  background:#fae4ef;
  color:#bd5685;
}

.nav-icon{
  display:block;
  font-size:25px;
  line-height:1.2;
}

.nav-text{
  display:block;
  margin-top:4px;
  font-size:14px;
}

/* =========================
   HEADER
========================= */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:22px 3px 14px;
}

.shop-title{
  font-size:25px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:8px;
}

.title-edit{
  border:0;
  background:#f7eef3;
  color:#b45d85;
  border-radius:10px;
  padding:5px 8px;
  font-size:12px;
}

/* =========================
   CARDS
========================= */

.card{
  background:var(--card);
  border-radius:25px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
}

.soft-card{
  background:linear-gradient(135deg,#fff0f7,#fff);
}

.card-title{
  font-size:23px;
  font-weight:800;
  margin:0 0 8px;
}

.card-sub{
  color:var(--muted);
  font-size:14px;
  margin-bottom:18px;
}

.section-title{
  font-size:20px;
  font-weight:800;
  margin:0 0 15px;
}

/* =========================
   FORM
========================= */

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}

.field{
  margin-bottom:12px;
}

.field label{
  display:block;
  color:#918a91;
  font-size:13px;
  margin-bottom:7px;
}

input,
select,
textarea{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  border-radius:15px;
  padding:12px 14px;
  outline:none;
  color:var(--ink);
}

input:focus,
select:focus,
textarea:focus{
  border-color:#dda0bd;
  box-shadow:0 0 0 3px rgba(221,160,189,.12);
}

textarea{
  min-height:80px;
  resize:vertical;
}

.btn{
  border:0;
  border-radius:14px;
  padding:11px 17px;
  font-weight:700;
}

.btn-pink{
  background:var(--pink);
  color:white;
}

.btn-light{
  background:#f7f2f5;
  color:#6f6870;
}

.btn-green{
  background:#e6f6ed;
  color:#4c9c71;
}

.btn-red{
  background:#fff0f2;
  color:#c96470;
}

.btn-small{
  padding:6px 9px;
  font-size:11px;
  border-radius:9px;
}

/* =========================
   STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  background:#faf7fa;
  border-radius:16px;
  padding:14px;
}

.stat-label{
  color:#9b939a;
  font-size:12px;
}

.stat-value{
  font-size:20px;
  font-weight:800;
  margin-top:4px;
}

.income{
  color:var(--green);
}

.expense{
  color:var(--red);
}

.balance{
  color:var(--blue);
}

/* =========================
   ACCOUNT LIST
========================= */

.record{
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  margin-bottom:10px;
  background:white;
}

.record-top{
  display:flex;
  align-items:center;
  gap:11px;
}

.cover{
  width:48px;
  height:48px;
  border-radius:14px;
  background:#fff1f6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  flex:none;
}

.cover.empty{
  background:#faf7fa;
}

.record-main{
  min-width:0;
  flex:1;
}

.record-name{
  font-weight:800;
  font-size:16px;
  word-break:break-word;
}

.record-date{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.record-amount{
  font-size:18px;
  font-weight:800;
  white-space:nowrap;
}

.record-detail{
  margin-top:7px;
  font-size:13px;
  color:#807780;
}

.record-actions{
  display:flex;
  gap:5px;
  margin-top:10px;
  justify-content:flex-end;
}

.edit-mini{
  border:0;
  background:#f8f2f5;
  color:#9b7086;
  padding:5px 8px;
  border-radius:8px;
  font-size:11px;
}

.delete-mini{
  border:0;
  background:#fff1f2;
  color:#c96b75;
  padding:5px 8px;
  border-radius:8px;
  font-size:11px;
}

/* =========================
   COVER PICKER
========================= */

.cover-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.emoji-input{
  width:75px;
  text-align:center;
  font-size:22px;
}

.cover-help{
  color:var(--muted);
  font-size:12px;
}

/* =========================
   SUMMARY
========================= */

.summary-tabs{
  display:flex;
  gap:6px;
  overflow:auto;
  padding-bottom:5px;
  margin-bottom:15px;
}

.summary-tab{
  border:0;
  background:#f7f2f5;
  color:#777;
  padding:10px 16px;
  border-radius:13px;
  white-space:nowrap;
}

.summary-tab.active{
  background:var(--pink);
  color:white;
}

.summary-controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.toggle{
  display:flex;
  background:#f7f2f5;
  border-radius:13px;
  padding:4px;
}

.toggle button{
  flex:1;
  border:0;
  background:transparent;
  padding:9px;
  border-radius:10px;
  color:#888;
}

.toggle button.active{
  background:white;
  color:#b85582;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

/* =========================
   COST MENU
========================= */

.menu-card{
  border:1px solid var(--line);
  border-radius:20px;
  padding:15px;
  margin-bottom:12px;
}

.menu-head{
  display:flex;
  align-items:center;
  gap:11px;
}

.menu-info{
  flex:1;
  min-width:0;
}

.menu-name{
  font-weight:800;
  font-size:17px;
}

.menu-unit{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.menu-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:13px;
}

.menu-stat{
  background:#faf7fa;
  border-radius:12px;
  padding:10px;
}

.menu-stat small{
  display:block;
  color:#9b939a;
  font-size:10px;
}

.menu-stat strong{
  display:block;
  margin-top:2px;
  font-size:15px;
}

.menu-actions{
  display:flex;
  gap:6px;
  justify-content:flex-end;
  margin-top:10px;
}

/* =========================
   INGREDIENT
========================= */

.ingredient{
  border:1px solid var(--line);
  border-radius:18px;
  padding:13px;
  margin-bottom:10px;
}

.ingredient-top{
  display:flex;
  align-items:center;
  gap:10px;
}

.ingredient-cover{
  width:48px;
  height:48px;
  border-radius:14px;
  background:#faf5f8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
}

.ingredient-info{
  flex:1;
  min-width:0;
}

.ingredient-name{
  font-weight:800;
}

.ingredient-sub{
  color:var(--muted);
  font-size:12px;
}

.switch{
  position:relative;
  width:58px;
  height:32px;
  flex:none;
}

.switch input{
  opacity:0;
  width:0;
  height:0;
}

.slider{
  position:absolute;
  inset:0;
  border-radius:30px;
  background:#eee7eb;
  transition:.2s;
}

.slider:before{
  content:"";
  position:absolute;
  width:25px;
  height:25px;
  left:4px;
  top:3.5px;
  background:white;
  border-radius:50%;
  transition:.2s;
  box-shadow:0 2px 5px rgba(0,0,0,.15);
}

.switch input:checked + .slider{
  background:#63b28a;
}

.switch input:checked + .slider:before{
  transform:translateX(25px);
}

.quantity-row{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:10px;
}

.qty-btn{
  width:34px;
  height:34px;
  border:0;
  border-radius:10px;
  background:#f6eef3;
  color:#a9557e;
  font-weight:800;
}

.qty-input{
  width:75px;
  text-align:center;
  padding:7px;
}

.ingredient-total{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:10px;
  padding-top:10px;
  border-top:1px dashed var(--line);
}

.cost-total-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.total-box{
  background:#faf6fa;
  border-radius:15px;
  padding:12px 15px;
}

.total-box small{
  display:block;
  color:#9a9299;
}

.total-box strong{
  font-size:20px;
}

.delete-cost{
  border:0;
  background:#fff0f2;
  color:#c96873;
  border-radius:12px;
  padding:10px 13px;
}

/* =========================
   MAP
========================= */

.map-area{
  min-height:520px;
  background:#fff;
  border:2px dashed #eadde5;
  border-radius:22px;
  padding:18px;
  position:relative;
  overflow:hidden;
}

.map-item{
  position:absolute;
  background:#fff0f7;
  border:1px solid #e8c8d8;
  border-radius:16px;
  padding:15px;
  text-align:center;
  font-weight:700;
}

.map-table1{
  left:8%;
  top:12%;
  width:30%;
}

.map-table2{
  right:8%;
  top:12%;
  width:30%;
}

.map-table3{
  left:30%;
  bottom:18%;
  width:40%;
}

.map-bath{
  left:5%;
  bottom:5%;
  width:25%;
  background:#f0f6ff;
}

.map-note{
  right:5%;
  bottom:5%;
  width:30%;
  background:#f7f7f7;
}

/* =========================
   EMPTY
========================= */

.empty{
  text-align:center;
  padding:30px 15px;
  color:#a29aa1;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(35,25,32,.35);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:100;
  padding:12px;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:white;
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  border-radius:25px;
  padding:22px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.modal-title{
  font-size:21px;
  font-weight:800;
}

.close{
  border:0;
  background:#f6f1f4;
  width:35px;
  height:35px;
  border-radius:50%;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

  .app{
    padding:10px;
  }

  .topbar{
    border-radius:20px;
    padding:5px;
  }

  .nav-btn{
    min-height:65px;
    padding:8px 4px;
  }

  .nav-icon{
    font-size:22px;
  }

  .nav-text{
    font-size:11px;
  }

  .card{
    padding:17px;
    border-radius:21px;
  }

  .form-grid,
  .summary-controls{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .stats .stat:last-child{
    grid-column:1 / -1;
  }

  .menu-stats{
    grid-template-columns:1fr 1fr 1fr;
  }

  .shop-title{
    font-size:21px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- NAV -->
  <nav class="topbar">

    <button class="nav-btn active" data-page="account">
      <span class="nav-icon">📒</span>
      <span class="nav-text">บัญชี</span>
    </button>

    <button class="nav-btn" data-page="summary">
      <span class="nav-icon">📊</span>
      <span class="nav-text">สรุป</span>
    </button>

    <button class="nav-btn" data-page="map">
      <span class="nav-icon">🗺️</span>
      <span class="nav-text">แผนผัง</span>
    </button>

    <button class="nav-btn" data-page="cost">
      <span class="nav-icon">🧮</span>
      <span class="nav-text">ต้นทุน</span>
    </button>

  </nav>

  <main id="appContent"></main>

</div>


<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle"></div>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <div id="modalContent"></div>
  </div>
</div>


<script>

/* =========================================================
   DATA
========================================================= */

const STORAGE_KEY = "my_account_book_v8";

const defaultData = {
  shopName:"สมุดบัญชี",
  records:[],
  menus:[],
  ingredients:[],
  coverMap:{}
};

let data = loadData();

let currentPage = "account";

let summaryMode = "day";
let summaryDisplay = "detail";

let summaryDate = todayISO();
let summaryMonth = new Date().toISOString().slice(0,7);
let summaryYear = String(new Date().getFullYear());

/* =========================================================
   STORAGE
========================================================= */

function loadData(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));

    if(!saved) return structuredClone(defaultData);

    return {
      ...structuredClone(defaultData),
      ...saved,
      records:Array.isArray(saved.records)?saved.records:[],
      menus:Array.isArray(saved.menus)?saved.menus:[],
      ingredients:Array.isArray(saved.ingredients)?saved.ingredients:[],
      coverMap:saved.coverMap || {}
    };

  }catch(e){
    return structuredClone(defaultData);
  }
}

function saveData(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}

/* =========================================================
   BASIC
========================================================= */

function money(n){
  n = Number(n) || 0;

  return "฿" + n.toLocaleString("th-TH",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}

function todayISO(){
  const d = new Date();
  const offset = d.getTimezoneOffset();
  return new Date(d.getTime()-offset*60000)
    .toISOString()
    .slice(0,10);
}

function esc(str){
  return String(str ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function id(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

function formatDate(date){
  if(!date) return "";

  const d = new Date(date+"T00:00:00");

  return d.toLocaleDateString("th-TH",{
    day:"numeric",
    month:"short",
    year:"numeric"
  });
}

function coverFor(name){
  const key = String(name || "").trim().toLowerCase();

  return data.coverMap[key] || "";
}

function setCover(name,emoji){
  const key = String(name || "").trim().toLowerCase();

  if(!key) return;

  if(emoji){
    data.coverMap[key] = emoji;
  }else{
    delete data.coverMap[key];
  }

  saveData();
}

/* =========================================================
   NAVIGATION
========================================================= */

document.querySelectorAll(".nav-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    currentPage = btn.dataset.page;

    document.querySelectorAll(".nav-btn")
      .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    render();
    window.scrollTo({top:0,behavior:"smooth"});
  });
});

/* =========================================================
   HEADER
========================================================= */

function headerHTML(){

  return `
    <div class="header">

      <div class="shop-title">
        ${esc(data.shopName)}
      </div>

      <button class="title-edit"
              onclick="editShopName()">
        แก้ชื่อ
      </button>

    </div>
  `;
}

function editShopName(){

  openModal(
    "แก้ชื่อด้านบน",
    `
      <div class="field">
        <label>ชื่อที่ต้องการให้แสดงตรงมุมซ้ายบน</label>
        <input id="shopNameInput"
               value="${esc(data.shopName)}"
               placeholder="เช่น สมุดบัญชี">
      </div>

      <button class="btn btn-pink"
              onclick="saveShopName()">
        บันทึก
      </button>
    `
  );
}

function saveShopName(){

  const value =
    document.getElementById("shopNameInput").value.trim();

  data.shopName = value || "สมุดบัญชี";

  saveData();
  closeModal();
  render();
}

/* =========================================================
   ACCOUNT PAGE
========================================================= */

function renderAccount(){

  const income =
    data.records
      .filter(x=>x.type==="income")
      .reduce((s,x)=>s + Number(x.total||0),0);

  const expense =
    data.records
      .filter(x=>x.type==="expense")
      .reduce((s,x)=>s + Number(x.total||0),0);

  const balance = income-expense;

  const records = [...data.records]
    .sort((a,b)=>String(b.date).localeCompare(String(a.date)));

  return `

    ${headerHTML()}

    <section class="card soft-card">

      <h2 class="card-title">📒 บัญชี</h2>

      <div class="card-sub">
        บันทึกรายรับและรายจ่ายแบบง่าย ๆ
      </div>

      <div class="stats">

        <div class="stat">
          <div class="stat-label">รายรับทั้งหมด</div>
          <div class="stat-value income">
            ${money(income)}
          </div>
        </div>

        <div class="stat">
          <div class="stat-label">รายจ่ายทั้งหมด</div>
          <div class="stat-value expense">
            ${money(expense)}
          </div>
        </div>

        <div class="stat">
          <div class="stat-label">คงเหลือ</div>
          <div class="stat-value balance">
            ${money(balance)}
          </div>
        </div>

      </div>

    </section>


    <section class="card">

      <h2 class="section-title">
        เพิ่มรายการ
      </h2>

      <div class="form-grid">

        <div class="field">
          <label>ประเภท</label>
          <select id="recordType">
            <option value="income">รายรับ</option>
            <option value="expense">รายจ่าย</option>
          </select>
        </div>

        <div class="field">
          <label>วันที่</label>
          <input type="date"
                 id="recordDate"
                 value="${summaryDate}">
        </div>

        <div class="field">
          <label>ชื่อรายการ</label>
          <input id="recordName"
                 placeholder="เช่น สตรอว์เบอร์รี">
        </div>

        <div class="field">
          <label>จำนวน</label>
          <input id="recordQty"
                 type="number"
                 min="0"
                 step="any"
                 placeholder="เช่น 10">
        </div>

        <div class="field">
          <label>ราคา / หน่วย</label>
          <input id="recordPrice"
                 type="number"
                 min="0"
                 step="any"
                 placeholder="เช่น 10">
        </div>

        <div class="field">
          <label>รูปปก / Emoji <span class="cover-help">(ใส่เองได้)</span></label>

          <div class="cover-row">

            <input id="recordCover"
                   class="emoji-input"
                   maxlength="4"
                   placeholder="🙂">

            <button class="btn btn-light"
                    onclick="clearInput('recordCover')">
              ลบ
            </button>

          </div>
        </div>

      </div>

      <div class="field">
        <label>หมายเหตุ</label>
        <textarea id="recordNote"

/* =========================================================
   SUMMARY FILTER
========================================================= */

function getSummaryRecords(){

  return data.records.filter(r=>{

    if(summaryMode==="day"){
      return r.date===summaryDate;
    }

    if(summaryMode==="month"){
      return String(r.date).slice(0,7)===summaryMonth;
    }

    if(summaryMode==="year"){
      return String(r.date).slice(0,4)===summaryYear;
    }

    if(summaryMode==="week"){

      const range = getWeekRange(summaryDate);

      return r.date>=range.start &&
             r.date<=range.end;
    }

    return true;
  });
}

function getWeekRange(date){

  const d = new Date(date+"T00:00:00");

  /*
    JS:
    Sunday = 0
    Monday = 1
    ...
    Saturday = 6
  */

  const day = d.getDay();

  const sunday = new Date(d);
  sunday.setDate(d.getDate()-day);

  const saturday = new Date(sunday);
  saturday.setDate(sunday.getDate()+6);

  return {
    start:toISO(sunday),
    end:toISO(saturday)
  };
}

function toISO(d){

  const offset = d.getTimezoneOffset();

  return new Date(
    d.getTime()-offset*60000
  ).toISOString().slice(0,10);
}

function weekLabel(date){

  const r = getWeekRange(date);

  return `${formatDate(r.start)} – ${formatDate(r.end)}`;
}

function yearOptions(selected){

  let html="";

  for(let y=2026;y<=2035;y++){

    html += `
      <option value="${y}"
        ${String(selected)===String(y)?"selected":""}>
        ${y}
      </option>
    `;
  }

  return html;
}

function menuIngredients(menu){

  return (menu.ingredients||[])
    .map(i=>{
      return data.ingredients.find(x=>x.id===i);

    .filter(Boolean);

function menuTotalCost(menu){

  return menuIngredients(menu)
    .filter(i=>i.used)
    .reduce((sum,i)=>{
      return sum + ingredientCost(i);
    },0);

function menuPerPiece(menu){

  const yieldAmount =
    Number(menu.yield)||1;

  return menuTotalCost(menu)/yieldAmount;

function menuProfit(menu){

  return Number(menu.sellPrice||0)-menuPerPiece(menu);

          <small>รวมต้นทุนทั้งหมด</small>

          <strong>
            ${money(total)}
          </strong>

        </div>

        <div class="total-box">

          <small>ต้นทุน / ${esc(menu.unit)}</small>

          <strong class="expense">
            ${money(per)}
          </strong>

        </div>

      </div>

      <br>

      ${
        ingredients.length
        ? ingredients.map(i=>ingredientHTML(i,menu)).join("")
        : `<div class="empty">ยังไม่มีวัตถุดิบ</div>`
      }

    </section>


    <section class="card">

      <h2 class="section-title">
        เพิ่มวัตถุดิบ
      </h2>

      <div class="form-grid">

        <div class="field">

          <label>ชื่อวัตถุดิบ</label>

          <input id="newIngName"
                 placeholder="เช่น แป้ง">

        </div>

        <div class="field">

          <label>จำนวนซื้อ</label>

          <div class="quantity-row">

            <button class="qty-btn"
                    onclick="changeNewQty(-1)">
              −
            </button>

            <input id="newIngQty"
                   class="qty-input"
                   type="number"
                   min="0"
                   step="any"
                   value="1">

            <button class="qty-btn"
                    onclick="changeNewQty(1)">
              ＋
            </button>

          </div>

        </div>

        <div class="field">

          <label>ราคาต่อชิ้น</label>

          <input id="newIngPrice"
                 type="number"
                 min="0"
                 step="any"
                 placeholder="เช่น 4">

        </div>

        <div class="field">

          <label>ต้นทุนวัตถุดิบ</label>

          <input id="newIngTotal"
                 readonly
                 value="฿0.00">

        </div>

        <div class="field">

          <label>รูปปก / Emoji</label>

          <div class="cover-row">

            <input id="newIngCover"
                   class="emoji-input"
                   maxlength="4"
                   placeholder="🙂">

            <button class="btn btn-light"
                    onclick="clearInput('newIngCover')">
              ลบ
            </button>

          </div>

        </div>

      </div>

      <button class="btn btn-pink"
              onclick="addIngredient('${menu.id}')">
        ＋ เพิ่มวัตถุดิบ
      </button>

    </section>


    <section class="card">

      <div class="cost-total-row">

        <div>

          <div class="card-sub">
            กำไรต่อ ${esc(menu.unit)}
          </div>

          <div class="stat-value income">
            ${money(profit)}
          </div>

        </div>

        <div class="total-box">

          <small>ราคาขาย</small>

          <strong>
            ${money(menu.sellPrice)}
          </strong>

        </div>

      </div>

    </section>
  `;

  const q = document.getElementById("newIngQty");
  const p = document.getElementById("newIngPrice");

  q.addEventListener("input",updateNewIngTotal);
  p.addEventListener("input",updateNewIngTotal);
}

function updateYield(menuId,value){

  const menu =
    data.menus.find(x=>x.id===menuId);

  if(!menu) return;

  menu.yield =
    Math.max(1,Number(value)||1);

  saveData();
  renderMenu(menu);
}

function updateSellPrice(menuId,value){

  const menu =
    data.menus.find(x=>x.id===menuId);

  if(!menu) return;

  menu.sellPrice =
    Math.max(0,Number(value)||0);

  saveData();
  renderMenu(menu);
}

/* =========================================================
   INGREDIENT
========================================================= */

function ingredientCost(i){

  return (
    Number(i.qty)||0
  ) * (
    Number(i.price)||0
  );
}

function ingredientHTML(i,menu){

  const emoji = coverFor(i.name);

  const total = ingredientCost(i);

  return `

    <div class="ingredient">

      <div class="ingredient-top">

        <div class="ingredient-cover">
          ${emoji ? esc(emoji) : ""}
        </div>

        <div class="ingredient-info">

          <div class="ingredient-name">
            ${esc(i.name)}
          </div>

          <div class="ingredient-sub">
            ${i.used ? "ใช้" : "ไม่ใช้"}
          </div>

        </div>


        <label class="switch">

          <input type="checkbox"
                 ${i.used?"checked":""}
                 onchange="
                   toggleIngredient(
                     '${menu.id}',
                     '${i.id}',
                     this.checked
                   )
                 ">

          <span class="slider"></span>

        </label>

      </div>


      <div class="quantity-row">

        <button class="qty-btn"
                onclick="
                  changeIngredientQty(
                    '${menu.id}',
                    '${i.id}',
                    -1
                  )
                ">
          −
        </button>

        <input class="qty-input"
               type="number"
               min="0"
               step="any"
               value="${i.qty}"
               onchange="
                 setIngredientQty(
                   '${menu.id}',
                   '${i.id}',
                   this.value
                 )
               ">

        <button class="qty-btn"
                onclick="
                  changeIngredientQty(
                    '${menu.id}',
                    '${i.id}',
                    1
                  )
                ">
          ＋
        </button>

        <span class="ingredient-sub">
          ซื้อมา
        </span>

      </div>


      <div class="form-grid">

        <div class="field">

          <label>ราคาต่อชิ้น</label>

          <input type="number"
                 min="0"
                 step="any"
                 value="${i.price}"
                 onchange="
                   setIngredientPrice(
                     '${menu.id}',
                     '${i.id}',
                     this.value
                   )
                 ">

        </div>

        <div class="field">

          <label>ต้นทุนวัตถุดิบ</label>

          <input readonly
                 value="${money(total)}">

        </div>

      </div>


      <div class="ingredient-total">

        <div>

          ${i.qty} × ${money(i.price)}

          =
          <strong>${money(total)}</strong>

        </div>

        <div>

          <button class="edit-mini"
                  onclick="
                    editIngredientName(
                      '${menu.id}',
                      '${i.id}'
                    )
                  ">
            แก้ชื่อ
          </button>

          <button class="delete-mini"
                  onclick="
                    deleteIngredient(
                      '${menu.id}',
                      '${i.id}'
                    )
                  ">
            ลบ
          </button>

        </div>

      </div>

    </div>
  `;
}

/* =========================================================
   ADD INGREDIENT
========================================================= */

function updateNewIngTotal(){

  const q =
    Number(document.getElementById("newIngQty").value)||0;

  const p =
    Number(document.getElementById("newIngPrice").value)||0;

  document.getElementById("newIngTotal")
    .value = money(q*p);
}

function changeNewQty(amount){

  const input =
    document.getElementById("newIngQty");

  let q = Number(input.value)||0;

  q = Math.max(0,q+amount);

  input.value=q;

  updateNewIngTotal();
}

function addIngredient(menuId){

  const menu =
    data.menus.find(x=>x.id===menuId);

  if(!menu) return;

  const name =
    document.getElementById("newIngName")
      .value.trim();

  const qty =
    Number(document.getElementById("newIngQty").value)||0;

  const price =
    Number(document.getElementById("newIngPrice").value)||0;

  const cover =
    document.getElementById("newIngCover")
      .value.trim();

  if(!name){
    alert("ใส่ชื่อวัตถุดิบก่อนนะ");
    return;
  }

  if(qty<0 || price<0){
    alert("จำนวนและราคาต้องไม่ติดลบ");
    return;
  }

  /*
    วัตถุดิบใหม่
    ค่าเริ่มต้น = ใช้
  */

  const ingredient = {
    id:id(),
    name,
    qty,
    price,
    used:true
  };

  data.ingredients.push(ingredient);

  if(!Array.isArray(menu.ingredients)){
    menu.ingredients=[];
  }

  menu.ingredients.push(ingredient.id);

  if(cover){
    setCover(name,cover);
  }

  saveData();
  renderMenu(menu);
}

/* =========================================================
   INGREDIENT EDIT
========================================================= */

function editIngredientName(menuId,ingredientId){

  const ingredient =
    data.ingredients.find(x=>x.id===ingredientId);

  if(!ingredient) return;

  const emoji = coverFor(ingredient.name);

  openModal(
    "แก้วัตถุดิบ",
    `
      <div class="field">

        <label>ชื่อวัตถุดิบ</label>

        <input id="editIngName"
               value="${esc(ingredient.name)}">

      </div>

      <div class="field">

        <label>รูปปก / Emoji</label>

        <div class="cover-row">

          <input id="editIngCover"
                 class="emoji-input"
                 maxlength="4"
                 value="${esc(emoji)}">

          <button class="btn btn-light"
                  onclick="clearInput('editIngCover')">
            ลบ
          </button>

        </div>

      </div>

      <button class="btn btn-pink"
              onclick="
                saveIngredientName(
                  '${menuId}',
                  '${ingredientId}'
                )
              ">
        บันทึก
      </button>
    `
  );
}

function saveIngredientName(menuId,ingredientId){

  const ingredient =
    data.ingredients.find(x=>x.id===ingredientId);

  const menu =
    data.menus.find(x=>x.id===menuId);

  if(!ingredient || !menu) return;

  const name =
    document.getElementById("editIngName")
      .value.trim();

  const cover =
    document.getElementById("editIngCover")
      .value.trim();

  if(name){
    ingredient.name=name;

    if(cover){
      setCover(name,cover);
    }
  }

  saveData();
  closeModal();
  renderMenu(menu);
}

/* =========================================================
   INGREDIENT QUANTITY / PRICE
========================================================= */

function changeIngredientQty(menuId,ingredientId,amount){

  const ingredient =
    data.ingredients.find(x=>x.id===ingredientId);

  const menu =
    data.menus.find(x=>x.id===menuId);

  if(!ingredient || !menu) return;

  ingredient.qty =
    Math.max(0,(Number(ingredient.qty)||0)+amount);

  saveData();
  renderMenu(menu);
}

function setIngredientQty(menuId,ingredientId,value){

  const ingredient =
    data.ingredients.find(x=>x.id===ingredientId);

  const menu =
    data.menus.find(x=>x.id===menuId);

  if(!ingredient || !menu) return;

  ingredient.qty =
    Math.max(0,Number(value)||0);

  saveData();
  renderMenu(menu);
}

function setIngredientPrice(menuId,ingredientId,value){

  const ingredient =
    data.ingredients.find(x=>x.id===ingredientId);

  const menu =
    data.menus.find(x=>x.id===menuId);

  if(!ingredient || !menu) return;

  ingredient.price =
    Math.max(0,Number(value)||0);

  saveData();
  renderMenu(menu);
}

/* =========================================================
   TOGGLE INGREDIENT
========================================================= */

function toggleIngredient(menuId,ingredientId,used){

  const ingredient =
    data.ingredients.find(x=>x.id===ingredientId);

  const menu =
    data.menus.find(x=>x.id===menuId);

  if(!ingredient || !menu) return;

  ingredient.used=used;

  saveData();
  renderMenu(menu);
}

/* =========================================================
   DELETE INGREDIENT
========================================================= */

function deleteIngredient(menuId,ingredientId){

  const menu =
    data.menus.find(x=>x.id===menuId);

  if(!menu) return;

  if(!confirm("ลบวัตถุดิบนี้ใช่ไหม?")) return;

  menu.ingredients =
    menu.ingredients.filter(x=>x!==ingredientId);

  data.ingredients =
    data.ingredients.filter(x=>x.id!==ingredientId);

  saveData();

  renderMenu(menu);
}

/* =========================================================
   MODAL
========================================================= */

function openModal(title,content){

  document.getElementById("modalTitle")
    .textContent=title;

  document.getElementById("modalContent")
    .innerHTML=content;

  document.getElementById("modal")
    .classList.add("show");
}

function closeModal(){

  document.getElementById("modal")
    .classList.remove("show");
}

function clearInput(inputId){

  const input =
    document.getElementById(inputId);

  if(input){
    input.value="";
  }
}

/* =========================================================
   RENDER
========================================================= */

function render(){

  const app =
    document.getElementById("appContent");

  if(currentPage==="account"){
    app.innerHTML=renderAccount();
    return;
  }

  if(currentPage==="summary"){
    app.innerHTML=renderSummary();
    return;
  }

  if(currentPage==="map"){
    app.innerHTML=renderMap();
    return;
  }

  if(currentPage==="cost"){
    app.innerHTML=renderCost();
    return;
  }
}

/* =========================================================
   START
========================================================= */

render();

</script>

</body>
</html>
