<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fff8fb">
<title>สมุดบัญชี</title>

<style>
:root{
  --bg:#fff8fb;
  --card:#ffffff;
  --ink:#2b2730;
  --muted:#8b848d;
  --line:#eee6eb;
  --pink:#e9a8c1;
  --pink-dark:#c96791;
  --green:#6fb28b;
  --red:#df7d87;
  --shadow:0 8px 25px rgba(90,50,70,.08);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
  "Noto Sans Thai",sans-serif;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.container{
  width:min(900px,100%);
  margin:auto;
  padding:18px;
}

header{
  background:white;
  border-bottom:1px solid var(--line);
  padding:18px;
  position:sticky;
  top:0;
  z-index:10;
}

.header-inner{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.logo{
  font-size:25px;
}

.title{
  font-size:21px;
  font-weight:800;
  flex:1;
}

.subtitle{
  color:var(--muted);
  font-size:13px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.summary{
  border-radius:16px;
  padding:15px;
  background:#fffafb;
  border:1px solid var(--line);
}

.summary small{
  display:block;
  color:var(--muted);
  margin-bottom:7px;
}

.summary strong{
  font-size:21px;
}

.income strong{
  color:var(--green);
}

.expense strong{
  color:var(--red);
}

.balance strong{
  color:var(--pink-dark);
}

.section-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:14px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field.full{
  grid-column:1/-1;
}

label{
  font-size:13px;
  color:var(--muted);
}

input,select{
  width:100%;
  padding:12px 13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:white;
  color:var(--ink);
  outline:none;
}

input:focus,select:focus{
  border-color:var(--pink);
  box-shadow:0 0 0 3px rgba(233,168,193,.15);
}

.type-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.type-btn{
  padding:12px;
  border-radius:12px;
  background:#faf7f9;
  border:1px solid var(--line);
  color:var(--muted);
}

.type-btn.active.income{
  background:#edf8f1;
  color:#3d8a61;
  border-color:#a9d7bb;
}

.type-btn.active.expense{
  background:#fff0f1;
  color:#c85e68;
  border-color:#e6a5aa;
}

.add-btn{
  width:100%;
  margin-top:14px;
  padding:14px;
  border-radius:14px;
  background:var(--pink);
  color:white;
  font-weight:800;
}

.add-btn:active{
  transform:scale(.98);
}

.filter-row{
  display:flex;
  gap:10px;
  align-items:end;
}

.filter-row .field{
  flex:1;
}

.date-filter{
  display:none;
}

.list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.empty{
  text-align:center;
  padding:30px 10px;
  color:var(--muted);
}

.transaction{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:15px;
  background:#fff;
}

.transaction-icon{
  width:42px;
  height:42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  font-size:20px;
}

.transaction-icon.income{
  background:#edf8f1;
}

.transaction-icon.expense{
  background:#fff0f1;
}

.transaction-info{
  flex:1;
  min-width:0;
}

.transaction-name{
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.transaction-meta{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.transaction-amount{
  font-weight:800;
  white-space:nowrap;
}

.transaction-amount.income{
  color:var(--green);
}

.transaction-amount.expense{
  color:var(--red);
}

.delete-btn{
  background:none;
  color:#bbb;
  font-size:18px;
  padding:4px;
}

.delete-btn:hover{
  color:var(--red);
}

.period-title{
  font-size:14px;
  color:var(--muted);
  margin-top:6px;
}

@media(max-width:600px){
  .container{
    padding:12px;
  }

  .summary-grid{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .filter-row{
    flex-direction:column;
    align-items:stretch;
  }

  .header-inner{
    padding:0 3px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">📒</div>
    <div>
      <div class="title">สมุดบัญชี</div>
      <div class="subtitle">รายรับ–รายจ่ายของเรา</div>
    </div>
  </div>
</header>

<main class="container">

  <!-- SUMMARY -->
  <section class="card">

    <div class="section-title">📊 สรุปบัญชี</div>

    <div class="filter-row">

      <div class="field">
        <label>เลือกช่วงเวลาที่ต้องการดู</label>

        <select id="periodSelect">
          <option value="day">📅 รายวัน</option>
          <option value="week">🗓️ รายสัปดาห์</option>
          <option value="month">📆 รายเดือน</option>
          <option value="year">📊 รายปี</option>
          <option value="all">📚 ทั้งหมด</option>
        </select>
      </div>

      <div class="field">
        <label>วันที่อ้างอิง</label>
        <input type="date" id="summaryDate">
      </div>

    </div>

    <div class="period-title" id="periodText"></div>

    <br>

    <div class="summary-grid">

      <div class="summary income">
        <small>💚 รายรับ</small>
        <strong id="totalIncome">฿0.00</strong>
      </div>

      <div class="summary expense">
        <small>❤️ รายจ่าย</small>
        <strong id="totalExpense">฿0.00</strong>
      </div>

      <div class="summary balance">
        <small>💗 คงเหลือ</small>
        <strong id="totalBalance">฿0.00</strong>
      </div>

    </div>

  </section>


  <!-- ADD TRANSACTION -->
  <section class="card">

    <div class="section-title">➕ เพิ่มรายการ</div>

    <div class="form-grid">

      <div class="field full">
        <label>ประเภท</label>

        <div class="type-buttons">

          <button
            class="type-btn active income"
            id="incomeBtn"
            onclick="setType('income')">
            💚 เพิ่มรายรับ
          </button>

          <button
            class="type-btn expense"
            id="expenseBtn"
            onclick="setType('expense')">
            ❤️ เพิ่มรายจ่าย
          </button>

        </div>
      </div>


      <div class="field">
        <label>ชื่อรายการ / ชื่อร้าน</label>
        <input
          id="nameInput"
          type="text"
          placeholder="เช่น ร้านก๋วยเตี๋ยว">
      </div>


      <div class="field">
        <label>จำนวนเงิน (บาท)</label>
        <input
          id="amountInput"
          type="number"
          inputmode="decimal"
          min="0"
          step="0.01"
          placeholder="0.00">
      </div>


      <div class="field">
        <label>วันที่</label>
        <input id="dateInput" type="date">
      </div>


      <div class="field">
        <label>หมวดหมู่</label>

        <select id="categoryInput">
          <option value="อาหาร">🍜 อาหาร</option>
          <option value="เครื่องดื่ม">🥤 เครื่องดื่ม</option>
          <option value="เดินทาง">🚗 เดินทาง</option>
          <option value="ช้อปปิ้ง">🛍️ ช้อปปิ้ง</option>
          <option value="เรียน">📚 การเรียน</option>
          <option value="บิล">🧾 บิล/ค่าใช้จ่าย</option>
          <option value="เงินเดือน">💰 เงินเดือน</option>
          <option value="อื่นๆ">📦 อื่นๆ</option>
        </select>

      </div>


      <div class="field full">
        <label>หมายเหตุ</label>

        <input
          id="noteInput"
          type="text"
          placeholder="ใส่รายละเอียดเพิ่มเติม (ถ้ามี)">
      </div>

    </div>

    <button class="add-btn" onclick="addTransaction()">
      💾 บันทึกรายการ
    </button>

  </section>


  <!-- TRANSACTION LIST -->
  <section class="card">

    <div class="section-title">🧾 รายการล่าสุด</div>

    <div id="transactionList" class="list"></div>

  </section>

</main>


<script>

let transactions =
  JSON.parse(localStorage.getItem("accountBookTransactions") || "[]");

let currentType = "income";


/* =========================
   วันที่วันนี้
========================= */

function todayString(){

  const d = new Date();

  const year = d.getFullYear();
  const month = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");

  return `${year}-${month}-${day}`;
}


document.getElementById("dateInput").value = todayString();
document.getElementById("summaryDate").value = todayString();


/* =========================
   เลือกประเภท
========================= */

function setType(type){

  currentType = type;

  const incomeBtn =
    document.getElementById("incomeBtn");

  const expenseBtn =
    document.getElementById("expenseBtn");

  incomeBtn.classList.remove("active");
  expenseBtn.classList.remove("active");

  if(type === "income"){
    incomeBtn.classList.add("active");
  }else{
    expenseBtn.classList.add("active");
  }
}


/* =========================
   เพิ่มรายการ
========================= */

function addTransaction(){

  const name =
    document.getElementById("nameInput").value.trim();

  const amount =
    Number(document.getElementById("amountInput").value);

  const date =
    document.getElementById("dateInput").value;

  const category =
    document.getElementById("categoryInput").value;

  const note =
    document.getElementById("noteInput").value.trim();


  if(!name){
    alert("กรุณาใส่ชื่อรายการหรือชื่อร้าน");
    return;
  }

  if(!amount || amount <= 0){
    alert("กรุณาใส่จำนวนเงิน");
    return;
  }

  if(!date){
    alert("กรุณาเลือกวันที่");
    return;
  }


  const transaction = {

    id: Date.now(),

    type: currentType,

    name: name,

    amount: amount,

    date: date,

    category: category,

    note: note

  };


  transactions.unshift(transaction);

  saveData();

  document.getElementById("nameInput").value = "";
  document.getElementById("amountInput").value = "";
  document.getElementById("noteInput").value = "";

  render();

}


/* =========================
   บันทึกข้อมูล
========================= */

function saveData(){

  localStorage.setItem(
    "accountBookTransactions",
    JSON.stringify(transactions)
  );

}


/* =========================
   ลบรายการ
========================= */

function deleteTransaction(id){

  if(!confirm("ต้องการลบรายการนี้ใช่ไหม?")){
    return;
  }

  transactions =
    transactions.filter(item => item.id !== id);

  saveData();

  render();

}


/* =========================
   เช็กช่วงเวลา
========================= */

function isInPeriod(dateString, period, reference){

  const date = new Date(dateString + "T00:00:00");

  const ref = new Date(reference + "T00:00:00");


  if(period === "all"){
    return true;
  }


  if(period === "day"){

    return dateString === reference;

  }


  if(period === "month"){

    return (
      date.getFullYear() === ref.getFullYear() &&
      date.getMonth() === ref.getMonth()
    );

  }


  if(period === "year"){

    return (
      date.getFullYear() === ref.getFullYear()
    );

  }


  if(period === "week"){

    const day =
      ref.getDay();

    const diff =
      day === 0 ? -6 : 1 - day;

    const monday =
      new Date(ref);

    monday.setDate(
      ref.getDate() + diff
    );

    monday.setHours(0,0,0,0);


    const sunday =
      new Date(monday);

    sunday.setDate(
      monday.getDate() + 6
    );

    sunday.setHours(23,59,59,999);


    return (
      date >= monday &&
      date <= sunday
    );

  }


  return false;
}


/* =========================
   ข้อความช่วงเวลา
========================= */

function getPeriodText(period, reference){

  const d =
    new Date(reference + "T00:00:00");

  const months = [
    "มกราคม",
    "กุมภาพันธ์",
    "มีนาคม",
    "เมษายน",
    "พฤษภาคม",
    "มิถุนายน",
    "กรกฎาคม",
    "สิงหาคม",
    "กันยายน",
    "ตุลาคม",
    "พฤศจิกายน",
    "ธันวาคม"
  ];


  if(period === "all"){
    return "แสดงรายการทั้งหมด";
  }


  if(period === "day"){

    return `วันที่ ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()+543}`;

  }


  if(period === "month"){

    return `เดือน${months[d.getMonth()]} ${d.getFullYear()+543}`;

  }


  if(period === "year"){

    return `ปี ${d.getFullYear()+543}`;

  }


  if(period === "week"){

    const day =
      d.getDay();

    const diff =
      day === 0 ? -6 : 1 - day;

    const monday =
      new Date(d);

    monday.setDate(
      d.getDate() + diff
    );

    const sunday =
      new Date(monday);

    sunday.setDate(
      monday.getDate() + 6
    );


    return `สัปดาห์ ${monday.getDate()} ${months[monday.getMonth()]} - ${sunday.getDate()} ${months[sunday.getMonth()]} ${sunday.getFullYear()+543}`;

  }

}


/* =========================
   เงิน
========================= */

function money(number){

  return "฿" +
    Number(number).toLocaleString(
      "th-TH",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );

}


/* =========================
   แสดงข้อมูล
========================= */

function render(){

  const period =
    document.getElementById("periodSelect").value;

  const reference =
    document.getElementById("summaryDate").value;


  const filtered =
    transactions.filter(item =>
      isInPeriod(
        item.date,
        period,
        reference
      )
    );


  let income = 0;
  let expense = 0;


  filtered.forEach(item => {

    if(item.type === "income"){
      income += Number(item.amount);
    }else{
      expense += Number(item.amount);
    }

  });


  const balance =
    income - expense;


  document.getElementById("totalIncome")
    .textContent = money(income);

  document.getElementById("totalExpense")
    .textContent = money(expense);

  document.getElementById("totalBalance")
    .textContent = money(balance);


  document.getElementById("periodText")
    .textContent =
    getPeriodText(period, reference);


  renderList(filtered);

}


/* =========================
   รายการ
========================= */

function renderList(items){

  const list =
    document.getElementById("transactionList");


  if(items.length === 0){

    list.innerHTML = `
      <div class="empty">
        🥺<br>
        ยังไม่มีรายการในช่วงเวลานี้
      </div>
    `;

    return;
  }


  list.innerHTML = items
    .map(item => {

      const isIncome =
        item.type === "income";


      const icon =
        isIncome ? "💚" : "❤️";


      const sign =
        isIncome ? "+" : "-";


      const date =
        new Date(
          item.date + "T00:00:00"
        ).toLocaleDateString(
          "th-TH",
          {
            day:"numeric",
            month:"short",
            year:"numeric"
          }
        );


      return `

        <div class="transaction">

          <div class="transaction-icon ${item.type}">
            ${icon}
          </div>

          <div class="transaction-info">

            <div class="transaction-name">
              ${escapeHTML(item.name)}
            </div>

            <div class="transaction-meta">
              ${escapeHTML(item.category)}
              · ${date}
              ${item.note
                ? " · " + escapeHTML(item.note)
                : ""}
            </div>

          </div>

          <div class="transaction-amount ${item.type}">
            ${sign}${money(item.amount)}
          </div>

          <button
            class="delete-btn"
            onclick="deleteTransaction(${item.id})">
            🗑️
          </button>

        </div>

      `;

    })
    .join("");

}


/* =========================
   ป้องกัน HTML แปลกๆ
========================= */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   เปลี่ยนตัวกรอง
========================= */

document
  .getElementById("periodSelect")
  .addEventListener("change", render);

document
  .getElementById("summaryDate")
  .addEventListener("change", render);


/* =========================
   เริ่มต้น
========================= */

render();

</script>

</body>
</html>
