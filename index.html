<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">

<title>สมุดบัญชี</title>

<style>
:root{
  --bg:#fff7fb;
  --card:#fff;
  --soft:#fdf3f8;
  --pink:#cb6393;
  --pink2:#f7e2ec;
  --pink3:#fceef5;
  --ink:#29252b;
  --muted:#968d95;
  --line:#eadfe5;
  --green:#62ad88;
  --red:#d87582;
  --blue:#5699df;
  --shadow:0 8px 28px rgba(180,120,150,.08);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Thai",
    "Noto Sans",
    sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:18px;
  padding-bottom:50px;
}

/* ================= HEADER ================= */

.header{
  background:#fff;
  border-radius:26px;
  padding:10px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  box-shadow:var(--shadow);
  position:sticky;
  top:8px;
  z-index:50;
}

.nav-btn{
  min-height:82px;
  border-radius:22px;
  background:#fff;
  color:#777;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-size:14px;
}

.nav-btn .icon{
  font-size:26px;
  line-height:1;
}

.nav-btn.active{
  background:#f8e3ed;
  color:var(--pink);
  font-weight:700;
}

/* ================= PAGE ================= */

.page{
  display:none;
  margin-top:20px;
}

.page.active{
  display:block;
}

.hero{
  background:linear-gradient(135deg,#fbe9f2,#fff);
  border-radius:28px;
  padding:26px 24px;
  margin-bottom:18px;
}

.hero h1{
  margin:0 0 10px;
  font-size:29px;
}

.hero p{
  margin:0;
  color:var(--muted);
}

.card{
  background:var(--card);
  border-radius:26px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
}

.card h2{
  margin:0 0 18px;
  font-size:23px;
}

label{
  display:block;
  color:var(--muted);
  font-size:14px;
  margin-bottom:7px;
}

input,
select{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  border-radius:17px;
  padding:13px 15px;
  outline:none;
  color:var(--ink);
}

input:focus,
select:focus{
  border-color:#d78caf;
  box-shadow:0 0 0 3px #fbeaf2;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.btn{
  border-radius:16px;
  padding:13px 18px;
  font-weight:700;
}

.btn-primary{
  background:var(--pink);
  color:#fff;
}

.btn-soft{
  background:var(--pink3);
  color:var(--pink);
}

.btn-danger{
  background:#fff0f2;
  color:var(--red);
}

.btn-small{
  padding:8px 11px;
  border-radius:12px;
  font-size:13px;
}

/* ================= ACCOUNT ================= */

.account-tabs{
  display:flex;
  gap:8px;
  margin-bottom:18px;
}

.account-tabs button{
  flex:1;
  padding:12px;
  border-radius:15px;
  background:#fff;
  color:#888;
}

.account-tabs button.active{
  background:var(--pink);
  color:#fff;
}

.transaction{
  border:1px solid var(--line);
  border-radius:21px;
  padding:16px;
  margin-bottom:12px;
  background:#fff;
}

.transaction-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
}

.transaction-name{
  font-size:18px;
  font-weight:700;
}

.transaction-meta{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.amount{
  font-size:18px;
  font-weight:800;
}

.amount.income{
  color:var(--green);
}

.amount.expense{
  color:var(--red);
}

.quantity-control{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:12px;
}

.quantity-control button{
  width:34px;
  height:34px;
  border-radius:11px;
  background:#f8edf3;
  color:var(--pink);
  font-size:20px;
  font-weight:700;
}

.quantity-control input{
  width:70px;
  text-align:center;
  padding:7px;
  border-radius:11px;
}

.edit-mini{
  font-size:11px;
  color:#aaa;
  background:transparent;
  padding:2px 4px;
}

.edit-area{
  display:none;
  margin-top:12px;
  padding-top:12px;
  border-top:1px dashed var(--line);
}

.edit-area.show{
  display:block;
}

/* ================= SUMMARY ================= */

.summary-switch{
  display:flex;
  gap:8px;
  margin-bottom:16px;
}

.summary-switch button{
  flex:1;
  background:#fff;
  color:#888;
  border:1px solid var(--line);
  border-radius:14px;
  padding:11px;
}

.summary-switch button.active{
  background:var(--pink);
  color:#fff;
  border-color:var(--pink);
}

.summary-box{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.summary-stat{
  background:#faf7f9;
  border-radius:18px;
  padding:16px;
}

.summary-stat small{
  color:var(--muted);
}

.summary-stat strong{
  display:block;
  font-size:22px;
  margin-top:5px;
}

.summary-stat.income strong{
  color:var(--green);
}

.summary-stat.expense strong{
  color:var(--red);
}

.summary-list{
  margin-top:18px;
}

/* ================= ALL ITEMS ================= */

.search-box{
  position:relative;
  margin-bottom:15px;
}

.search-box input{
  padding-left:45px;
}

.search-icon{
  position:absolute;
  left:16px;
  top:12px;
  font-size:18px;
}

.all-item{
  border:1px solid var(--line);
  border-radius:20px;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  background:#fff;
}

.all-item-left{
  display:flex;
  gap:12px;
  align-items:center;
}

.cover-small{
  width:48px;
  height:48px;
  border-radius:15px;
  background:#f9edf3;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}

.all-item small{
  color:var(--muted);
}

/* ================= COST ================= */

.cost-create{
  background:linear-gradient(135deg,#fbe9f2,#fff);
}

.cost-create-grid{
  display:grid;
  grid-template-columns:1.5fr 1fr;
  gap:14px;
}

.sales-item{
  border:1px solid var(--line);
  border-radius:22px;
  padding:15px;
  margin-bottom:12px;
  background:#fff;
  display:flex;
  gap:13px;
  align-items:center;
}

.sales-cover{
  width:60px;
  height:60px;
  border-radius:17px;
  background:#f9edf3;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  flex-shrink:0;
}

.sales-main{
  flex:1;
  min-width:0;
}

.sales-name{
  font-size:18px;
  font-weight:800;
}

.sales-detail{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.sales-cost{
  margin-top:8px;
  font-size:14px;
}

.sales-cost strong{
  font-size:17px;
}

.trash-btn{
  width:48px;
  height:48px;
  border-radius:15px;
  background:#fff0f3;
  font-size:21px;
}

.sales-open{
  width:100%;
  text-align:left;
  background:transparent;
  padding:0;
  display:flex;
  align-items:center;
  gap:13px;
}

/* ================= SUB PAGE ================= */

.back-btn{
  background:#f8eef3;
  color:var(--blue);
  padding:10px 15px;
  border-radius:14px;
  margin-bottom:15px;
  font-weight:700;
}

.detail-header{
  background:linear-gradient(135deg,#fbe8f1,#fff);
  border-radius:26px;
  padding:22px;
  margin-bottom:17px;
}

.detail-title{
  display:flex;
  gap:13px;
  align-items:center;
}

.detail-cover{
  width:65px;
  height:65px;
  border-radius:18px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

.detail-title h1{
  margin:0;
  font-size:25px;
}

.detail-title p{
  margin:4px 0 0;
  color:var(--muted);
}

.ingredient{
  border:1px solid var(--line);
  border-radius:22px;
  padding:16px;
  margin-bottom:11px;
  background:#fff;
}

.ingredient-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.ingredient-cover{
  width:52px;
  height:52px;
  border-radius:15px;
  background:#f9edf3;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}

.ingredient-main{
  flex:1;
}

.ingredient-name{
  font-weight:800;
  font-size:17px;
}

.ingredient-short{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.ingredient-short strong{
  color:var(--ink);
}

.ingredient-detail{
  display:none;
  border-top:1px dashed var(--line);
  margin-top:14px;
  padding-top:15px;
}

.ingredient-detail.show{
  display:block;
}

.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.detail-field{
  background:#faf7f9;
  border-radius:16px;
  padding:13px;
}

.detail-field small{
  color:var(--muted);
}

.detail-field strong{
  display:block;
  margin-top:3px;
  font-size:17px;
}

.toggle{
  position:relative;
  width:58px;
  height:32px;
  flex-shrink:0;
}

.toggle input{
  opacity:0;
  width:0;
  height:0;
}

.slider{
  position:absolute;
  inset:0;
  border-radius:30px;
  background:#e5e0e3;
  transition:.2s;
  cursor:pointer;
}

.slider:before{
  content:"";
  position:absolute;
  width:26px;
  height:26px;
  left:3px;
  top:3px;
  background:#fff;
  border-radius:50%;
  box-shadow:0 2px 5px #aaa;
  transition:.2s;
}

.toggle input:checked + .slider{
  background:#62ad88;
}

.toggle input:checked + .slider:before{
  transform:translateX(26px);
}

.stepper{
  display:flex;
  align-items:center;
  gap:8px;
}

.stepper button{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#f8eaf1;
  color:var(--pink);
  font-size:21px;
  font-weight:800;
}

.stepper input{
  width:90px;
  text-align:center;
  padding:9px;
}

.cover-editor{
  display:flex;
  align-items:center;
  gap:10px;
}

.cover-preview{
  width:55px;
  height:55px;
  border-radius:15px;
  background:#f9edf3;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:25px;
}

/* ================= EMPTY ================= */

.empty{
  text-align:center;
  padding:40px 15px;
  color:var(--muted);
}

.empty-icon{
  font-size:42px;
  margin-bottom:8px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:700px){
  .app{
    padding:12px;
  }

  .header{
    top:4px;
    border-radius:22px;
  }

  .nav-btn{
    min-height:70px;
    font-size:12px;
    border-radius:18px;
  }

  .nav-btn .icon{
    font-size:23px;
  }

  .grid2,
  .cost-create-grid,
  .summary-box,
  .detail-grid{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:25px;
  }

  .card{
    padding:18px;
    border-radius:22px;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- ================= NAV ================= -->

<nav class="header">

  <button class="nav-btn active" onclick="showPage('account')">
    <span class="icon">📒</span>
    <span>บัญชี</span>
  </button>

  <button class="nav-btn" onclick="showPage('summary')">
    <span class="icon">📊</span>
    <span>สรุป</span>
  </button>

  <button class="nav-btn" onclick="showPage('all')">
    <span class="icon">📋</span>
    <span>รวมรายการ</span>
  </button>

  <button class="nav-btn" onclick="showPage('cost')">
    <span class="icon">🧮</span>
    <span>ต้นทุน</span>
  </button>

</nav>


<!-- ========================================================= -->
<!-- ======================== บัญชี ========================== -->
<!-- ========================================================= -->

<section id="page-account" class="page active">

  <div class="hero">
    <h1>📒 สมุดบัญชี</h1>
    <p>บันทึกรายรับและรายจ่ายแบบง่าย ๆ</p>
  </div>

  <div class="card">

    <div class="account-tabs">
      <button id="incomeTab" class="active" onclick="setAccountType('income')">
        รายรับ
      </button>

      <button id="expenseTab" onclick="setAccountType('expense')">
        รายจ่าย
      </button>
    </div>

    <div class="grid2">

      <div>
        <label>วันที่</label>
        <input type="date" id="txDate">
      </div>

      <div>
        <label>ชื่อรายการ</label>
        <input id="txName" placeholder="เช่น ขายสตรอว์เบอร์รี่">
      </div>

      <div>
        <label>จำนวน</label>
        <div class="stepper">
          <button onclick="changeInputNumber('txQty',-1)">−</button>
          <input id="txQty" type="number" min="0" value="1">
          <button onclick="changeInputNumber('txQty',1)">+</button>
        </div>
      </div>

      <div>
        <label>ราคา</label>
        <input id="txPrice" type="number" min="0" step="0.01" placeholder="0">
      </div>

    </div>

    <div style="margin-top:14px">
      <label>หมายเหตุ</label>
      <input id="txNote" placeholder="ใส่หรือไม่ใส่ก็ได้">
    </div>

    <button class="btn btn-primary" style="margin-top:16px"
      onclick="addTransaction()">
      ＋ เพิ่มรายการ
    </button>

  </div>

  <div class="card">

    <h2>รายการบัญชี</h2>

    <div id="accountList"></div>

  </div>

</section>


<!-- ========================================================= -->
<!-- ======================== สรุป ============================ -->
<!-- ========================================================= -->

<section id="page-summary" class="page">

  <div class="hero">
    <h1>📊 สรุป</h1>
    <p>เลือกช่วงเวลาที่ต้องการดูข้อมูล</p>
  </div>

  <div class="card">

    <div class="summary-switch">
      <button id="sumDay" class="active" onclick="setSummaryMode('day')">
        วัน
      </button>

      <button id="sumWeek" onclick="setSummaryMode('week')">
        สัปดาห์
      </button>

      <button id="sumMonth" onclick="setSummaryMode('month')">
        เดือน
      </button>

      <button id="sumYear" onclick="setSummaryMode('year')">
        ปี
      </button>
    </div>

    <div id="summaryPicker"></div>

  </div>

  <div class="card">

    <div class="summary-box">

      <div class="summary-stat income">
        <small>รายรับ</small>
        <strong id="sumIncome">฿0.00</strong>
      </div>

      <div class="summary-stat expense">
        <small>รายจ่าย</small>
        <strong id="sumExpense">฿0.00</strong>
      </div>

      <div class="summary-stat">
        <small>คงเหลือ</small>
        <strong id="sumBalance">฿0.00</strong>
      </div>

    </div>

  </div>

  <div class="card">

    <div class="summary-switch">
      <button id="detailNameBtn" class="active"
        onclick="setSummaryDisplay('name')">
        มีชื่อรายการ
      </button>

      <button id="detailNumberBtn"
        onclick="setSummaryDisplay('number')">
        ตัวเลขอย่างเดียว
      </button>
    </div>

    <div id="summaryResult"></div>

  </div>

</section>


<!-- ========================================================= -->
<!-- ====================== รวมรายการ ======================== -->
<!-- ========================================================= -->

<section id="page-all" class="page">

  <div class="hero">
    <h1>📋 รวมรายการ</h1>
    <p>ดูรายการทั้งหมดและค้นหาได้</p>
  </div>

  <div class="card">

    <div class="search-box">
      <span class="search-icon">🔎</span>
      <input id="searchAll"
        placeholder="ค้นหาชื่อรายการ..."
        oninput="renderAllItems()">
    </div>

    <div id="allList"></div>

  </div>

</section>


<!-- ========================================================= -->
<!-- ======================== ต้นทุน ========================== -->
<!-- ========================================================= -->

<section id="page-cost" class="page">

  <div id="costMain">

    <div class="hero">
      <h1>🧮 ต้นทุนต่อเมนู</h1>
      <p>สร้างรายการขาย แล้วเพิ่มวัตถุดิบด้านใน</p>
    </div>

    <div class="card cost-create">

      <h2>สร้างรายการขาย</h2>

      <div class="cost-create-grid">

        <div>
          <label>ชื่อรายการขาย</label>
          <input id="productName"
            placeholder="เช่น สตรอว์เบอร์รี่">
        </div>

        <div>
          <label>หน่วยขาย</label>
          <input id="productUnit"
            placeholder="เช่น แก้ว">
        </div>

      </div>

      <div style="margin-top:14px">

        <label>รูปปก / อิโมจิ</label>

        <div class="cover-editor">

          <div class="cover-preview" id="newProductCoverPreview">
          </div>

          <input id="productCover"
            placeholder="เช่น 🍓 หรือ 🥤">

          <button class="btn btn-small btn-danger"
            onclick="clearNewProductCover()">
            ลบ
          </button>

        </div>

      </div>

      <button class="btn btn-primary"
        style="margin-top:16px"
        onclick="addProduct()">
        ＋ เพิ่มรายการขาย
      </button>

    </div>


    <div class="card">

      <h2>รายการขาย</h2>

      <div id="productList"></div>

    </div>

  </div>


  <!-- ================= PRODUCT DETAIL ================= -->

  <div id="productDetail" style="display:none">

    <button class="back-btn" onclick="closeProductDetail()">
      ← กลับไปรายการขาย
    </button>

    <div id="productDetailContent"></div>

  </div>

</section>

</div>


<script>

/* ============================================================
   STORAGE
============================================================ */

const STORAGE_KEY = "accountBook_v2026";

let data = JSON.parse(
  localStorage.getItem(STORAGE_KEY) || "null"
);

if(!data){

  data = {
    transactions:[],
    products:[]
  };

}

function save(){
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );
}


/* ============================================================
   GLOBAL
============================================================ */

let accountType = "income";

let summaryMode = "day";

let summaryDisplay = "name";

let selectedProductId = null;


/* ============================================================
   UTIL
============================================================ */

function uid(){
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2);
}

function money(n){
  return "฿" + Number(n || 0).toFixed(2);
}

function escapeHTML(str){

  return String(str ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function today(){

  const d = new Date();

  const y = d.getFullYear();

  const m = String(d.getMonth()+1).padStart(2,"0");

  const day = String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;

}

document.getElementById("txDate").value = today();


/* ============================================================
   NAVIGATION
============================================================ */

function showPage(page){

  document.querySelectorAll(".page")
    .forEach(p => p.classList.remove("active"));

  document
    .getElementById("page-"+page)
    .classList.add("active");

  document.querySelectorAll(".nav-btn")
    .forEach(b => b.classList.remove("active"));

  const index = {
    account:0,
    summary:1,
    all:2,
    cost:3
  }[page];

  document
    .querySelectorAll(".nav-btn")[index]
    .classList.add("active");

  if(page === "account") renderAccounts();

  if(page === "summary") renderSummary();

  if(page === "all") renderAllItems();

  if(page === "cost") renderProducts();

  window.scrollTo({
    top:0,
    behavior:"smooth"

  input.value = value;

function addTransaction(){

  const date =
    document.getElementById("txDate").value ||

  const name =
    document.getElementById("txName").value.trim();

  const qty =
    Number(document.getElementById("txQty").value || 0);

  const price =
    Number(document.getElementById("txPrice").value || 0);

  const note =
    document.getElementById("txNote").value.trim();

  if(!name){

    alert("กรุณาใส่ชื่อรายการ");

    return;

  }

  data.transactions.push({

    id:uid(),

    type:accountType,

    date,

    name,

    qty,

    price,

    note

  });

  save();

  document.getElementById("txName").value = "";

  document.getElementById("txQty").value = 1;

  document.getElementById("txPrice").value = "";

  document.getElementById("txNote").value = "";

  renderAccounts();

  renderAllItems();

function changeTransactionQty(id,amount){

  const tx =
    data.transactions.find(x => x.id === id);

  if(!tx) return;

  tx.qty = Math.max(
    0,
    Number(tx.qty || 0) + amount
  );

  save();

  renderAccounts();

}

function updateTransaction(id,field,value){

  const tx =
    data.transactions.find(x => x.id === id);

  if(!tx) return;

  if(field === "qty" || field === "price"){

    value = Number(value || 0);

  }

  tx[field] = value;

  save();

  renderAccounts();

}

function toggleTransactionEdit(id){

    .classList.toggle("show");

function deleteTransaction(id){

  if(!confirm("ลบรายการนี้ใช่ไหม?")) return;

  data.transactions =
    data.transactions.filter(x => x.id !== id);

  save();

  renderAccounts();

  renderAllItems();

}

function getYearOptions(){

  let html = "";

  for(let y=2026;y<=2035;y++){

    html += `
      <option value="${y}">
        ${y}
      </option>
    `;

  }

  return html;

}

function renderSummaryPicker(){

  const box =

  if(summaryMode === "day"){

    box.innerHTML = `
      <label>เลือกวันที่</label>
      <input

        value="${today()}"
        onchange="renderSummary()">
    `;

  }

  if(summaryMode === "week"){

    box.innerHTML = `

      <input

        id="summaryWeekDate"

    `;

  }

  if(summaryMode === "month"){

    const now = new Date();

    box.innerHTML = `

      <div class="grid2">

        <div>

          <select id="summaryMonth"
            onchange="renderSummary()">

            ${Array.from(
              {length:12},
              (_,i)=>`
                <option value="${i+1}"

              `
            ).join("")}

        </div>

          <label>ปี</label>
          <select id="summaryYear"
            onchange="renderSummary()">

            ${getYearOptions()}

          </select>
        </div>

      </div>
    `;

  }

  if(summaryMode === "year"){

    box.innerHTML = `

      <label>ปี</label>

      <select id="summaryYear"
        onchange="renderSummary()">

        ${getYearOptions()}

      </select>

    `;

  }

}

function getSummaryTransactions(){

  let start = "";

  let end = "";

  if(summaryMode === "day"){

    start =
      document.getElementById("summaryDate")?.value ||
      today();

    end = start;

  }

  if(summaryMode === "week"){

    const value =
      document.getElementById("summaryWeekDate")?.value ||
      today();

    const d = new Date(value+"T00:00:00");

    const day = d.getDay();

    const sunday = new Date(d);

    sunday.setDate(
      d.getDate()-day
    );

    const saturday = new Date(sunday);

    saturday.setDate(
      sunday.getDate()+6
    );

    start = formatDate(sunday);

    end = formatDate(saturday);

  }

  if(summaryMode === "month"){

    const y =
      document.getElementById("summaryYear")?.value ||
      2026;

    const m =
      document.getElementById("summaryMonth")?.value ||
      1;

    start =
      `${y}-${String(m).padStart(2,"0")}-01`;

    const last =
      new Date(y,m,0).getDate();

    end =
      `${y}-${String(m).padStart(2,"0")}-${last}`;

  }

  if(summaryMode === "year"){

    const y =
      document.getElementById("summaryYear")?.value ||
      2026;

    start = `${y}-01-01`;

    end = `${y}-12-31`;

  }

  return data.transactions.filter(tx =>
    tx.date >= start &&
    tx.date <= end
  );

}

function formatDate(d){

  const y = d.getFullYear();

  const m =
    String(d.getMonth()+1).padStart(2,"0");

  const day =
    String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;

}

function renderSummary(){

  renderSummaryPicker();

  const list =
    getSummaryTransactions();

  let income = 0;

  let expense = 0;

  list.forEach(tx => {

    const total =
      Number(tx.qty || 0) *
      Number(tx.price || 0);

    if(tx.type === "income")
      income += total;
    else
      expense += total;

  });

  document.getElementById("sumIncome")
    .textContent = money(income);

  document.getElementById("sumExpense")
    .textContent = money(expense);

  document.getElementById("sumBalance")
    .textContent = money(income-expense);

  const box =
    document.getElementById("summaryResult");

  if(!list.length){

    box.innerHTML = `
      <div class="empty">
        ไม่มีรายการในช่วงเวลานี้
      </div>
    `;

    return;

    box.innerHTML = `

        style="margin-bottom:10px">

        <strong>${money(income)}</strong>

      <div class="summary-stat expense"

        <small>คงเหลือ</small>
        <strong>${money(income-expense)}</strong>
      </div>

    `;

    return;

  }

  box.innerHTML = list.map(tx => {

    const total =
      Number(tx.qty || 0) *
      Number(tx.price || 0);

    return `

      <div class="transaction">

        <div class="transaction-top">

          <div>

            <div class="transaction-name">
              ${escapeHTML(tx.name)}
            </div>

            <div class="transaction-meta">

          </div>

          <div class="amount ${tx.type}">

  /*
    ถ้าชื่อเดียวกัน
    ใช้รูปปกเดียวกัน
  */

    data.products.find(
      p => p.name.trim().toLowerCase()
      === name.toLowerCase()

  if(same){

    alert("มีรายการขายชื่อนี้อยู่แล้ว");

    return;

  document.getElementById("productCover").value = "";

  document.getElementById("newProductCoverPreview")

}

document.getElementById("productCover")

function getProductTotalCost(product){

  return product.ingredients
    .filter(i => i.enabled)
    .reduce(
      (sum,i) => sum + ingredientTotal(i),
      0
    );

}

function ingredientTotal(i){

  /*
    จำนวนซื้อ × ราคาที่ซื้อมา
  */

  return Number(i.buyQty || 0) *
         Number(i.buyPrice || 0);

}

  box.innerHTML =
    data.products.map(product => {

      const total =
        getProductTotalCost(product);

        product.ingredients

function updateProduct(id,field,value){

  const product =
    data.products.find(p => p.id === id);

  if(!product) return;

  if(field === "name"){

    const newName =
      String(value).trim();

    if(!newName) return;

    /*
      ถ้ามีชื่อซ้ำ ไม่ให้สร้างชื่อซ้ำ
    */

    const duplicate =
      data.products.find(
        p => p.id !== id &&
        p.name.toLowerCase() === newName.toLowerCase()
      );

    if(duplicate){

      alert("มีรายการขายชื่อนี้อยู่แล้ว");

      renderProductDetail();

      return;

    }

    product.name = newName;

  }else{

    product[field] = value;

  }

  save();

  renderProductDetail();

}

function deleteProduct(id){

  if(!confirm(
    "ลบรายการขายนี้และวัตถุดิบทั้งหมดใช่ไหม?"
  )) return;

  data.products =
    data.products.filter(p => p.id !== id);

  save();

  renderProducts();

}

  renderProductDetail();

}

function clearNewIngredientCover(){

  const input =
    document.getElementById("newIngCover");

  if(input) input.value = "";

  const preview =
    document.getElementById("newIngCoverPreview");

  if(preview) preview.textContent = "";

}

function toggleIngredient(id){

  const product =
    data.products.find(
      p => p.id === selectedProductId
    );

  if(!product) return;

  const ing =
    product.ingredients.find(
      i => i.id === id
    );

  if(!ing) return;

  ing.enabled = !ing.enabled;

  save();

  renderProductDetail();

}

function updateIngredient(id,field,value){

  const product =
    data.products.find(
      p => p.id === selectedProductId
    );

  if(!product) return;

  const ing =
    product.ingredients.find(
      i => i.id === id
    );

  if(!ing) return;

  if(
    field === "buyQty" ||
    field === "buyPrice" ||
    field === "yieldQty"
  ){

    value = Number(value || 0);

  }

  ing[field] = value;

  save();

  renderProductDetail();

}

function changeIngredientQty(id,amount){

  const product =
    data.products.find(
      p => p.id === selectedProductId
    );

  if(!product) return;

  const ing =
    product.ingredients.find(
      i => i.id === id
    );

  if(!ing) return;

  ing.buyQty =
    Math.max(
      0,
      Number(ing.buyQty || 0)+amount
    );

  save();

  renderProductDetail();

}

function toggleIngredientDetail(id){

  const el =
    document.getElementById(
      "ingredient-detail-"+id
    );

  if(el)
    el.classList.toggle("show");

}

function deleteIngredient(id){

  const product =
    data.products.find(
      p => p.id === selectedProductId
    );

  if(!product) return;

  if(!confirm("ลบวัตถุดิบนี้ใช่ไหม?"))
    return;

  product.ingredients =
    product.ingredients.filter(
      i => i.id !== id
    );

  save();

  renderProductDetail();

}

function renderIngredients(){

  const product =
    data.products.find(
      p => p.id === selectedProductId
    );

  const box =
    document.getElementById("ingredientList");

  if(!box || !product) return;

  if(!product.ingredients.length){

    box.innerHTML = `
      <div class="empty">
        ยังไม่มีวัตถุดิบ
      </div>
    `;

    return;

  }

  box.innerHTML =
    product.ingredients.map(ing => {

      const total =
        ingredientTotal(ing);

      return `

        <div class="ingredient">

          <div class="ingredient-row">

            <div class="ingredient-cover">
              ${escapeHTML(ing.cover || "")}
            </div>

            <div class="ingredient-main">

              <div class="ingredient-name">
                ${escapeHTML(ing.name)}
              </div>

              <div class="ingredient-short">

                ${ing.buyQty}
                ×
                ${Number(ing.buyPrice || 0).toFixed(2)}
                =
                <strong>
                  ${money(total)}
                </strong>

              </div>

            </div>


            <label class="toggle">

              <input
                type="checkbox"
                ${ing.enabled ? "checked" : ""}
                onchange="toggleIngredient('${ing.id}')">

              <span class="slider"></span>

            </label>

          </div>


          <div
            style="
              display:flex;
              gap:7px;
              margin-top:12px;">

            <button
              class="btn btn-small btn-soft"
              onclick="toggleIngredientDetail('${ing.id}')">

              รายละเอียด

            </button>

            <button
              class="btn btn-small btn-danger"
              onclick="deleteIngredient('${ing.id}')">

              ลบ

            </button>

          </div>


          <div
            class="ingredient-detail"
            id="ingredient-detail-${ing.id}">

            <div class="detail-grid">

              <div>

                <label>ชื่อวัตถุดิบ</label>

                <input
                  value="${escapeHTML(ing.name)}"
                  onchange="updateIngredient('${ing.id}','name',this.value)">

              </div>


              <div>

                <label>จำนวนซื้อ</label>

                <div class="stepper">

                  <button
                    onclick="changeIngredientQty('${ing.id}',-1)">
                    −
                  </button>

                  <input
                    type="number"
                    min="0"
                    value="${ing.buyQty}"
                    onchange="updateIngredient('${ing.id}','buyQty',this.value)">

                  <button
                    onclick="changeIngredientQty('${ing.id}',1)">
                    +
                  </button>

                </div>

              </div>


              <div>

                <label>ราคาที่ซื้อมา</label>

                <input
                  type="number"
                  min="0"
                  step="0.01"
                  value="${ing.buyPrice}"
                  onchange="updateIngredient('${ing.id}','buyPrice',this.value)">

              </div>


              <div>

                <label>ทำได้ทั้งหมดกี่ชิ้น</label>

                <input
                  type="number"
                  min="0"
                  value="${ing.yieldQty}"
                  onchange="updateIngredient('${ing.id}','yieldQty',this.value)">

              </div>

            </div>


            <div style="margin-top:14px">

              <label>รูปปก / อิโมจิ</label>

              <div class="cover-editor">

                <div class="cover-preview">
                  ${escapeHTML(ing.cover || "")}
                </div>

                <input
                  value="${escapeHTML(ing.cover || "")}"
                  placeholder="ใส่เอง เช่น 🥕"
                  onchange="updateIngredient('${ing.id}','cover',this.value)">

                <button
                  class="btn btn-small btn-danger"
                  onclick="updateIngredient('${ing.id}','cover','')">

                  ลบ

                </button>

              </div>

            </div>


            <div
              style="
                margin-top:14px;
                padding:14px;
                border-radius:16px;
                background:#faf7f9;">

              ต้นทุนวัตถุดิบ

              <strong style="display:block;font-size:20px">
                ${money(total)}
              </strong>

            </div>

          </div>

        </div>

      `;

    }).join("");

}


/* ============================================================
   COVER BY NAME
============================================================ */

function getNameCover(name){

  /*
    ถ้าชื่อเหมือนกัน
    ใช้รูปปกของรายการเดียวกัน
  */

  const product =
    data.products.find(
      p => p.name.trim().toLowerCase()
      === String(name).trim().toLowerCase()
    );

  return product
    ? escapeHTML(product.cover || "")
    : "";

}

renderSummary();

renderAllItems();

renderProducts();

</script>
