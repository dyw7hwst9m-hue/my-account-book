<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#fff7fb">

<title>สมุดบัญชี</title>

<style>
:root{
  --bg:#fff7fb;
  --card:#ffffff;
  --pink:#cc6495;
  --pink2:#f8e3ed;
  --pink3:#fff0f6;
  --ink:#29252b;
  --muted:#99919a;
  --line:#eadfe5;
  --green:#60ad83;
  --red:#d87979;
  --blue:#4d9be8;
  --shadow:0 8px 28px rgba(170,100,135,.08);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Thai",
    "Segoe UI",
    sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  max-width:1100px;
  margin:auto;
  padding:18px;
}

/* =========================
   HEADER
========================= */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}

.logo{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.logo-icon{
  font-size:27px;
}

.shop-title{
  font-size:22px;
  font-weight:800;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.edit-title{
  font-size:12px;
  color:var(--muted);
  background:#f7f0f4;
  border-radius:8px;
  padding:4px 7px;
}

/* =========================
   NAV
========================= */

.nav{
  background:#fff;
  border-radius:24px;
  padding:10px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  box-shadow:var(--shadow);
  margin-bottom:20px;
}

.nav-btn{
  background:#fff;
  color:#706871;
  border-radius:20px;
  padding:12px 6px;
  text-align:center;
  min-height:72px;
}

.nav-btn.active{
  background:#f8e1ec;
  color:var(--pink);
}

.nav-icon{
  display:block;
  font-size:25px;
  margin-bottom:4px;
}

.nav-text{
  font-size:14px;
}

/* =========================
   PAGE
========================= */

.page{
  display:none;
}

.page.active{
  display:block;
}

.card{
  background:var(--card);
  border-radius:28px;
  padding:24px;
  margin-bottom:20px;
  box-shadow:var(--shadow);
}

.card.pink{
  background:
    linear-gradient(
      120deg,
      #fce8f1,
      #fff
    );
}

h1{
  margin:0 0 8px;
  font-size:28px;
}

h2{
  margin:0 0 8px;
  font-size:22px;
}

h3{
  margin:0;
}

.sub{
  color:var(--muted);
  margin-bottom:20px;
}

label{
  display:block;
  color:#9b9299;
  font-size:14px;
  margin-bottom:7px;
}

input,
select{
  width:100%;
  height:54px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:17px;
  padding:0 16px;
  outline:none;
  color:var(--ink);
}

input:focus,
select:focus{
  border-color:#d98caf;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

/* =========================
   BUTTON
========================= */

.btn{
  background:var(--pink);
  color:#fff;
  border-radius:16px;
  padding:13px 20px;
  font-weight:700;
  font-size:16px;
}

.btn.secondary{
  background:#f6edf2;
  color:var(--pink);
}

.btn.small{
  padding:7px 11px;
  font-size:12px;
  border-radius:10px;
}

.btn.danger{
  background:#fff0f0;
  color:#c86c6c;
}

.btn.green{
  background:#e8f7ef;
  color:#4e9d74;
}

.row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.space{
  justify-content:space-between;
}

/* =========================
   ACCOUNT
========================= */

.account-form{
  margin-bottom:22px;
}

.account-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.account-item{
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
  background:#fff;
}

.account-top{
  display:flex;
  gap:12px;
  align-items:center;
}

.account-emoji{
  width:52px;
  height:52px;
  border-radius:16px;
  background:#fff0f6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  flex:none;
}

.account-info{
  flex:1;
  min-width:0;
}

.account-name{
  font-size:17px;
  font-weight:800;
}

.account-note{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}

.account-right{
  text-align:right;
}

.account-money{
  font-weight:800;
  font-size:17px;
}

.income{
  color:var(--green);
}

.expense{
  color:var(--red);
}

.account-edit{
  margin-top:10px;
  display:none;
}

.account-item.editing .account-edit{
  display:block;
}

.mini-edit{
  font-size:11px;
  color:#aaa;
  background:#f8f1f4;
  padding:5px 8px;
  border-radius:8px;
}

.qty-control{
  display:flex;
  align-items:center;
  gap:7px;
}

.qty-btn{
  width:34px;
  height:34px;
  border-radius:10px;
  background:#f7e9ef;
  color:var(--pink);
  font-size:20px;
  font-weight:800;
}

.qty-number{
  min-width:35px;
  text-align:center;
  font-weight:800;
}

/* =========================
   SUMMARY
========================= */

.summary-tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:18px;
}

.summary-tab{
  white-space:nowrap;
  background:#f6edf2;
  color:#8d8089;
  border-radius:14px;
  padding:11px 18px;
}

.summary-tab.active{
  background:var(--pink);
  color:#fff;
}

.summary-controls{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  align-items:end;
}

.summary-mode{
  display:flex;
  gap:8px;
  background:#f8f1f4;
  border-radius:15px;
  padding:5px;
}

.mode-btn{
  padding:9px 12px;
  border-radius:11px;
  background:transparent;
  color:#8d858b;
}

.mode-btn.active{
  background:#fff;
  color:var(--pink);
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.summary-box{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:18px;
}

.stat{
  background:#faf6f8;
  border-radius:18px;
  padding:17px;
}

.stat-label{
  color:#99919a;
  font-size:13px;
}

.stat-value{
  font-size:22px;
  font-weight:800;
  margin-top:5px;
}

.summary-list{
  margin-top:18px;
  display:flex;
  flex-direction:column;
  gap:9px;
}

.summary-row{
  padding:12px 14px;
  background:#faf7f9;
  border-radius:13px;
  display:flex;
  justify-content:space-between;
}

/* =========================
   ALL ITEMS
========================= */

.search{
  position:relative;
  margin-bottom:15px;
}

.search input{
  padding-left:45px;
}

.search-icon{
  position:absolute;
  left:17px;
  top:15px;
  color:#aaa;
}

.filter-row{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:15px;
}

.filter{
  white-space:nowrap;
  padding:9px 14px;
  background:#f6edf2;
  color:#8d8089;
  border-radius:13px;
}

.filter.active{
  background:var(--pink);
  color:#fff;
}

/* =========================
   COST
========================= */

.menu-form{
  margin-top:20px;
}

.menu-list{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.menu-item{
  border:1px solid var(--line);
  border-radius:23px;
  padding:16px;
}

.menu-head{
  display:flex;
  gap:12px;
  align-items:center;
}

.cover{
  width:58px;
  height:58px;
  background:#fff0f6;
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  flex:none;
}

.cover.empty{
  font-size:0;
}

.menu-title{
  flex:1;
}

.menu-name{
  font-weight:800;
  font-size:18px;
}

.menu-unit{
  color:#999;
  font-size:13px;
  margin-top:3px;
}

.menu-actions{
  display:flex;
  align-items:center;
  gap:7px;
}

.trash{
  width:44px;
  height:44px;
  border-radius:14px;
  background:#fff0f3;
  font-size:20px;
}

.total-cost{
  background:#f8f2f5;
  color:#555;
  padding:9px 12px;
  border-radius:12px;
  font-size:12px;
  white-space:nowrap;
}

.total-cost strong{
  color:var(--pink);
  font-size:14px;
}

.menu-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:14px;
}

.menu-stat{
  background:#faf7f9;
  border-radius:14px;
  padding:12px;
}

.menu-stat span{
  display:block;
  color:#999;
  font-size:11px;
}

.menu-stat strong{
  display:block;
  margin-top:4px;
  font-size:17px;
}

/* =========================
   INGREDIENTS
========================= */

.ingredient-section{
  margin-top:16px;
  padding-top:16px;
  border-top:1px solid var(--line);
}

.ingredient{
  border:1px solid var(--line);
  border-radius:19px;
  padding:14px;
  margin-top:10px;
}

.ingredient-top{
  display:flex;
  gap:10px;
  align-items:center;
}

.ingredient-cover{
  width:46px;
  height:46px;
  background:#fff0f6;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
}

.ingredient-info{
  flex:1;
}

.ingredient-name{
  font-weight:800;
}

.ingredient-detail{
  font-size:12px;
  color:#999;
  margin-top:3px;
}

.ingredient-cost{
  font-size:12px;
  color:#999;
  margin-top:8px;
}

.switch{
  width:52px;
  height:30px;
  border-radius:30px;
  background:#ddd;
  padding:3px;
  transition:.2s;
}

.switch::after{
  content:"";
  display:block;
  width:24px;
  height:24px;
  border-radius:50%;
  background:#fff;
  transition:.2s;
  box-shadow:0 1px 4px rgba(0,0,0,.15);
}

.switch.on{
  background:#65b289;
}

.switch.on::after{
  transform:translateX(22px);
}

.ingredient-edit{
  display:none;
  margin-top:12px;
}

.ingredient.editing .ingredient-edit{
  display:block;
}

.cost-summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:15px;
}

.cost-box{
  background:#faf7f9;
  border-radius:17px;
  padding:15px;
}

.cost-box span{
  color:#999;
  font-size:12px;
}

.cost-box strong{
  display:block;
  font-size:22px;
  margin-top:3px;
}

.green-text{
  color:var(--green);
}

/* =========================
   EMOJI
========================= */

.emoji-input{
  max-width:100px;
  text-align:center;
  font-size:24px;
}

.cover-actions{
  display:flex;
  gap:7px;
  margin-top:8px;
}

/* =========================
   EMPTY
========================= */

.empty{
  text-align:center;
  padding:35px 15px;
  color:#aaa;
}

/* =========================
   MODAL
========================= */

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(40,30,35,.35);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:min(500px,100%);
  background:#fff;
  border-radius:25px;
  padding:22px;
}

.modal h2{
  margin-bottom:15px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:15px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .app{
    padding:12px;
  }

  .card{
    padding:18px;
    border-radius:23px;
  }

  h1{
    font-size:24px;
  }

  h2{
    font-size:20px;
  }

  .grid2{
    grid-template-columns:1fr;
  }

  .grid3{
    grid-template-columns:1fr;
  }

  .summary-controls{
    grid-template-columns:1fr;
  }

  .summary-box{
    grid-template-columns:1fr;
  }

  .menu-stats{
    grid-template-columns:1fr 1fr 1fr;
  }

  .menu-head{
    align-items:flex-start;
  }

  .menu-actions{
    flex-direction:column;
  }

  .total-cost{
    order:2;
  }

  .trash{
    order:1;
  }

  .shop-title{
    max-width:180px;
  }

  .nav{
    border-radius:20px;
    padding:7px;
  }

  .nav-btn{
    min-height:66px;
    padding:8px 3px;
  }

  .nav-icon{
    font-size:22px;
  }

  .nav-text{
    font-size:12px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">

    <div class="logo">
      <span class="logo-icon">📒</span>

      <span
        class="shop-title"
        id="shopTitle"
        onclick="openShopName()">
        สมุดบัญชี
      </span>

      <button
        class="edit-title"
        onclick="openShopName()">
        แก้
      </button>
    </div>

  </div>


  <!-- NAV -->
  <nav class="nav">

    <button
      class="nav-btn active"
      data-page="account"
      onclick="showPage('account')">

      <span class="nav-icon">📒</span>
      <span class="nav-text">บัญชี</span>

    </button>


    <button
      class="nav-btn"
      data-page="summary"
      onclick="showPage('summary')">

      <span class="nav-icon">📊</span>
      <span class="nav-text">สรุป</span>

    </button>


    <button
      class="nav-btn"
      data-page="all"
      onclick="showPage('all')">

      <span class="nav-icon">📋</span>
      <span class="nav-text">รวมรายการ</span>

    </button>


    <button
      class="nav-btn"
      data-page="cost"
      onclick="showPage('cost')">

      <span class="nav-icon">🧮</span>
      <span class="nav-text">ต้นทุน</span>

    </button>

  </nav>


  <!-- ==================================================
       ACCOUNT PAGE
  ================================================== -->

  <section
    id="page-account"
    class="page active">

    <div class="card pink">

      <h1>📒 บัญชี</h1>

      <div class="sub">
        บันทึกรายรับและรายจ่ายของร้าน
      </div>


      <div class="grid2 account-form">

        <div>
          <label>ชื่อรายการ</label>

          <input
            id="accountName"
            placeholder="เช่น ขายสตรอว์เบอร์รี่">
        </div>


        <div>
          <label>ราคา / หน่วย</label>

          <input
            id="accountPrice"
            type="number"
            step="0.01"
            placeholder="เช่น 10">
        </div>


        <div>
          <label>จำนวน</label>

          <div class="qty-control">

            <button
              class="qty-btn"
              onclick="changeInputQty(-1)">
              −
            </button>

            <input
              id="accountQty"
              type="number"
              value="1"
              min="0"
              style="text-align:center">

            <button
              class="qty-btn"
              onclick="changeInputQty(1)">
              +
            </button>

          </div>

        </div>


        <div>
          <label>ประเภท</label>

          <select id="accountType">

            <option value="income">
              รายรับ
            </option>

            <option value="expense">
              รายจ่าย
            </option>

          </select>
        </div>


        <div>
          <label>วันที่</label>

          <input
            id="accountDate"
            type="date">

        </div>


        <div>
          <label>รูปปก / อิโมจิ</label>

          <input
            id="accountEmoji"
            class="emoji-input"
            placeholder="ใส่เอง">
        </div>

      </div>


      <button
        class="btn"
        onclick="addAccount()">

        ＋ เพิ่มรายการ

      </button>

    </div>


    <div class="card">

      <div class="row space">
        <h2>🍓 รายการบัญชี</h2>

        <strong id="accountTotal">
          ฿0.00
        </strong>
      </div>


      <div
        id="accountList"
        class="account-list">
      </div>

    </div>

  </section>


  <!-- ==================================================
       SUMMARY PAGE
  ================================================== -->

  <section
    id="page-summary"
    class="page">

    <div class="card">

      <h1>📊 สรุป</h1>

      <div class="sub">
        ดูรายรับ รายจ่าย และกำไรตามช่วงเวลา
      </div>


      <div class="summary-tabs">

        <button
          class="summary-tab active"
          onclick="setSummaryType('day',this)">
          วัน
        </button>

        <button
          class="summary-tab"
          onclick="setSummaryType('week',this)">
          สัปดาห์
        </button>

        <button
          class="summary-tab"
          onclick="setSummaryType('month',this)">
          เดือน
        </button>

        <button
          class="summary-tab"
          onclick="setSummaryType('year',this)">
          ปี
        </button>

      </div>


      <div
        id="summaryControls"
        class="summary-controls">
      </div>


      <div class="summary-box">

        <div class="stat">

          <div class="stat-label">
            รายรับ
          </div>

          <div
            class="stat-value income"
            id="sumIncome">
            ฿0.00
          </div>

        </div>


        <div class="stat">

          <div class="stat-label">
            รายจ่าย
          </div>

          <div
            class="stat-value expense"
            id="sumExpense">
            ฿0.00
          </div>

        </div>


        <div class="stat">

          <div class="stat-label">
            คงเหลือ
          </div>

          <div
            class="stat-value"
            id="sumBalance">
            ฿0.00
          </div>

        </div>

      </div>


      <div
        id="summaryList"
        class="summary-list">
      </div>

    </div>

  </section>


  <!-- ==================================================
       ALL ITEMS PAGE
  ================================================== -->

  <section
    id="page-all"
    class="page">

    <div class="card">

      <h1>📋 รวมรายการ</h1>

      <div class="sub">
        รวมรายการทั้งหมด ค้นหาและกรองได้
      </div>


      <div class="search">

        <span class="search-icon">
          🔎
        </span>

        <input
          id="searchInput"
          placeholder="ค้นหาชื่อรายการ..."
          oninput="renderAllItems()">

      </div>


      <div class="filter-row">

        <button
          class="filter active"
          onclick="setAllFilter('all',this)">
          ทั้งหมด
        </button>

        <button
          class="filter"
          onclick="setAllFilter('income',this)">
          รายรับ
        </button>

        <button
          class="filter"
          onclick="setAllFilter('expense',this)">
          รายจ่าย
        </button>

      </div>


      <div
        id="allList"
        class="account-list">
      </div>

    </div>

  </section>


  <!-- ==================================================
       COST PAGE
  ================================================== -->

  <section
    id="page-cost"
    class="page">

    <div class="card pink">

      <h1>🧮 ต้นทุนต่อเมนู</h1>

      <div class="sub">
        สร้างเมนู แล้วใส่วัตถุดิบด้านใน
      </div>


      <div class="grid2 menu-form">

        <div>

          <label>
            ชื่อเมนู
          </label>

          <input
            id="menuName"
            placeholder="เช่น สตรอว์เบอร์รี่">

        </div>


        <div>

          <label>
            หน่วยขาย
          </label>

          <input
            id="menuUnit"
            placeholder="เช่น แก้ว">

        </div>


        <div>

          <label>
            ราคาขาย / หน่วย
          </label>

          <input

          <label>

          </label>

     SHOP NAME MODAL
================================================== -->

<div
  id="shopModal"
  class="modal-bg">

  <div class="modal">

    <h2>แก้ชื่อร้าน</h2>

    <input
      id="shopNameInput"
      placeholder="เช่น ร้านของมุก">

    <div class="modal-actions">

      <button
        class="btn secondary"
        onclick="closeShopName()">
        ยกเลิก
      </button>

      <button
        class="btn"
        onclick="saveShopName()">

      </button>

    </div>

<script>

/* =====================================================
   DATA
===================================================== */

const KEY = "mook_account_book_v1";

let data = {
  shopName:"สมุดบัญชี",
  accounts:[],
  menus:[]
};

let summaryType = "day";
let summaryMode = "detail";
let allFilter = "all";


/* =====================================================
   LOAD / SAVE
===================================================== */

function loadData(){

  try{

    const saved =
      localStorage.getItem(KEY);

    if(saved){

      const parsed =
        JSON.parse(saved);

      data = {
        ...data,
        ...parsed
      };

    }

  }catch(e){

    console.error(e);

  }

}


function saveData(){

  localStorage.setItem(
    KEY,
    JSON.stringify(data)
  );

}


/* =====================================================
   HELPERS
===================================================== */

function money(n){

  return "฿" +
    Number(n || 0)
      .toLocaleString("th-TH",{
        minimumFractionDigits:2,
        maximumFractionDigits:2
      });

}


function today(){

  const d = new Date();

  const y =
    d.getFullYear();

  const m =
    String(d.getMonth()+1)
      .padStart(2,"0");

  const day =
    String(d.getDate())
      .padStart(2,"0");

  return `${y}-${m}-${day}`;

}


function escapeHTML(str){

  return String(str || "")
    .replace(/[&<>"']/g,function(c){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[c];

    });

}


/* =====================================================
   PAGE
===================================================== */

function showPage(page){

  document
    .querySelectorAll(".page")
    .forEach(p=>{
      p.classList.remove("active");
    });

  document
    .getElementById("page-"+page)
    .classList.add("active");


  document
    .querySelectorAll(".nav-btn")
    .forEach(b=>{
      b.classList.toggle(
        "active",
        b.dataset.page === page
      );
    });


  if(page==="account")
    renderAccounts();

  if(page==="summary")
    renderSummary();

  if(page==="all")
    renderAllItems();

  if(page==="cost")
    renderMenus();

}


/* =====================================================
   SHOP NAME
===================================================== */

function openShopName(){

  document
    .getElementById("shopNameInput")
    .value =
      data.shopName || "สมุดบัญชี";

  document
    .getElementById("shopModal")
    .classList.add("show");

}


function closeShopName(){

  document
    .getElementById("shopModal")
    .classList.remove("show");

}


function saveShopName(){

  const value =
    document
      .getElementById("shopNameInput")
      .value.trim();

  data.shopName =
    value || "สมุดบัญชี";

  saveData();

  document
    .getElementById("shopTitle")
    .textContent =
      data.shopName;

  closeShopName();

}


/* =====================================================
   ACCOUNT
===================================================== */

function changeInputQty(amount){

  const input =
    document.getElementById("accountQty");

  let value =
    Number(input.value || 0);

  value += amount;

  if(value < 0)
    value = 0;

  input.value = value;

}


function addAccount(){

  const name =
    document
      .getElementById("accountName")
      .value.trim();

  const price =
    Number(
      document
        .getElementById("accountPrice")
        .value || 0
    );

  const qty =
    Number(
      document
        .getElementById("accountQty")
        .value || 0
    );

  const type =
    document
      .getElementById("accountType")
      .value;

  const date =
    document
      .getElementById("accountDate")
      .value || today();

  const emoji =
    document
      .getElementById("accountEmoji")
      .value.trim();


  if(!name){

    alert("กรุณาใส่ชื่อรายการ");

    return;

  }


  data.accounts.push({

    id:Date.now(),

    name,

    price,

    qty,

    type,

    date,

    emoji

  });


  saveData();

  document
    .getElementById("accountName")
    .value = "";

  document
    .getElementById("accountPrice")
    .value = "";

  document
    .getElementById("accountQty")
    .value = 1;

  document
    .getElementById("accountEmoji")
    .value = "";


  renderAccounts();

}


function accountAmount(item){

  return Number(item.price || 0) *
         Number(item.qty || 0);

}


function editAccount(id){

  const item =
    data.accounts.find(
      x=>x.id===id
    );

  if(!item) return;

  const el =
    document.querySelector(
      `[data-account-id="${id}"]`
    );

  if(el)
    el.classList.toggle("editing");

}


function saveAccountEdit(id){

  const item =
    data.accounts.find(
      x=>x.id===id
    );

  if(!item) return;


  const el =
    document.querySelector(
      `[data-account-id="${id}"]`
    );


  item.name =
    el.querySelector(".edit-name")
      .value.trim();


  item.qty =
    Number(
      el.querySelector(".edit-qty")
        .value || 0
    );


  item.price =
    Number(
      el.querySelector(".edit-price")
        .value || 0
    );


  item.emoji =
    el.querySelector(".edit-emoji")
      .value.trim();


  saveData();

  renderAccounts();

}


function deleteAccount(id){

  if(!confirm("ลบรายการนี้ใช่ไหม?"))
    return;

  data.accounts =
    data.accounts.filter(
      x=>x.id!==id
    );

  saveData();

  renderAccounts();

}


function changeAccountQty(id,amount){

  const item =
    data.accounts.find(
      x=>x.id===id
    );

  if(!item) return;

  item.qty =
    Math.max(
      0,
      Number(item.qty || 0)+amount
    );

  saveData();

  renderAccounts();

}


function renderAccounts(){

  const list =
    document.getElementById(
      "accountList"
    );

  if(!data.accounts.length){

    list.innerHTML = `
      <div class="empty">
        ยังไม่มีรายการบัญชี
      </div>
    `;

      "accountTotal"
    ).textContent = money(0);

    return;

  }


  const total =
    data.accounts.reduce(
      (sum,item)=>
        sum + accountAmount(item),
      0
    );


  document.getElementById(
    "accountTotal"
  ).textContent =
    money(total);


  list.innerHTML =
    data.accounts
      .slice()
      .reverse()
      .map(item=>{

        const amount =
          accountAmount(item);

        const emoji =
          item.emoji || "";

        return `

        <div
          class="account-item"
          data-account-id="${item.id}">

          <div class="account-top">

            <div class="account-emoji">
              ${escapeHTML(emoji)}
            </div>

            <div class="account-info">

              <div class="account-name">
                ${escapeHTML(item.name)}
              </div>

              <div class="account-note">

                ${Number(item.qty || 0)}
                ×
                ${money(item.price)}
                =
                ${money(amount)}

              </div>

            </div>


            <div class="account-right">

              <div
                class="account-money
                ${item.type==="income"
                  ?"income"
                  :"expense"}">

                ${item.type==="income"
                  ?"+"
                  :"-"}
                ${money(amount)}

              </div>

              <button
                class="mini-edit"
                onclick="editAccount(${item.id})">

                แก้

              </button>

            </div>

          </div>


          <div class="account-edit">

            <div class="grid2">

              <div>

                <label>
                  ชื่อรายการ
                </label>

                <input
                  class="edit-name"
                  value="${escapeHTML(item.name)}">

              </div>


              <div>

                <label>
                  รูปปก
                </label>

                <input
                  class="edit-emoji emoji-input"
                  value="${escapeHTML(emoji)}">

              </div>


              <div>

                <label>
                  จำนวน
                </label>

                <div class="qty-control">

                  <button
                    class="qty-btn"

                    class="edit-qty"

                    min="0"

                  <button
                    class="qty-btn"
                    onclick="changeAccountQty(${item.id},1)">
                    +
                  </button>

                </div>

              </div>


              <div>

                <label>
                  ราคา
                </label>

                <input
                  class="edit-price"
                  type="number"
                  step="0.01"
                  value="${item.price}">

              </div>

            </div>


            <br>

            <div class="row">

              <button
                class="btn small"
                onclick="saveAccountEdit(${item.id})">

                บันทึก

              </button>

              <button
                class="btn small danger"
                onclick="deleteAccount(${item.id})">

                ลบ

              </button>

            </div>

          </div>

        </div>

        `;

      })
      .join("");

}


/* =====================================================
   SUMMARY
===================================================== */

function setSummaryType(type,button){

  summaryType = type;

  document
    .querySelectorAll(".summary-tab")
    .forEach(x=>
      x.classList.remove("active")
    );

  button.classList.add("active");

  renderSummary();

}


function setSummaryMode(mode){

  summaryMode = mode;

  renderSummary();

}


function getWeekRange(dateString){

  const d =
    new Date(
      dateString+"T00:00:00"
    );

  const day =
    d.getDay();

  const start =
    new Date(d);

  start.setDate(
    d.getDate() - day
  );

  const end =
    new Date(start);

  end.setDate(
    start.getDate()+6
  );

  function fmt(x){

    const y=x.getFullYear();

    const m=
      String(x.getMonth()+1)
        .padStart(2,"0");

    const dd=
      String(x.getDate())
        .padStart(2,"0");

    return `${y}-${m}-${dd}`;

  }

  return {
    start:fmt(start),
    end:fmt(end)
  };

}


function inSummary(item){

  if(summaryType==="day"){

    const date =
      document
        .getElementById("summaryDate")
        ?.value || today();

    return item.date===date;

  }


  if(summaryType==="week"){

    const date =
      document
        .getElementById("summaryDate")
        ?.value || today();

    const range =
      getWeekRange(date);

    return item.date>=range.start &&
           item.date<=range.end;

  }


  if(summaryType==="month"){

    const month =
      document
        .getElementById("summaryMonth")
        ?.value || today().slice(0,7);

    return item.date.startsWith(month);

  }


  if(summaryType==="year"){

    const year =
      document
        .getElementById("summaryYear")
        ?.value ||
        today().slice(0,4);

    return item.date.startsWith(year);

  }

  return true;

}


function renderSummary(){

  const controls =
    document.getElementById(
      "summaryControls"
    );


  let html="";


  if(summaryType==="day"){

    html = `

      <div>

        <label>
          เลือกวันที่
        </label>

        <input
          id="summaryDate"
          type="date"
          value="${today()}"
          onchange="renderSummary()">

      </div>

    `;

  }


  if(summaryType==="week"){

    const date =
      document
        .getElementById("summaryDate")
        ?.value || today();

    const range =
      getWeekRange(date);

    html = `

      <div>

        <label>
          เลือกวันที่ในสัปดาห์
        </label>

        <input
          id="summaryDate"
          type="date"
          value="${date}"
          onchange="renderSummary()">

        <div class="sub"
             style="margin:6px 0 0">

          ${range.start}
          ถึง
          ${range.end}

          <br>

          อาทิตย์ – เสาร์

        </div>

      </div>

    `;

  }


  if(summaryType==="month"){

    const value =
      document
        .getElementById("summaryMonth")
        ?.value ||
        today().slice(0,7);

    html = `

      <div>

        <label>
          เลือกเดือน
        </label>

        <input
          id="summaryMonth"
          type="month"
          value="${value}"
          onchange="renderSummary()">

      </div>

    `;

  }


  if(summaryType==="year"){

    const current =
      Number(
        document
          .getElementById("summaryYear")
          ?.value ||
          today().slice(0,4)
      );


    let options="";

    for(let y=2026;y<=2035;y++){

      options += `

        <option
          value="${y}"
          ${y===current?"selected":""}>

          ${y}

        </option>

      `;

    }


    html = `

      <div>

        <label>
          เลือกปี
        </label>

        <select
          id="summaryYear"
          onchange="renderSummary()">

          ${options}

        </select>

      </div>

    `;

  }


  html += `

    <div>

      <label>
        รูปแบบการแสดง
      </label>

      <div class="summary-mode">

        <button
          class="mode-btn
          ${summaryMode==="detail"?"active":""}"
          onclick="setSummaryMode('detail')">

          มีชื่อรายการ

        </button>

        <button
          class="mode-btn
          ${summaryMode==="number"?"active":""}"
          onclick="setSummaryMode('number')">

          ตัวเลขอย่างเดียว

        </button>

      </div>

    </div>

  `;


  controls.innerHTML = html;


  const items =
    data.accounts.filter(inSummary);


  let income=0;
  let expense=0;


  items.forEach(item=>{

    const amount =
      accountAmount(item);

    if(item.type==="income")
      income += amount;
    else
      expense += amount;

  });


  document.getElementById(
    "sumIncome"
  ).textContent = money(income);


  document.getElementById(
    "sumExpense"
  ).textContent = money(expense);


  document.getElementById(
    "sumBalance"
  ).textContent =
    money(income-expense);


  const list =
    document.getElementById(
      "summaryList"
    );


  if(!items.length){

    list.innerHTML = `
      <div class="empty">
        ไม่มีรายการในช่วงเวลานี้
      </div>
    `;

    return;

  }


  if(summaryMode==="number"){

    list.innerHTML = `

      <div class="summary-row">

        <span class="income">
          +${money(income)}
        </span>

        <span class="expense">
          -${money(expense)}
        </span>

      </div>

    `;

    return;

  }


  list.innerHTML =
    items
      .slice()
      .sort(
        (a,b)=>
          a.date.localeCompare(b.date)
      )
      .map(item=>{

        const amount =
          accountAmount(item);

        return `

          <div class="summary-row">

            <span>

              ${escapeHTML(
                item.emoji || ""
              )}

              ${escapeHTML(item.name)}

              <small>
                ${item.date}
              </small>

            </span>

            <strong class="${
              item.type==="income"
                ?"income"
                :"expense"
            }">

              ${
                item.type==="income"
                  ?"+"
                  :"-"
              }

              ${money(amount)}

            </strong>

          </div>

        `;

      })
      .join("");

}


/* =====================================================
   ALL ITEMS
===================================================== */

function setAllFilter(type,button){

  allFilter=type;

  document
    .querySelectorAll(".filter")
    .forEach(x=>
      x.classList.remove("active")
    );

  button.classList.add("active");

  renderAllItems();

}


function renderAllItems(){

  const list =
    document.getElementById(
      "allList"
    );

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  let items =
    data.accounts.filter(item=>{

      const matchesSearch =
        item.name
          .toLowerCase()
          .includes(search);

      const matchesFilter =
        allFilter==="all" ||
        item.type===allFilter;

      return matchesSearch &&
             matchesFilter;

    });


  if(!items.length){

    list.innerHTML = `
      <div class="empty">
        ไม่พบรายการ
      </div>
    `;

    return;

  }


  list.innerHTML =
    items
      .slice()
      .reverse()
      .map(item=>{

        const amount =
          accountAmount(item);

        return `

          <div class="account-item">

            <div class="account-top">

              <div class="account-emoji">

                ${escapeHTML(
                  item.emoji || ""
                )}

              </div>


              <div class="account-info">

                <div class="account-name">

                  ${escapeHTML(
                    item.name
                  )}

                </div>

                <div class="account-note">

                  ${item.qty}
                  ×
                  ${money(item.price)}
                  =
                  ${money(amount)}

                  ·

                  ${item.date}

                </div>

              </div>


              <div
                class="account-money ${
                  item.type==="income"
                    ?"income"
                    :"expense"
                }">

                ${
                  item.type==="income"
                    ?"+"
                    :"-"
                }

                ${money(amount)}

              </div>

            </div>

          </div>

        `;

      })
      .join("");

}


/* =====================================================
   MENU
===================================================== */

function getMenuEmoji(name,provided){

  if(provided)
    return provided;

  const same =
    data.menus.find(
      x=>x.name===name
    );

  return same?.emoji || "";

}


function addMenu(){

  const name =
    document
      .getElementById("menuName")
      .value.trim();

  const unit =
    document
      .getElementById("menuUnit")
      .value.trim();

  const price =
    Number(
      document
        .getElementById("menuPrice")
        .value || 0
    );

  const emoji =
    document
      .getElementById("menuEmoji")
      .value.trim();


  if(!name){

    alert("กรุณาใส่ชื่อเมนู");

    return;

  }


  const existing =
    data.menus.find(
      x=>x.name===name
    );


  data.menus.push({

    id:Date.now(),

    name,

    unit,

    price,

    emoji:
      emoji ||
      existing?.emoji ||
      "",

    ingredients:[]

  });


  saveData();


  document
    .getElementById("menuName")
    .value="";

  document
    .getElementById("menuUnit")
    .value="";

  document
    .getElementById("menuPrice")
    .value="";

  document
    .getElementById("menuEmoji")
    .value="";


  renderMenus();

}


function menuCost(menu){

  return menu.ingredients
    .filter(x=>x.enabled)
    .reduce(
      (sum,x)=>
        sum + ingredientCost(x),
      0
    );

}


function ingredientCost(x){

  const qty =
    Number(x.purchaseQty || 0);

  const price =
    Number(x.purchasePrice || 0);

  const usable =
    Number(x.usableQty || 0);


  if(qty<=0 || usable<=0)
    return 0;


  const purchaseTotal =
    qty * price;


  return purchaseTotal / usable;

}


function totalIngredientPurchase(x){

  return Number(x.purchaseQty || 0) *
         Number(x.purchasePrice || 0);

}

   MENU EDIT

    data.menus.find(

function deleteMenu(id){

/* =====================================================
   INGREDIENT
===================================================== */

function addIngredient(menuId){

  const menu =
    data.menus.find(
      x=>x.id===menuId
    );

  if(!menu) return;


  const el =
    document.querySelector(
      `[data-menu-id="${menuId}"]`
    );


  const name =
    el.querySelector(
      ".new-ing-name"
    ).value.trim();


  const purchaseQty =
    Number(
      el.querySelector(
        ".new-ing-qty"
      ).value || 0
    );


  const purchasePrice =
    Number(
      el.querySelector(
        ".new-ing-price"
      ).value || 0
    );


  const usableQty =
    Number(
      el.querySelector(
        ".new-ing-usable"
      ).value || 0
    );


  const emoji =
    el.querySelector(
      ".new-ing-emoji"
    ).value.trim();


  if(!name){

    alert("กรุณาใส่ชื่อวัตถุดิบ");

    return;

  }


  /* ถ้าชื่อเดียวกัน
     และมีอิโมจิอยู่แล้ว
     ใช้รูปเดิมอัตโนมัติ */

  const same =
    data.menus
      .flatMap(m=>m.ingredients)
      .find(x=>x.name===name);


  menu.ingredients.push({

    id:Date.now(),

    name,

    purchaseQty,

    purchasePrice,

    usableQty,

    emoji:
      emoji ||
      same?.emoji ||
      "",

    enabled:true

  });


  saveData();

  renderMenus();

}


function toggleIngredient(menuId,ingredientId){

  const menu =
    data.menus.find(
      x=>x.id===menuId
    );

  if(!menu) return;


  const ing =
    menu.ingredients.find(
      x=>x.id===ingredientId
    );

  if(!ing) return;


  ing.enabled =
    !ing.enabled;


  saveData();

  renderMenus();

}


function editIngredient(menuId,ingredientId){

  const el =
    document.querySelector(
      `[data-ingredient-id="${ingredientId}"]`
    );

  if(el)
    el.classList.toggle("editing");

}


function saveIngredient(menuId,ingredientId){

  const menu =
    data.menus.find(
      x=>x.id===menuId
    );

  if(!menu) return;


  const ing =
    menu.ingredients.find(
      x=>x.id===ingredientId
    );

  const el =
    document.querySelector(
      `[data-ingredient-id="${ingredientId}"]`
    );

  if(!ing || !el) return;


  ing.name =
    el.querySelector(".ing-edit-name")
      .value.trim();


  ing.purchaseQty =
    Number(
      el.querySelector(".ing-edit-qty")
        .value || 0
    );


  ing.purchasePrice =
    Number(
      el.querySelector(".ing-edit-price")
        .value || 0
    );


  ing.usableQty =
    Number(
      el.querySelector(".ing-edit-usable")
        .value || 0
    );


  ing.emoji =
    el.querySelector(".ing-edit-emoji")
      .value.trim();


  saveData();

  renderMenus();

}


function deleteIngredient(menuId,ingredientId){

  const menu =
    data.menus.find(
      x=>x.id===menuId
    );

  if(!menu) return;


  menu.ingredients =
    menu.ingredients.filter(
      x=>x.id!==ingredientId
    );


  saveData();

  renderMenus();

}

/* =====================================================
   EMOJI SYNC
===================================================== */

/*
   ถ้าชื่อเดียวกัน ระบบจะใช้อิโมจิเดียวกัน
   โดยจะทำเฉพาะตอนที่รายการใหม่ไม่ได้ใส่อิโมจิเอง
*/

function syncSameNameEmoji(){

  const emojiMap={};


  data.accounts.forEach(x=>{

    if(x.name && x.emoji)
      emojiMap[x.name]=x.emoji;

  });


  data.menus.forEach(menu=>{

    if(menu.name && menu.emoji)
      emojiMap[menu.name]=menu.emoji;

    menu.ingredients.forEach(ing=>{

      if(ing.name && ing.emoji)
        emojiMap[ing.name]=ing.emoji;

    });

  });


  data.accounts.forEach(x=>{

    if(!x.emoji &&
       emojiMap[x.name]){

      x.emoji =
        emojiMap[x.name];

    }

  });


  data.menus.forEach(menu=>{

    if(!menu.emoji &&
       emojiMap[menu.name]){

      menu.emoji =
        emojiMap[menu.name];

    }

    menu.ingredients.forEach(ing=>{

      if(!ing.emoji &&
         emojiMap[ing.name]){

        ing.emoji =
          emojiMap[ing.name];

      }

    });

  });


  saveData();

}
