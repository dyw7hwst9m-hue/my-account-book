<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">
<title>สมุดบัญชี</title>

<style>
:root{
  --bg:#fff7fb;
  --card:#fff;
  --ink:#29252b;
  --muted:#aaa2aa;
  --line:#f0e2e9;
  --pink:#f7ddea;
  --pink2:#fcecf4;
  --pinkText:#bf6b92;
  --green:#55a878;
  --red:#df7180;
  --blue:#4f7891;
  --soft:#faf4f8;
  --shadow:0 8px 28px rgba(120,75,105,.08);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--ink);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Thai",
    "Noto Sans",
    Arial,
    sans-serif;
}

body{
  min-height:100vh;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  padding:18px 20px 50px;
}

/* =========================
   NAV
========================= */

.nav{
  background:#fff;
  border-radius:28px;
  box-shadow:var(--shadow);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  padding:8px;
  margin-bottom:22px;
}

.nav button{
  border:0;
  background:transparent;
  min-height:92px;
  border-radius:24px;
  color:#777;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:6px;
  font-size:18px;
}

.nav button .icon{
  font-size:32px;
  line-height:1;
}

.nav button.active{
  background:var(--pink);
  color:var(--pinkText);
  font-weight:700;
}

/* =========================
   PAGE
========================= */

.page{
  display:none;
}

.page.active{
  display:block;
}

.card{
  background:var(--card);
  border-radius:30px;
  box-shadow:var(--shadow);
  padding:28px;
  margin-bottom:22px;
}

.page-title{
  margin:0 0 24px;
  font-size:34px;
  font-weight:800;
}

.small-title{
  font-size:18px;
  color:var(--muted);
}

/* =========================
   ACCOUNT
========================= */

.account-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:22px;
}

.account-head h1{
  margin:0;
  font-size:36px;
}

.title-edit{
  border:1px solid var(--line);
  background:#fff;
  color:#1684df;
  border-radius:14px;
  padding:8px 13px;
}

.summary-top{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:22px;
}

.total-box{
  background:#fff8fb;
  border-radius:25px;
  padding:20px;
  text-align:center;
}

.total-box .label{
  color:#999;
  font-size:17px;
  margin-bottom:4px;
}

.total-box .value{
  font-size:30px;
  font-weight:800;
}

.total-box.income .value{
  color:var(--green);
}

.total-box.expense .value{
  color:var(--red);
}

.total-box.balance .value{
  color:var(--blue);
}

.form-grid{
  display:grid;
  grid-template-columns:1.5fr .7fr .8fr .9fr 1.2fr;
  gap:10px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field label{
  color:var(--muted);
  font-size:15px;
}

.field input,
.field select{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  border-radius:15px;
  padding:12px 13px;
  outline:none;
}

.type-buttons{
  display:flex;
  gap:8px;
}

.type-buttons button{
  flex:1;
  border:1px solid var(--line);
  border-radius:15px;
  padding:11px;
  background:#fff;
}

.type-buttons button.active.income{
  background:#eaf8f0;
  color:var(--green);
  border-color:#ccebd9;
}

.type-buttons button.active.expense{
  background:#fff0f2;
  color:var(--red);
  border-color:#f2d2d8;
}

.primary{
  border:0;
  background:var(--pink);
  color:var(--pinkText);
  border-radius:15px;
  padding:12px 18px;
  font-weight:700;
}

.transactions{
  margin-top:25px;
}

.transaction{
  display:grid;
  grid-template-columns:58px 1fr auto;
  align-items:center;
  gap:14px;
  padding:15px 0;
  border-bottom:1px solid var(--line);
}

.transaction:last-child{
  border-bottom:0;
}

.tx-sign{
  width:58px;
  height:58px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:31px;
}

.tx-sign.income{
  background:#fff0f6;
}

.tx-sign.expense{
  background:#fff0f3;
}

.tx-main{
  min-width:0;
}

.tx-name{
  font-size:21px;
  font-weight:700;
  overflow-wrap:anywhere;
}

.tx-meta{
  color:var(--muted);
  margin-top:4px;
  font-size:17px;
}

.tx-right{
  text-align:right;
}

.tx-money{
  font-size:21px;
  font-weight:800;
}

.tx-money.income{
  color:var(--green);
}

.tx-money.expense{
  color:var(--red);
}

.tx-actions{
  display:flex;
  justify-content:flex-end;
  gap:5px;
  margin-top:5px;
}

.edit-btn,
.delete-btn{
  border-radius:12px;
  padding:6px 10px;
  font-size:14px;
  background:#fff;
}

.edit-btn{
  color:#1684df;
  border:1px solid var(--line);
}

.delete-btn{
  border:0;
  background:#fff0f3;
  color:var(--red);
}

/* quantity */

.qty-control{
  display:flex;
  align-items:center;
  gap:5px;
}

.qty-control button{
  width:34px;
  height:34px;
  border:0;
  border-radius:11px;
  background:#faeef4;
  color:#1684df;
  font-size:21px;
}

.qty-control input{
  width:55px;
  height:34px;
  border:0;
  background:transparent;
  text-align:center;
  outline:none;
}

/* =========================
   SUMMARY
========================= */

.summary-card{
  background:#fff;
  border-radius:30px;
  box-shadow:var(--shadow);
  padding:28px;
}

.summary-title{
  font-size:36px;
  font-weight:800;
  margin:0 0 20px;
}

.period-tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:18px;
}

.period-tabs button{
  border:0;
  background:#f8edf3;
  color:#9d8e97;
  border-radius:18px;
  padding:13px 8px;
  font-weight:700;
}

.period-tabs button.active{
  background:var(--pink);
  color:var(--pinkText);
}

.period-area{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:16px;
}

.date-input,
.month-select,
.year-select{
  border:1px solid var(--line);
  background:#fff;
  border-radius:16px;
  padding:12px 15px;
  min-height:48px;
  outline:none;
  color:var(--ink);
}

.summary-mode{
  display:flex;
  gap:8px;
  margin-bottom:22px;
}

.summary-mode button{
  border:1px solid var(--line);
  background:#fff;
  color:#8c828a;
  border-radius:15px;
  padding:10px 18px;
}

.summary-mode button.active{
  background:var(--pink);
  border-color:#f0cada;
  color:var(--pinkText);
  font-weight:700;
}

/* summary total */

.summary-total-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:22px;
}

.summary-total{
  background:#fff8fb;
  border-radius:24px;
  padding:20px 14px;
  text-align:center;
}

.summary-total .label{
  color:#999;
  font-size:17px;
}

.summary-total .value{
  font-size:29px;
  font-weight:800;
  margin-top:2px;
}

.summary-total.income .value{
  color:var(--green);
}

.summary-total.expense .value{
  color:var(--red);
}

.summary-total.balance .value{
  color:var(--blue);
}

/* =========================
   PERIOD GROUPS
========================= */

.period-group{
  border:1px solid #eddce5;
  border-radius:25px;
  overflow:hidden;
  margin-bottom:22px;
  background:#fff;
}

.period-group-head{
  background:#fbe8f2;
  padding:13px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.period-group-title{
  color:#b45c86;
  font-size:21px;
  font-weight:800;
}

.period-group-total{
  color:#9b7d8b;
  font-size:15px;
  font-weight:600;
  white-space:nowrap;
}

.summary-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  align-items:center;
  padding:17px 18px;
  margin:0 18px;
  border-bottom:1px solid var(--line);
}

.summary-row:last-child{
  border-bottom:0;
}

.summary-row-name{
  font-size:18px;
  font-weight:600;
  overflow-wrap:anywhere;
}

.summary-row-meta{
  color:var(--muted);
  font-size:15px;
  margin-top:4px;
}

.summary-row-money{
  font-size:21px;
  font-weight:800;
  text-align:right;
  white-space:nowrap;
}

.summary-row-money.income{
  color:var(--green);
}

.summary-row-money.expense{
  color:var(--red);
}

.number-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:17px 20px;
  border-bottom:1px solid var(--line);
}

.number-row:last-child{
  border-bottom:0;
}

.number-row .num-label{
  color:#777;
}

.number-row .num-value{
  font-size:21px;
  font-weight:800;
}

.empty{
  padding:45px 15px;
  text-align:center;
  color:#aaa;
  font-size:18px;
}

/* =========================
   COMBINED LIST
========================= */

.search{
  width:100%;
  border:1px solid var(--line);
  border-radius:16px;
  padding:13px 15px;
  margin-bottom:18px;
  outline:none;
}

.combined-row{
  display:grid;
  grid-template-columns:50px 1fr auto;
  gap:12px;
  padding:15px 0;
  border-bottom:1px solid var(--line);
  align-items:center;
}

.combined-icon{
  width:50px;
  height:50px;
  border-radius:16px;
  background:#fff0f5;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:27px;
}

.combined-name{
  font-size:19px;
  font-weight:700;
}

.combined-meta{
  color:var(--muted);
  margin-top:3px;
}

.combined-money{
  font-size:20px;
  font-weight:800;
}

/* =========================
   COST
========================= */

.cost-list{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.menu-card{
  border:1px solid var(--line);
  border-radius:25px;
  padding:18px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:15px;
  align-items:center;
}

.menu-left{
  min-width:0;
}

.menu-cover{
  width:60px;
  height:60px;
  border-radius:18px;
  background:#fff0f5;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  margin-right:10px;
  vertical-align:middle;
}

.menu-name{
  font-size:25px;
  font-weight:800;
}

.menu-ingredients{
  color:var(--muted);
  margin-top:5px;
  margin-left:72px;
}

.menu-right{
  text-align:right;
}

.menu-total{
  color:var(--green);
  font-size:21px;
  font-weight:800;
}

.menu-actions{
  display:flex;
  gap:5px;
  justify-content:flex-end;
  margin-top:8px;
}

.cost-button{
  border:1px solid var(--line);
  background:#fff;
  color:#1684df;
  border-radius:12px;
  padding:6px 10px;
}

.cost-delete{
  border:0;
  background:#fff0f3;
  color:var(--red);
  border-radius:12px;
  padding:6px 10px;
}

.add-cost{
  width:100%;
  border:0;
  background:var(--pink);
  color:var(--pinkText);
  border-radius:17px;
  padding:14px;
  font-weight:800;
  margin-bottom:20px;
}

.cost-detail{
  display:none;
}

.cost-detail.active{
  display:block;
}

.back-btn{
  border:0;
  background:#faedf4;
  color:#1684df;
  border-radius:14px;
  padding:9px 14px;
  margin-bottom:18px;
}

.ingredient-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.ingredient-row{
  border:1px solid var(--line);
  border-radius:22px;
  padding:15px;
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:12px;
}

.ingredient-main{
  min-width:0;
}

.ingredient-name{
  font-size:21px;
  font-weight:800;
}

.ingredient-equation{
  color:var(--muted);
  margin-top:4px;
  font-size:16px;
}

.ingredient-actions{
  display:flex;
  align-items:center;
  gap:5px;
  white-space:nowrap;
}

.small-action{
  width:35px;
  height:35px;
  border:0;
  border-radius:11px;
  background:#faeef4;
  color:#1684df;
  font-size:18px;
}

.detail-action{
  border:0;
  background:#f8eef4;
  color:#857680;
  border-radius:11px;
  padding:8px 10px;
  font-size:14px;
}

.switch{
  width:54px;
  height:31px;
  border-radius:20px;
  background:#d9d9d9;
  position:relative;
  border:0;
  padding:0;
}

.switch span{
  width:25px;
  height:25px;
  background:#fff;
  border-radius:50%;
  position:absolute;
  top:3px;
  left:3px;
  transition:.15s;
  box-shadow:0 1px 3px rgba(0,0,0,.15);
}

.switch.on{
  background:#67b48a;
}

.switch.on span{
  left:26px;
}

.ingredient-trash{
  width:35px;
  height:35px;
  border:0;
  border-radius:11px;
  background:#fff0f3;
  font-size:17px;
}

.ingredient-qty{
  display:flex;
  align-items:center;
  gap:4px;
}

.ingredient-qty button{
  width:35px;
  height:35px;
  border:0;
  border-radius:11px;
  background:#faeef4;
  color:#1684df;
  font-size:20px;
}

.ingredient-qty input{
  width:42px;
  border:0;
  text-align:center;
  background:transparent;
  outline:none;
  font-size:17px;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(40,25,35,.25);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
}

.modal.active{
  display:flex;
}

.modal-box{
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:28px;
  padding:25px;
}

.modal-box h2{
  margin:0 0 20px;
}

.modal-actions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:20px;
}

.cancel-btn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:14px;
  padding:11px 17px;
}

.save-btn{
  border:0;
  background:var(--pink);
  color:var(--pinkText);
  border-radius:14px;
  padding:11px 20px;
  font-weight:700;
}

.form-row{
  margin-bottom:13px;
}

.form-row label{
  display:block;
  color:#8d838b;
  margin-bottom:6px;
}

.form-row input,
.form-row select{
  width:100%;
  border:1px solid var(--line);
  border-radius:15px;
  padding:12px;
  outline:none;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){
  .app{
    padding:10px 16px 40px;
  }

  .nav button{
    min-height:75px;
    font-size:14px;
  }

  .nav button .icon{
    font-size:27px;
  }

  .card,
  .summary-card{
    padding:20px;
  }

  .form-grid{
    grid-template-columns:1fr 1fr;
  }

  .summary-total-grid{
    grid-template-columns:1fr 1fr 1fr;
  }
}

@media(max-width:650px){
  .nav{
    border-radius:22px;
    gap:3px;
    padding:5px;
  }

  .nav button{
    min-height:70px;
    border-radius:18px;
  }

  .nav button .icon{
    font-size:25px;
  }

  .page-title,
  .summary-title{
    font-size:29px;
  }

  .summary-total-grid{
    gap:7px;
  }

  .summary-total{
    padding:14px 6px;
  }

  .summary-total .label{
    font-size:14px;
  }

  .summary-total .value{
    font-size:21px;
  }

  .period-tabs{
    gap:5px;
  }

  .period-tabs button{
    padding:11px 4px;
    font-size:14px;
  }

  .period-area{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .date-input,
  .month-select,
  .year-select{
    width:100%;
  }

  .transaction{
    grid-template-columns:52px 1fr auto;
    gap:8px;
  }

  .tx-sign{
    width:52px;
    height:52px;
  }

  .tx-name{
    font-size:18px;
  }

  .tx-meta{
    font-size:14px;
  }

  .tx-money{
    font-size:18px;
  }

  .edit-btn,
  .delete-btn{
    font-size:12px;
    padding:5px 7px;
  }

  .period-group-head{
    padding:12px;
  }

  .period-group-title{
    font-size:18px;
  }

  .period-group-total{
    font-size:12px;
  }

  .summary-row{
    margin:0 10px;
    padding:15px 7px;
  }

  .summary-row-name{
    font-size:16px;
  }

  .summary-row-money{
    font-size:18px;
  }

  .menu-card{
    grid-template-columns:1fr;
  }

  .menu-right{
    text-align:left;
  }

  .menu-actions{
    justify-content:flex-start;
  }

  .ingredient-row{
    grid-template-columns:1fr;
  }

  .ingredient-actions{
    justify-content:flex-end;
    flex-wrap:nowrap;
    overflow-x:auto;
    padding-bottom:2px;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- =========================
     NAVIGATION
========================= -->

<nav class="nav">
  <button data-page="account" onclick="showPage('account')">
    <span class="icon">📒</span>
    <span>บัญชี</span>
  </button>

  <button data-page="summary" onclick="showPage('summary')">
    <span class="icon">📊</span>
    <span>สรุป</span>
  </button>

  <button data-page="combined" onclick="showPage('combined')">
    <span class="icon">📋</span>
    <span>รวมรายการ</span>
  </button>

  <button data-page="cost" onclick="showPage('cost')">
    <span class="icon">🧮</span>
    <span>ต้นทุน</span>
  </button>
</nav>


<!-- =========================
     PAGE 1 ACCOUNT
========================= -->

<section id="page-account" class="page">

  <div class="card">

    <div class="account-head">
      <h1 id="accountTitle">📒 สมุดบัญชี</h1>
      <button class="title-edit" onclick="editAccountTitle()">แก้ชื่อ</button>
    </div>

    <div class="summary-top">
      <div class="total-box income">
        <div class="label">รายรับ</div>
        <div class="value" id="accountIncome">฿0.00</div>
      </div>

      <div class="total-box expense">
        <div class="label">รายจ่าย</div>
        <div class="value" id="accountExpense">฿0.00</div>
      </div>

      <div class="total-box balance">
        <div class="label">คงเหลือ</div>
        <div class="value" id="accountBalance">฿0.00</div>
      </div>
    </div>

    <div class="form-grid">

      <div class="field">
        <label>รายการ</label>
        <input id="txName" placeholder="เช่น สตรอว์เบอร์รี่">
      </div>

      <div class="field">
        <label>จำนวน</label>
        <div class="qty-control">
          <button onclick="changeTxQty(-1)">−</button>
          <input id="txQty" type="number" value="1" min="1">
          <button onclick="changeTxQty(1)">+</button>
        </div>

<!-- =========================
     JAVASCRIPT
========================= -->

<script>

/* =====================================================
   STORAGE
===================================================== */

const TX_KEY = "myAccountTransactions_v5";
const MENU_KEY = "myAccountMenus_v5";
const TITLE_KEY = "myAccountTitle_v1";


let transactions = loadJSON(TX_KEY, []);
let menus = loadJSON(MENU_KEY, []);

let accountTitle =
  localStorage.getItem(TITLE_KEY) || "สมุดบัญชี";


/* =====================================================
   SUMMARY STATE
   สำคัญ: จะไม่ใช้ new Date() เขียนทับค่าที่ผู้ใช้เลือก
===================================================== */

const today = new Date();

let summaryState = {
  period: "month",
  mode: "items",

  /* ใช้ ISO date เก็บวันที่ที่เลือก */
  date:
    localStorage.getItem("summarySelectedDate_v2")
    || formatISODate(today),

  month:
    Number(localStorage.getItem("summarySelectedMonth_v2"))
    || today.getMonth(),

  year:
    Number(localStorage.getItem("summarySelectedYear_v2"))
    || today.getFullYear()
};


/* =====================================================
   OTHER STATE
===================================================== */

let txType = "income";

let editingTxId = null;

let editingMenuId = null;

let selectedMenuId = null;

let editingIngredientId = null;


/* =====================================================
   HELPERS
===================================================== */

function loadJSON(key, fallback){

  try{
    const raw = localStorage.getItem(key);

    if(!raw) return fallback;

    const parsed = JSON.parse(raw);

    return parsed ?? fallback;

  }catch(e){
    return fallback;
  }
}


function saveTransactions(){

  localStorage.setItem(
    TX_KEY,
    JSON.stringify(transactions)
  );
}


function saveMenus(){

  localStorage.setItem(
    MENU_KEY,
    JSON.stringify(menus)
  );
}


function money(value){

  return "฿" + Number(value || 0).toLocaleString(
    "en-US",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );
}


function formatISODate(date){

  const y = date.getFullYear();

  const m = String(date.getMonth()+1).padStart(2,"0");

  const d = String(date.getDate()).padStart(2,"0");

  return `${y}-${m}-${d}`;
}


function formatThaiDate(iso){

  if(!iso) return "";

  const parts = iso.split("-");

  if(parts.length !== 3) return iso;

  return `${Number(parts[2])} ${thaiMonthShort(Number(parts[1])-1)} ${Number(parts[0])+543}`;
}


function thaiMonth(index){

  return [
    "มกราคม",
    "กุมภาพันธ์",
    "มีนาคม",
    "เมษายน",
    "พฤษภาคม",
    "มิถุนายน",
    "กรกฎาคม",
    "สิงหาคม",
    "กันยายน",
    "ตุลาคม",
    "พฤศจิกายน",
    "ธันวาคม"
  ][index];
}


function thaiMonthShort(index){

  return [
    "ม.ค.",
    "ก.พ.",
    "มี.ค.",
    "เม.ย.",
    "พ.ค.",
    "มิ.ย.",
    "ก.ค.",
    "ส.ค.",
    "ก.ย.",
    "ต.ค.",
    "พ.ย.",
    "ธ.ค."
  ][index];
}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function normalizeName(value){

  return String(value || "")
    .trim()
    .toLowerCase();
}


/* =====================================================
   MIGRATE DATA
===================================================== */

transactions = transactions.map((t,i)=>({

  id:
    t.id ||
    ("tx_" + Date.now() + "_" + i),

  name:
    t.name ??
    t.description ??
    "",

  qty:
    Number(t.qty ?? t.quantity ?? 1) || 1,

  price:
    Number(t.price ?? t.amount ?? 0) || 0,

  date:
    t.date ||
    formatISODate(today),

  type:
    t.type === "expense"
      ? "expense"
      : "income",

  cover:
    t.cover || "",

  note:
    t.note || ""

}));


menus = menus.map((menu,i)=>({

  id:
    menu.id ||
    ("menu_" + Date.now() + "_" + i),

  name:
    menu.name ||
    "รายการขาย",

  cover:
    menu.cover || "",

  ingredients:
    Array.isArray(menu.ingredients)
      ? menu.ingredients.map((ing,j)=>({

          id:
            ing.id ||
            ("ing_" + Date.now() + "_" + i + "_" + j),

          name:
            ing.name || "",

          cover:
            ing.cover || "",

          qty:
            Number(ing.qty ?? ing.quantity ?? 1) || 1,

          price:
            Number(
              ing.price ??
              ing.purchasePrice ??
              0
            ) || 0,

          enabled:
            ing.enabled !== false

        }))
      : []

}));

saveTransactions();
saveMenus();


/* =====================================================
   NAVIGATION
===================================================== */

function showPage(page){

  document
    .querySelectorAll(".page")
    .forEach(el=>{
      el.classList.remove("active");
    });

  document
    .getElementById("page-" + page)
    .classList.add("active");

  document
    .querySelectorAll(".nav button")
    .forEach(btn=>{
      btn.classList.toggle(
        "active",
        btn.dataset.page === page
      );
    });

  if(page === "account"){
    renderAccount();
  }

  if(page === "summary"){
    renderSummary();
  }

  if(page === "combined"){
    renderCombined();
  }

  if(page === "cost"){
    renderMenus();

    if(selectedMenuId){
      openCostDetail(selectedMenuId);
    }
  }
}


/* =====================================================
   ACCOUNT
===================================================== */

function editAccountTitle(){

  const value =
    prompt(
      "แก้ชื่อหน้าบัญชี",
      accountTitle
    );

  if(value === null) return;

  const trimmed = value.trim();

  if(!trimmed) return;

  accountTitle = trimmed;

  localStorage.setItem(
    TITLE_KEY,
    accountTitle
  );

  renderAccount();
}


function setTxType(type){

  txType = type;

  document
    .getElementById("incomeBtn")
    .classList.toggle(
      "active",
      type === "income"
    );

  document
    .getElementById("expenseBtn")
    .classList.toggle(
      "active",
      type === "expense"
    );
}


function changeTxQty(amount){

  const input =
    document.getElementById("txQty");

  let value =
    Number(input.value) || 1;

  value += amount;

  if(value < 1) value = 1;

  input.value = value;
}


function saveTx(){

  const name =
    document
      .getElementById("txName")
      .value
      .trim();

  const qty =
    Number(
      document
        .getElementById("txQty")
        .value
    ) || 1;

  const price =
    Number(
      document
        .getElementById("txPrice")
        .value
    ) || 0;

  const date =
    document
      .getElementById("txDate")
      .value;

  if(!name){

    alert("กรุณาใส่ชื่อรายการ");

    return;
  }

  if(!date){

    alert("กรุณาเลือกวันที่");

    return;
  }

  const tx = {

    id:
      editingTxId ||
      ("tx_" + Date.now()),

    name,

    qty,

    price,

    date,

    type:txType,

    cover:"",

    note:""

  };


  if(editingTxId){

    const index =
      transactions.findIndex(
        x=>x.id === editingTxId
      );

    if(index >= 0){

      transactions[index] = {
        ...transactions[index],
        ...tx
      };

    }

  }else{

    transactions.unshift(tx);

  }


  editingTxId = null;

  saveTransactions();

  clearTxForm();

  renderAccount();

  /* สำคัญ:
     สรุปจะอ่าน transactions ใหม่ทันที */
  renderSummary();

}


function clearTxForm(){

  document
    .getElementById("txName")
    .value = "";

  document
    .getElementById("txQty")
    .value = 1;

  document
    .getElementById("txPrice")
    .value = "";

  document
    .getElementById("txDate")
    .value =
      formatISODate(new Date());

  setTxType("income");

  editingTxId = null;
}


function editTx(id){

  const tx =
    transactions.find(
      x=>x.id === id
    );

  if(!tx) return;

  editingTxId = id;

  document
    .getElementById("txName")
    .value = tx.name;

  document
    .getElementById("txQty")
    .value = tx.qty;

  document
    .getElementById("txPrice")
    .value = tx.price;

  document
    .getElementById("txDate")
    .value = tx.date;

  setTxType(tx.type);

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


function deleteTx(id){

  if(!confirm("ลบรายการนี้หรือไม่?")) return;

  transactions =
    transactions.filter(
      x=>x.id !== id
    );

  saveTransactions();

  renderAccount();
  renderSummary();
  renderCombined();
}


function renderAccount(){

  document
    .getElementById("accountTitle")
    .textContent =
      "📒 " + accountTitle;


  let income = 0;
  let expense = 0;

  transactions.forEach(tx=>{

    const total =
      Number(tx.qty || 0) *
      Number(tx.price || 0);

    if(tx.type === "expense"){
      expense += total;
    }else{
      income += total;
    }

  });


  document
    .getElementById("accountIncome")
    .textContent =
      money(income);

  document
    .getElementById("accountExpense")
    .textContent =
      money(expense);

  document
    .getElementById("accountBalance")
    .textContent =
      money(income-expense);


  const list =
    document.getElementById(
      "transactionList"
    );


  if(!transactions.length){

    list.innerHTML =
      `<div class="empty">ยังไม่มีรายการ</div>`;

    return;
  }


  list.innerHTML =
    transactions.map(tx=>{

      const total =
        Number(tx.qty || 0) *
        Number(tx.price || 0);

      const isIncome =
        tx.type === "income";

      const cover =
        tx.cover || "";

      return `

        <div class="transaction">

          <div class="tx-sign ${isIncome ? "income":"expense"}">
            ${isIncome ? "＋" : "−"}
          </div>

          <div class="tx-main">

            <div class="tx-name">
              ${cover ? escapeHTML(cover)+" " : ""}
              ${escapeHTML(tx.name)}
            </div>

            <div class="tx-meta">
              ${tx.qty} × ${money(tx.price)}
              = ${money(total)}
              · ${tx.date}
            </div>

          </div>

          <div class="tx-right">

            <div class="tx-money ${isIncome ? "income":"expense"}">
              ${isIncome ? "+" : "-"}${money(total)}
            </div>

            <div class="tx-actions">

              <button
                class="edit-btn"
                onclick="editTx('${tx.id}')">
                แก้ไข
              </button>

              <button
                class="delete-btn"
                onclick="deleteTx('${tx.id}')">
                ลบ
              </button>

            </div>

          </div>

        </div>

      `;

    }).join("");
}


/* =====================================================
   SUMMARY PERIOD
===================================================== */

function setSummaryPeriod(period){

  summaryState.period = period;

  saveSummaryState();

  renderSummary();

}


function setSummaryMode(mode){

  summaryState.mode = mode;

  saveSummaryState();

  renderSummary();

}


function saveSummaryState(){

  localStorage.setItem(
    "summarySelectedDate_v2",
    summaryState.date
  );

  localStorage.setItem(
    "summarySelectedMonth_v2",
    String(summaryState.month)
  );

  localStorage.setItem(
    "summarySelectedYear_v2",
    String(summaryState.year)
  );
}


/* =====================================================
   SUMMARY CONTROLS
===================================================== */

function renderSummaryControls(){

  const area =
    document.getElementById(
      "summaryPeriodArea"
    );


  document
    .getElementById("periodDay")
    .classList.toggle(
      "active",
      summaryState.period === "day"
    );

  document
    .getElementById("periodWeek")
    .classList.toggle(
      "active",
      summaryState.period === "week"
    );

  document
    .getElementById("periodMonth")
    .classList.toggle(
      "active",
      summaryState.period === "month"
    );

  document
    .getElementById("periodYear")
    .classList.toggle(
      "active",
      summaryState.period === "year"
    );


  document
    .getElementById("summaryModeItems")
    .classList.toggle(
      "active",
      summaryState.mode === "items"
    );

  document
    .getElementById("summaryModeNumbers")
    .classList.toggle(
      "active",
      summaryState.mode === "numbers"
    );


  /* =========================
     DAY
  ========================= */

  if(summaryState.period === "day"){

    area.innerHTML = `

      <input
        class="date-input"
        id="summaryDateInput"
        type="date"
        value="${summaryState.date}"
      >

    `;

    const input =
      document.getElementById(
        "summaryDateInput"
      );

    input.onchange = function(){

      if(this.value){

        summaryState.date =
          this.value;

        saveSummaryState();

        renderSummary();

      }

    };

  }


  /* =========================
     WEEK
  ========================= */

  else if(summaryState.period === "week"){

    area.innerHTML = `

      <input
        class="date-input"
        id="summaryDateInput"
        type="date"
        value="${summaryState.date}"
      >

    `;

    const input =
      document.getElementById(
        "summaryDateInput"
      );

    input.onchange = function(){

      if(this.value){

        summaryState.date =
          this.value;

        saveSummaryState();

        renderSummary();

      }

    };

  }


  /* =========================
     MONTH
  ========================= */

  else if(summaryState.period === "month"){

    let monthOptions = "";

    for(let i=0;i<12;i++){

      monthOptions += `
        <option
          value="${i}"
          ${i === summaryState.month ? "selected":""}
        >
          ${thaiMonth(i)}
        </option>
      `;

    }


    let yearOptions = "";

    for(let y=2026;y<=2035;y++){

      yearOptions += `
        <option
          value="${y}"
          ${y === summaryState.year ? "selected":""}
        >
          ${y+543}
        </option>
      `;

    }


    area.innerHTML = `

      <select
        id="summaryMonthInput"
        class="month-select">
        ${monthOptions}
      </select>

      <select
        id="summaryYearInput"
        class="year-select">
        ${yearOptions}
      </select>

    `;


    document
      .getElementById(
        "summaryMonthInput"
      )
      .onchange = function(){

        summaryState.month =
          Number(this.value);

        saveSummaryState();

        renderSummary();

      };


    document
      .getElementById(
        "summaryYearInput"
      )
      .onchange = function(){

        summaryState.year =
          Number(this.value);

        saveSummaryState();

        renderSummary();

      };

  }


  /* =========================
     YEAR
  ========================= */

  else{

    let yearOptions = "";

    for(let y=2026;y<=2035;y++){

      yearOptions += `
        <option
          value="${y}"
          ${y === summaryState.year ? "selected":""}
        >
          ${y+543}
        </option>
      `;

    }


    area.innerHTML = `

      <select
        id="summaryYearInput"
        class="year-select">
        ${yearOptions}
      </select>

    `;


    document
      .getElementById(
        "summaryYearInput"
      )
      .onchange = function(){

        summaryState.year =
          Number(this.value);

        saveSummaryState();

        renderSummary();

      };

  }

}


/* =====================================================
   SUMMARY DATE RANGE
===================================================== */

function getSummaryRange(){

  const period =
    summaryState.period;


  /* DAY */

  if(period === "day"){

    return {
      start:summaryState.date,
      end:summaryState.date
    };

  }


  /* WEEK
     Sunday -> Saturday
  */

  if(period === "week"){

    const d =
      new Date(
        summaryState.date + "T12:00:00"
      );

    const day =
      d.getDay();

    const start =
      new Date(d);

    start.setDate(
      d.getDate() - day
    );

    const end =
      new Date(start);

    end.setDate(
      start.getDate() + 6
    );

    return {
      start:formatISODate(start),
      end:formatISODate(end)
    };

  }


  /* MONTH */

  if(period === "month"){

    const start =
      new Date(
        summaryState.year,
        summaryState.month,
        1
      );

    const end =
      new Date(
        summaryState.year,
        summaryState.month + 1,
        0
      );

    return {
      start:formatISODate(start),
      end:formatISODate(end)
    };

  }


  /* YEAR */

  const start =
    new Date(
      summaryState.year,
      0,
      1
    );

  const end =
    new Date(
      summaryState.year,
      11,
      31
    );

  return {
    start:formatISODate(start),
    end:formatISODate(end)
  };

}


/* =====================================================
   FILTER TRANSACTIONS
===================================================== */

function getSummaryTransactions(){

  const range =
    getSummaryRange();

  return transactions
    .filter(tx=>{

      return (
        tx.date >= range.start &&
        tx.date <= range.end
      );

    })
    .sort((a,b)=>
      a.date.localeCompare(b.date)
    );

}


/* =====================================================
   SUMMARY GROUPING
===================================================== */

function groupSummaryTransactions(items){

  const period =
    summaryState.period;


  /* =========================
     YEAR
     แบ่งคั่นเดือน
  ========================= */

  if(period === "year"){

    const groups = {};

    items.forEach(tx=>{

      const key =
        tx.date.slice(0,7);

      if(!groups[key]){
        groups[key] = [];
      }

      groups[key].push(tx);

    });

    return Object.entries(groups)
      .sort((a,b)=>
        a[0].localeCompare(b[0])
      )
      .map(([key,items])=>({

        key,

        title:
          thaiMonth(
            Number(key.slice(5,7))-1
          ) +
          " " +
          (Number(key.slice(0,4))+543),

        items

      }));

  }


  /* =========================
     MONTH
     รวมเป็นเดือนเดียว
  ========================= */

  if(period === "month"){

    return [{
      key:
        `${summaryState.year}-${String(summaryState.month+1).padStart(2,"0")}`,

      title:
        thaiMonth(summaryState.month) +
        " " +
        (summaryState.year+543),

      items

    }];

  }


  /* =========================
     WEEK
     แบ่งคั่นวัน
  ========================= */

  if(period === "week"){

    const groups = {};

    items.forEach(tx=>{

      if(!groups[tx.date]){
        groups[tx.date] = [];
      }

      groups[tx.date].push(tx);

    });


    return Object.entries(groups)
      .sort((a,b)=>
        a[0].localeCompare(b[0])
      )
      .map(([key,items])=>({

        key,

        title:
          formatThaiDate(key),

        items

      }));

  }


  /* =========================
     DAY
     แบ่งคั่นวัน
  ========================= */

  const groups = {};

  items.forEach(tx=>{

    if(!groups[tx.date]){
      groups[tx.date] = [];
    }

    groups[tx.date].push(tx);

  });


  return Object.entries(groups)
    .sort((a,b)=>
      a[0].localeCompare(b[0])
    )
    .map(([key,items])=>({

      key,

      title:
        formatThaiDate(key),

      items

    }));

}

function getMenuTotal(menu){

  if(!Array.isArray(menu.ingredients)){
    return 0;
  }

  return menu.ingredients.reduce(
    (sum,ing)=>{

      if(ing.enabled === false){
        return sum;
      }

      return sum +
        (
          Number(ing.qty || 0) *
          Number(ing.price || 0)
        );

    },
    0
  );

}

function saveMenuModal(){

      .value

      .value
      .trim();

function deleteMenu(id){

  if(!confirm("ลบรายการขายนี้หรือไม่?")) return;

  menus =
    menus.filter(
      x=>x.id !== id
    );

  if(selectedMenuId === id){

    selectedMenuId = null;

    document
      .getElementById("costDetail")
      .classList.remove("active");

    document
      .getElementById("costMain")
      .style.display = "block";

  }

  saveMenus();

  renderMenus();

}


function duplicateMenu(id){

  const menu =
    menus.find(
      x=>x.id === id
    );

  if(!menu) return;


  const copy = {

    id:
      "menu_" + Date.now(),

    name:
      menu.name + " (สำเนา)",

    cover:
      menu.cover || "",

    ingredients:
      Array.isArray(menu.ingredients)
        ? menu.ingredients.map(
            (ing,index)=>({

              ...ing,

              id:
                "ing_" +
                Date.now() +
                "_" +
                index

            })
          )
        : []

  };


  menus.push(copy);

  saveMenus();

  renderMenus();

}

  renderMenuDetail();

  renderMenus();

}


/* =====================================================
   TOGGLE INGREDIENT
===================================================== */

function toggleIngredient(id){

  const menu =
    menus.find(
      x=>x.id === selectedMenuId
    );

  if(!menu) return;


  const ing =
    menu.ingredients.find(
      x=>x.id === id
    );

  if(!ing) return;


  ing.enabled =
    ing.enabled === false
      ? true
      : false;


  saveMenus();

  renderIngredients();

  renderMenuDetail();

  renderMenus();

}


/* =====================================================
   INGREDIENT QUANTITY
===================================================== */

function changeIngredientQty(id,amount){

  const menu =
    menus.find(
      x=>x.id === selectedMenuId
    );

  if(!menu) return;


  const ing =
    menu.ingredients.find(
      x=>x.id === id
    );

  if(!ing) return;


  let qty =
    Number(ing.qty) || 1;

  qty += amount;

  if(qty < 1) qty = 1;

  ing.qty = qty;

  saveMenus();

  renderIngredients();

  renderMenuDetail();

  renderMenus();

}


function setIngredientQty(id,value){

  const menu =
    menus.find(
      x=>x.id === selectedMenuId
    );

  if(!menu) return;


  const ing =
    menu.ingredients.find(
      x=>x.id === id
    );

  if(!ing) return;


  let qty =
    Number(value) || 1;

  if(qty < 1) qty = 1;

  ing.qty = qty;

  saveMenus();

  renderIngredients();

  renderMenuDetail();

  renderMenus();

}


/* =====================================================
   MOVE INGREDIENT
   -1 = ขึ้น
   +1 = ลง
===================================================== */

function moveIngredient(id,direction){

  const menu =
    menus.find(
      x=>x.id === selectedMenuId
    );

  if(!menu) return;


  if(!Array.isArray(menu.ingredients)){
    menu.ingredients = [];
  }


  const index =
    menu.ingredients.findIndex(
      x=>x.id === id
    );

  if(index < 0) return;


  const newIndex =
    index + direction;


  if(
    newIndex < 0 ||
    newIndex >= menu.ingredients.length
  ){
    return;
  }


  const temp =
    menu.ingredients[index];

  menu.ingredients[index] =
    menu.ingredients[newIndex];

  menu.ingredients[newIndex] =
    temp;


  saveMenus();

  renderIngredients();

}

   INITIALIZE
===================================================== */

function initialize(){

  document
    .getElementById("txDate")
    .value =
      formatISODate(new Date());


  setTxType("income");

  renderAccount();

  renderSummary();

  renderCombined();

  renderMenus();

  showPage("account");

}


initialize();

</script>
