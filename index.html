<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>สมุดบัญชี</title>

<style>
:root{
  --bg:#fff8fb;
  --card:#ffffff;
  --ink:#2b2730;
  --muted:#8b848d;
  --line:#eee6eb;
  --pink:#e9a8c1;
  --pink-dark:#c96791;
  --green:#6fb28b;
  --red:#df7d87;
  --shadow:0 10px 30px rgba(90,50,70,.08);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
  "Noto Sans Thai",sans-serif;
}

button,
input,
select{
  font:inherit;
}

.container{
  width:min(100%,900px);
  margin:auto;
  padding:20px;
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-icon{
  width:48px;
  height:48px;
  border-radius:16px;
  background:#f5d8e4;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

.logo h1{
  margin:0;
  font-size:23px;
}

.logo p{
  margin:2px 0 0;
  color:var(--muted);
  font-size:13px;
}

/* SUMMARY */

.summary-card{
  background:linear-gradient(135deg,#f7dce7,#fff);
  border-radius:25px;
  padding:22px;
  box-shadow:var(--shadow);
  margin-bottom:18px;
}

.summary-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.summary-title{
  font-size:14px;
  color:var(--muted);
}

.balance{
  font-size:34px;
  font-weight:800;
  margin:7px 0 18px;
}

.money-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.money-box{
  background:rgba(255,255,255,.8);
  padding:15px;
  border-radius:17px;
}

.money-box span{
  display:block;
  font-size:13px;
  color:var(--muted);
  margin-bottom:5px;
}

.income{
  color:var(--green);
  font-weight:700;
}

.expense{
  color:var(--red);
  font-weight:700;
}

/* SELECT */

.period-box{
  background:var(--card);
  padding:18px;
  border-radius:20px;
  box-shadow:var(--shadow);
  margin-bottom:18px;
}

.period-box label{
  display:block;
  font-size:14px;
  color:var(--muted);
  margin-bottom:8px;
}

select{
  width:100%;
  padding:13px 15px;
  border:1px solid var(--line);
  border-radius:14px;
  background:white;
  outline:none;
}

/* FORM */

.form-card{
  background:white;
  border-radius:22px;
  padding:20px;
  box-shadow:var(--shadow);
  margin-bottom:18px;
}

.form-card h2{
  margin:0 0 16px;
  font-size:18px;
}

.type-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}

.type-btn{
  padding:12px;
  border:1px solid var(--line);
  border-radius:14px;
  background:white;
  cursor:pointer;
}

.type-btn.active.income-btn{
  background:#e8f5ed;
  border-color:#a9d6ba;
  color:#3f8c61;
}

.type-btn.active.expense-btn{
  background:#fbe9ed;
  border-color:#e5afb9;
  color:#bd5967;
}

.input-group{
  margin-bottom:12px;
}

.input-group label{
  display:block;
  font-size:13px;
  color:var(--muted);
  margin-bottom:6px;
}

input{
  width:100%;
  padding:13px 14px;
  border:1px solid var(--line);
  border-radius:14px;
  outline:none;
}

input:focus,
select:focus{
  border-color:var(--pink);
}

.add-btn{
  width:100%;
  border:0;
  padding:14px;
  border-radius:15px;
  background:var(--pink-dark);
  color:white;
  font-weight:700;
  cursor:pointer;
  margin-top:5px;
}

/* TRANSACTIONS */

.list-card{
  background:white;
  border-radius:22px;
  padding:20px;
  box-shadow:var(--shadow);
}

.list-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.list-header h2{
  margin:0;
  font-size:18px;
}

.count{
  font-size:13px;
  color:var(--muted);
}

.transaction{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 0;
  border-bottom:1px solid var(--line);
}

.transaction:last-child{
  border-bottom:0;
}

.transaction-icon{
  width:42px;
  height:42px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.transaction-icon.income-icon{
  background:#e8f5ed;
}

.transaction-icon.expense-icon{
  background:#fbe9ed;
}

.transaction-info{
  flex:1;
  min-width:0;
}

.transaction-info strong{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.transaction-info small{
  color:var(--muted);
}

.transaction-money{
  text-align:right;
  font-weight:700;
}

.delete-btn{
  border:0;
  background:transparent;
  color:#aaa;
  cursor:pointer;
  font-size:17px;
}

.empty{
  text-align:center;
  padding:35px 10px;
  color:var(--muted);
}

.footer{
  text-align:center;
  color:#aaa;
  font-size:12px;
  padding:25px 0 10px;
}

/* RESPONSIVE */

@media(max-width:500px){
  .container{
    padding:14px;
  }

  .balance{
    font-size:30px;
  }

  .money-grid{
    gap:8px;
  }

  .money-box{
    padding:12px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">
    <div class="logo">
      <div class="logo-icon">📒</div>

      <div>
        <h1>สมุดบัญชี</h1>
        <p>บันทึกรายรับ–รายจ่ายของเรา</p>
      </div>
    </div>
  </div>


  <!-- SUMMARY -->

  <div class="summary-card">

    <div class="summary-top">
      <div class="summary-title" id="summaryLabel">
        คงเหลือวันนี้
      </div>

      <div>💰</div>
    </div>

    <div class="balance" id="balance">
      ฿0.00
    </div>

    <div class="money-grid">

      <div class="money-box">
        <span>รายรับ</span>
        <div class="income" id="income">
          ฿0.00
        </div>
      </div>

      <div class="money-box">
        <span>รายจ่าย</span>
        <div class="expense" id="expense">
          ฿0.00
        </div>
      </div>

    </div>

  </div>


  <!-- PERIOD -->

  <div class="period-box">

    <label>📊 เลือกช่วงเวลาที่ต้องการดูสรุป</label>

    <select id="periodSelect">
      <option value="day">รายวัน</option>
      <option value="week">รายสัปดาห์</option>
      <option value="month">รายเดือน</option>
      <option value="year">รายปี</option>
      <option value="all">ทั้งหมด</option>
    </select>

  </div>


  <!-- ADD TRANSACTION -->

  <div class="form-card">

    <h2>➕ เพิ่มรายการ</h2>

    <div class="type-buttons">

      <button
        class="type-btn active income-btn"
        id="incomeBtn"
        onclick="setType('income')"
      >
        💚 รายรับ
      </button>

      <button
        class="type-btn expense-btn"
        id="expenseBtn"
        onclick="setType('expense')"
      >
        ❤️ รายจ่าย
      </button>

    </div>


    <div class="input-group">

      <label>จำนวนเงิน</label>

      <input
        type="number"
        id="amount"
        placeholder="เช่น 100"
        min="0"
        step="0.01"
      >

    </div>


    <div class="input-group">

      <label>รายละเอียด</label>

      <input
        type="text"
        id="description"
        placeholder="เช่น ค่าอาหาร / เงินเดือน"
      >

    </div>


    <div class="input-group">

      <label>วันที่</label>

      <input
        type="date"
        id="date"
      >

    </div>


    <button class="add-btn" onclick="addTransaction()">
      บันทึกรายการ
    </button>

  </div>


  <!-- LIST -->

  <div class="list-card">

    <div class="list-header">

      <h2>📋 รายการ</h2>

      <span
        class="count"
        id="transactionCount"
      >
        0 รายการ
      </span>

    </div>

    <div id="transactionList"></div>

  </div>


  <div class="footer">
    ข้อมูลจะถูกบันทึกไว้ในอุปกรณ์ของคุณ 💗
  </div>

</div>


<script>

let transactions =
JSON.parse(localStorage.getItem("accountBookData")) || [];

let currentType = "income";


/* DATE */

const today = new Date();

document.getElementById("date").value =
today.toISOString().split("T")[0];


/* TYPE */

function setType(type){

  currentType = type;

  const incomeBtn =
    document.getElementById("incomeBtn");

  const expenseBtn =
    document.getElementById("expenseBtn");

  incomeBtn.classList.remove("active");
  expenseBtn.classList.remove("active");

  if(type === "income"){
    incomeBtn.classList.add("active");
  }else{
    expenseBtn.classList.add("active");
  }
}


/* ADD */

function addTransaction(){

  const amount =
    parseFloat(document.getElementById("amount").value);

  const description =
    document.getElementById("description").value.trim();

  const date =
    document.getElementById("date").value;


  if(!amount || amount <= 0){
    alert("กรุณาใส่จำนวนเงิน");
    return;
  }

  if(!description){
    alert("กรุณาใส่รายละเอียดรายการ");
    return;
  }

  if(!date){
    alert("กรุณาเลือกวันที่");
    return;
  }


  const transaction = {

    id: Date.now(),

    type: currentType,

    amount: amount,

    description: description,

    date: date

  };


  transactions.push(transaction);

  saveData();

  document.getElementById("amount").value = "";

  document.getElementById("description").value = "";

  render();

}


/* SAVE */

function saveData(){

  localStorage.setItem(
    "accountBookData",
    JSON.stringify(transactions)
  );

}


/* PERIOD */

function getStartOfWeek(date){

  const d = new Date(date);

  const day = d.getDay();

  const diff = day === 0 ? -6 : 1 - day;

  d.setDate(d.getDate() + diff);

  d.setHours(0,0,0,0);

  return d;

}


function isInPeriod(dateString, period){

  const date = new Date(dateString + "T00:00:00");

  const now = new Date();

  if(period === "all"){
    return true;
  }


  if(period === "day"){

    return (
      date.getFullYear() === now.getFullYear() &&
      date.getMonth() === now.getMonth() &&
      date.getDate() === now.getDate()
    );

  }


  if(period === "week"){

    const start = getStartOfWeek(now);

    const end = new Date(start);

    end.setDate(end.getDate() + 7);

    return date >= start && date < end;

  }


  if(period === "month"){

    return (
      date.getFullYear() === now.getFullYear() &&
      date.getMonth() === now.getMonth()
    );

  }


  if(period === "year"){

    return (
      date.getFullYear() === now.getFullYear()
    );

  }


  return false;

}


/* RENDER */

function render(){

  const period =
    document.getElementById("periodSelect").value;


  const filtered =
    transactions.filter(
      t => isInPeriod(t.date, period)
    );


  let income = 0;

  let expense = 0;


  filtered.forEach(t => {

    if(t.type === "income"){

      income += t.amount;

    }else{

      expense += t.amount;

    }

  });


  const balance = income - expense;


  document.getElementById("income").textContent =
    formatMoney(income);

  document.getElementById("expense").textContent =
    formatMoney(expense);

  document.getElementById("balance").textContent =
    formatMoney(balance);


  const labels = {

    day:"คงเหลือวันนี้",

    week:"คงเหลือสัปดาห์นี้",

    month:"คงเหลือเดือนนี้",

    year:"คงเหลือปีนี้",

    all:"คงเหลือทั้งหมด"

  };


  document.getElementById("summaryLabel").textContent =
    labels[period];


  document.getElementById("transactionCount").textContent =
    filtered.length + " รายการ";


  renderList(filtered);

}


/* LIST */

function renderList(list){

  const container =
    document.getElementById("transactionList");


  if(list.length === 0){

    container.innerHTML = `
      <div class="empty">
        📝<br>
        ยังไม่มีรายการในช่วงเวลานี้
      </div>
    `;

    return;

  }


  list.sort(
    (a,b) =>
      new Date(b.date) - new Date(a.date)
  );


  container.innerHTML =
    list.map(t => `

      <div class="transaction">

        <div class="
          transaction-icon
          ${t.type === "income"
            ? "income-icon"
            : "expense-icon"}
        ">
          ${t.type === "income" ? "💚" : "❤️"}
        </div>


        <div class="transaction-info">

          <strong>
            ${escapeHTML(t.description)}
          </strong>

          <small>
            ${formatDate(t.date)}
          </small>

        </div>


        <div
          class="
            transaction-money
            ${t.type === "income"
              ? "income"
              : "expense"}
          "
        >
          ${t.type === "income" ? "+" : "-"}
          ${formatMoney(t.amount)}
        </div>


        <button
          class="delete-btn"
          onclick="deleteTransaction(${t.id})"
          title="ลบรายการ"
        >
          🗑️
        </button>

      </div>

    `).join("");

}


/* DELETE */

function deleteTransaction(id){

  const ok =
    confirm("ต้องการลบรายการนี้ใช่ไหม?");

  if(!ok) return;


  transactions =
    transactions.filter(
      t => t.id !== id
    );


  saveData();

  render();

}


/* FORMAT MONEY */

function formatMoney(number){

  return "฿" +
    number.toLocaleString("th-TH",{
      minimumFractionDigits:2,
      maximumFractionDigits:2
    });

}


/* FORMAT DATE */

function formatDate(date){

  return new Date(date + "T00:00:00")
    .toLocaleDateString(
      "th-TH",
      {
        day:"numeric",
        month:"short",
        year:"numeric"
      }
    );

}


/* ESCAPE */

function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


/* CHANGE PERIOD */

document
  .getElementById("periodSelect")
  .addEventListener("change", render);


/* FIRST LOAD */

render();

</script>

</body>
</html>
