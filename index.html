<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">
<title>สมุดบัญชี</title>

<style>
:root{
  --bg:#fff7fb;
  --card:#fff;
  --soft:#fff0f6;
  --soft2:#f9edf3;
  --ink:#29252b;
  --muted:#a09aa0;
  --line:#f0e2e9;
  --pink:#e9a9c4;
  --pink2:#f8e2ec;
  --green:#55a875;
  --red:#df7180;
  --blue:#008ee8;
  --shadow:0 10px 30px rgba(100,60,80,.07);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",Arial,sans-serif;
}

body{
  min-height:100vh;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:18px 17px 35px;
}

/* =========================
   NAV
========================= */

.nav{
  position:sticky;
  top:8px;
  z-index:50;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
  background:#fff;
  border-radius:25px;
  padding:8px;
  box-shadow:var(--shadow);
  margin-bottom:24px;
}

.nav-btn{
  border:0;
  background:transparent;
  border-radius:21px;
  min-height:82px;
  color:#888;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  transition:.15s;
}

.nav-btn .icon{
  font-size:28px;
  line-height:1;
}

.nav-btn .label{
  font-size:15px;
}

.nav-btn.active{
  background:var(--pink2);
  color:#c8658e;
  font-weight:700;
}

/* =========================
   COMMON
========================= */

.page{
  display:none;
}

.page.active{
  display:block;
}

.card{
  background:var(--card);
  border-radius:28px;
  box-shadow:var(--shadow);
}

.section-title{
  margin:0 0 20px;
  font-size:27px;
  font-weight:800;
}

.muted{
  color:var(--muted);
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:35px 15px;
}

.primary{
  border:0;
  background:#f9e4ed;
  color:#c75f89;
  border-radius:16px;
  padding:12px 18px;
  font-weight:700;
}

.primary:active,
.small-btn:active,
.qty-btn:active,
.nav-btn:active{
  transform:scale(.97);
}

/* =========================
   ACCOUNT
========================= */

.account-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0 4px 18px;
}

.account-head .clipboard{
  font-size:29px;
}

.account-title{
  font-size:28px;
  font-weight:800;
  border:0;
  background:transparent;
  outline:none;
  width:auto;
  min-width:100px;
  max-width:70%;
}

.edit-title-btn{
  border:1px solid var(--line);
  background:#fff;
  color:#1594e5;
  border-radius:12px;
  padding:5px 9px;
  font-size:12px;
}

.account-add{
  background:#fff;
  border-radius:28px;
  padding:18px;
  box-shadow:var(--shadow);
  margin-bottom:20px;
}

.type-switch{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:15px;
}

.type-btn{
  border:0;
  border-radius:15px;
  padding:11px;
  background:#f9edf3;
  color:#888;
  font-weight:700;
}

.type-btn.active.income{
  background:#eaf7ef;
  color:var(--green);
}

.type-btn.active.expense{
  background:#fff0f2;
  color:var(--red);
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  color:#918991;
  font-size:13px;
}

.field input,
.field select{
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  padding:11px 13px;
  outline:none;
  background:#fff;
  color:var(--ink);
}

.field input:focus,
.field select:focus{
  border-color:#e7b4c9;
}

.add-row{
  display:flex;
  justify-content:flex-end;
  margin-top:13px;
}

.add-btn{
  border:0;
  border-radius:15px;
  background:#f8e2ec;
  color:#c45c86;
  padding:11px 20px;
  font-weight:800;
}

/* Account list */

.account-list{
  background:#fff;
  border-radius:28px;
  padding:0 22px;
  box-shadow:var(--shadow);
}

.account-list-title{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:27px;
  font-weight:800;
  padding:8px 0 14px;
}

.tx-row{
  display:grid;
  grid-template-columns:58px minmax(0,1fr) auto;
  gap:10px;
  align-items:center;
  padding:16px 0;
  border-bottom:1px solid var(--line);
}

.tx-row:last-child{
  border-bottom:0;
}

.tx-symbol{
  width:58px;
  height:58px;
  border-radius:18px;
  background:#fff0f6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  flex-shrink:0;
}

.tx-symbol.income-symbol{
  color:#222;
}

.tx-main{
  min-width:0;
}

.tx-name{
  font-size:19px;
  font-weight:800;
  line-height:1.25;
  word-break:break-word;
}

.tx-meta{
  margin-top:5px;
  color:#a09a9f;
  font-size:16px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.tx-right{
  min-width:105px;
  text-align:right;
}

.tx-total{
  font-size:20px;
  font-weight:800;
  line-height:1.2;
}

.tx-total.income{
  color:var(--green);
}

.tx-total.expense{
  color:var(--red);
}

.tx-actions{
  display:flex;
  justify-content:flex-end;
  gap:6px;
  margin-top:5px;
}

.small-btn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:11px;
  padding:5px 9px;
  font-size:12px;
}

.small-btn.edit{
  color:#078ce1;
}

.small-btn.delete{
  border:0;
  background:#fff0f3;
  color:#db6d7d;
}

/* =========================
   SUMMARY
========================= */

.summary-card{
  background:#fff;
  border-radius:28px;
  padding:20px;
  box-shadow:var(--shadow);
}

.period-tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-bottom:15px;
}

.period-btn{
  border:0;
  background:#f8edf3;
  color:#8e858b;
  border-radius:14px;
  padding:10px 5px;
  font-weight:700;
}

.period-btn.active{
  background:#f6dce8;
  color:#c35d87;
}

.period-controls{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-bottom:15px;
}

.period-controls input,
.period-controls select{
  border:1px solid var(--line);
  background:#fff;
  border-radius:13px;
  padding:10px 12px;
  outline:none;
}

.display-switch{
  display:flex;
  gap:7px;
  margin-bottom:18px;
}

.display-btn{
  border:1px solid var(--line);
  background:#fff;
  color:#8e858b;
  border-radius:13px;
  padding:8px 12px;
}

.display-btn.active{
  background:#f9e5ed;
  color:#c45f87;
  border-color:#f2d1df;
}

.summary-total{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-bottom:18px;
}

.sum-box{
  border-radius:19px;
  padding:15px 10px;
  text-align:center;
  background:#fff7fa;
}

.sum-box .label{
  font-size:13px;
  color:#999198;
}

.sum-box .value{
  margin-top:4px;
  font-size:21px;
  font-weight:800;
}

.sum-box.income .value{
  color:var(--green);
}

.sum-box.expense .value{
  color:var(--red);
}

.sum-box.balance .value{
  color:#4d7d95;
}

.summary-records{
  border-top:1px solid var(--line);
}

.summary-record{
  padding:13px 0;
  border-bottom:1px solid var(--line);
}

.summary-record:last-child{
  border-bottom:0;
}

.summary-record-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.summary-record-name{
  font-weight:800;
}

.summary-record-amount.income{
  color:var(--green);
  font-weight:800;
}

.summary-record-amount.expense{
  color:var(--red);
  font-weight:800;
}

.summary-record-meta{
  color:#aaa3a8;
  font-size:13px;
  margin-top:4px;
}

/* =========================
   ALL LIST
========================= */

.all-card{
  background:#fff;
  border-radius:28px;
  padding:20px;
  box-shadow:var(--shadow);
}

.search-box{
  width:100%;
  border:1px solid var(--line);
  border-radius:16px;
  padding:13px 15px;
  outline:none;
  margin-bottom:16px;
}

.all-row{
  display:grid;
  grid-template-columns:45px minmax(0,1fr) auto;
  gap:10px;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid var(--line);
}

.all-row:last-child{
  border-bottom:0;
}

.all-symbol{
  width:45px;
  height:45px;
  border-radius:14px;
  background:#fff0f6;
  display:flex;
  align-items:center;
  justify-content:center;
}

.all-name{
  font-weight:800;
}

.all-meta{
  color:#aaa3a8;
  font-size:13px;
  margin-top:3px;
}

.all-amount{
  font-weight:800;
  text-align:right;
}

.all-amount.income{
  color:var(--green);
}

.all-amount.expense{
  color:var(--red);
}

/* =========================
   COST - SALES MENU
========================= */

.cost-list-card{
  background:#fff;
  border-radius:28px;
  padding:20px;
  box-shadow:var(--shadow);
}

.cost-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}

.cost-top .section-title{
  margin:0;
}

.menu-card{
  border:1px solid var(--line);
  border-radius:23px;
  padding:15px;
  margin-bottom:12px;
  background:#fff;
}

.menu-card-inner{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:12px;
  align-items:center;
}

.menu-left{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.menu-cover{
  width:58px;
  height:58px;
  flex:0 0 58px;
  border-radius:18px;
  background:#fff0f6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:31px;
}

.menu-info{
  min-width:0;
}

.menu-name{
  font-size:22px;
  font-weight:850;
  line-height:1.15;
  word-break:break-word;
}

.menu-count{
  color:#918991;
  font-size:14px;
  margin-top:4px;
}

.menu-right{
  text-align:right;
  min-width:145px;
}

.menu-cost{
  font-size:20px;
  color:#5a9d75;
  font-weight:850;
  white-space:nowrap;
}

.menu-actions{
  display:flex;
  justify-content:flex-end;
  gap:5px;
  margin-top:6px;
  flex-wrap:wrap;
}

.menu-actions button{
  border:1px solid var(--line);
  background:#fff;
  border-radius:10px;
  padding:5px 8px;
  font-size:12px;
}

.menu-actions .danger{
  color:#d66c7c;
  background:#fff0f3;
  border:0;
}

/* =========================
   COST DETAIL PAGE
========================= */

.cost-detail{
  display:none;
}

.cost-detail.active{
  display:block;
}

.cost-main-list.hidden{
  display:none;
}

.back-btn{
  border:0;
  background:#fff;
  box-shadow:var(--shadow);
  border-radius:14px;
  padding:9px 13px;
  color:#168fd9;
  margin-bottom:13px;
}

.menu-detail-head{
  background:#fff;
  border-radius:25px;
  padding:17px;
  box-shadow:var(--shadow);
  margin-bottom:17px;
}

.menu-detail-title-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.menu-detail-cover{
  width:70px;
  height:70px;
  border-radius:20px;
  background:#fff0f6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
}

.menu-detail-name{
  font-size:27px;
  font-weight:850;
  word-break:break-word;
}

.menu-detail-count{
  color:#9c949a;
  margin-top:4px;
}

.ingredients-card{
  background:#fff;
  border-radius:28px;
  padding:20px;
  box-shadow:var(--shadow);
}

.ingredients-title{
  font-size:27px;
  font-weight:850;
  margin-bottom:6px;
}

.ingredients-note{
  color:#9e969c;
  font-size:14px;
  margin-bottom:18px;
}

.ingredient-row{
  border:1px solid var(--line);
  border-radius:21px;
  padding:12px;
  margin-bottom:10px;
}

.ingredient-inner{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:10px;
  align-items:center;
}

.ingredient-left{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.ingredient-cover{
  width:56px;
  height:56px;
  border-radius:17px;
  background:#fff0f6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  flex:0 0 56px;
}

.ingredient-info{
  min-width:0;
}

.ingredient-name{
  font-size:20px;
  font-weight:850;
  word-break:break-word;
  line-height:1.15;
}

.ingredient-equation{
  color:#aaa2a7;
  font-size:14px;
  margin-top:4px;
  white-space:nowrap;
}

.ingredient-controls{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:5px;
  flex-wrap:nowrap;
}

.order-btn,
.detail-btn,
.trash-btn,
.qty-btn{
  width:36px;
  height:36px;
  border:0;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f8eef3;
}

.order-btn{
  color:#008fe5;
  font-size:21px;
}

.detail-btn{
  width:auto;
  padding:0 10px;
  color:#817981;
  font-size:12px;
  white-space:nowrap;
}

.trash-btn{
  color:#7f7b7e;
  font-size:17px;
}

.qty-btn{
  color:#008fe5;
  font-size:20px;
}

.qty-input{
  width:50px;
  height:36px;
  border:0;
  border-radius:11px;
  background:#fff0f6;
  text-align:center;
  outline:none;
  font-size:17px;
  color:var(--ink);
}

/* toggle */

.toggle{
  position:relative;
  width:55px;
  height:32px;
  flex:0 0 55px;
}

.toggle input{
  opacity:0;
  width:0;
  height:0;
}

.slider{
  position:absolute;
  inset:0;
  background:#ddd7da;
  border-radius:20px;
  transition:.15s;
}

.slider:before{
  content:"";
  position:absolute;
  width:24px;
  height:24px;
  left:4px;
  top:4px;
  background:white;
  border-radius:50%;
  transition:.15s;
  box-shadow:0 1px 4px rgba(0,0,0,.12);
}

.toggle input:checked + .slider{
  background:#66b286;
}

.toggle input:checked + .slider:before{
  transform:translateX(23px);
}

.add-ingredient{
  width:100%;
  border:0;
  border-radius:17px;
  background:#f9e4ed;
  color:#c55e87;
  padding:13px;
  font-weight:800;
  margin-top:6px;
}

/* =========================
   MODAL
========================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(45,30,40,.35);
  z-index:100;
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:14px;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:650px;
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:27px;
  padding:21px;
  box-shadow:0 20px 60px rgba(50,30,40,.18);
}

.modal-title{
  font-size:24px;
  font-weight:850;
  margin-bottom:17px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px;
}

.cancel-btn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:13px;
  padding:10px 15px;
}

.save-btn{
  border:0;
  background:#f5dce7;
  color:#bd5880;
  border-radius:13px;
  padding:10px 17px;
  font-weight:800;
}

.qty-editor{
  display:flex;
  align-items:center;
  gap:8px;
}

.qty-editor .qty-input{
  width:70px;
  border:1px solid var(--line);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:760px){

  .app{
    padding:8px 17px 30px;
  }

  .nav{
    top:5px;
    border-radius:24px;
    margin-bottom:20px;
  }

  .nav-btn{
    min-height:80px;
  }

  .nav-btn .icon{
    font-size:26px;
  }

  .nav-btn .label{
    font-size:14px;
  }

  .account-list{
    padding:0 21px;
  }

  .tx-row{
    grid-template-columns:58px minmax(0,1fr) auto;
  }

  .tx-right{
    min-width:94px;
  }

  .tx-total{
    font-size:18px;
  }

  .tx-name{
    font-size:18px;
  }

  .tx-meta{
    font-size:15px;
  }

  .menu-card-inner{
    grid-template-columns:minmax(0,1fr) auto;
  }

  .menu-left{
    gap:9px;
  }

  .menu-cover{
    width:55px;
    height:55px;
    flex-basis:55px;
  }

  .menu-name{
    font-size:20px;
  }

  .menu-right{
    min-width:125px;
  }

  .menu-cost{
    font-size:17px;
  }

  .ingredient-inner{
    grid-template-columns:minmax(0,1fr);
  }

  .ingredient-controls{
    justify-content:flex-end;
    overflow-x:auto;
    padding-bottom:1px;
  }

  .ingredient-left{
    align-items:center;
  }

  .summary-total{
    grid-template-columns:1fr;
  }
}

@media(max-width:520px){

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .tx-row{
    grid-template-columns:54px minmax(0,1fr);
    position:relative;
    padding-right:0;
  }

  .tx-symbol{
    width:54px;
    height:54px;
  }

  .tx-right{
    grid-column:2;
    text-align:left;
    min-width:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
  }

  .tx-actions{
    justify-content:flex-start;
    margin-top:0;
  }

  .menu-card-inner{
    grid-template-columns:1fr;
  }

  .menu-right{
    display:flex;
    align-items:center;
    justify-content:space-between;
    min-width:0;
  }

  .menu-actions{
    justify-content:flex-end;
    margin-top:0;
  }

  .ingredient-controls{
    gap:4px;
  }

  .order-btn,
  .trash-btn,
  .qty-btn{
    width:34px;
    height:34px;
  }

  .detail-btn{
    padding:0 8px;
  }

  .qty-input{
    width:45px;
    height:34px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- ================= NAV ================= -->
  <nav class="nav">
    <button class="nav-btn active" data-page="account">
      <span class="icon">📒</span>
      <span class="label">บัญชี</span>
    </button>

    <button class="nav-btn" data-page="summary">
      <span class="icon">📊</span>
      <span class="label">สรุป</span>
    </button>

    <button class="nav-btn" data-page="all">
      <span class="icon">📋</span>

<script>
/* =========================================================
   STORAGE
========================================================= */

const TX_KEY = "myAccountTransactions_v5";
const MENU_KEY = "myAccountMenus_v5";
const TITLE_KEY = "myAccountTitle_v1";
const COVER_KEY = "myAccountCovers_v1";


let transactions = loadJSON(TX_KEY, []);
let menus = loadJSON(MENU_KEY, []);
let covers = loadJSON(COVER_KEY, {});

let currentTxType = "income";
let currentPeriod = "day";
let summaryMode = "detail";

let selectedMenuId = null;
let editingMenuId = null;
let editingIngredientId = null;


/* =========================================================
   HELPERS
========================================================= */

function loadJSON(key, fallback){

  try{

    const value = localStorage.getItem(key);

    if(!value) return fallback;

    const parsed = JSON.parse(value);

    return parsed;

  }catch(e){

    return fallback;

  }

}


function saveData(){

  localStorage.setItem(TX_KEY, JSON.stringify(transactions));
  localStorage.setItem(MENU_KEY, JSON.stringify(menus));
  localStorage.setItem(TITLE_KEY, document.getElementById("accountTitle").value);
  localStorage.setItem(COVER_KEY, JSON.stringify(covers));

}


function uid(prefix){

  return prefix + "_" +
    Date.now().toString(36) +
    "_" +
    Math.random().toString(36).slice(2,8);

}


function money(n){

  return Number(n || 0).toLocaleString("th-TH",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });

}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function normalizeName(name){

  return String(name || "")
    .trim()
    .replace(/\s+/g," ")
    .toLowerCase();

}


function getToday(){

  const d = new Date();

  const y = d.getFullYear();

  const m = String(d.getMonth()+1).padStart(2,"0");

  const day = String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;

}


function ensureData(){

  if(!Array.isArray(transactions)){
    transactions=[];
  }

  if(!Array.isArray(menus)){
    menus=[];
  }

  menus.forEach(menu=>{

    if(!Array.isArray(menu.ingredients)){
      menu.ingredients=[];
    }

    if(typeof menu.name !== "string"){
      menu.name="";
    }

    if(typeof menu.cover !== "string"){
      menu.cover="";
    }

  });

  transactions.forEach(tx=>{

    if(typeof tx.qty !== "number"){
      tx.qty = Number(tx.qty) || 1;
    }

    if(typeof tx.price !== "number"){
      tx.price = Number(tx.price) || 0;
    }

    if(!tx.type){
      tx.type="income";
    }

  });

  saveData();

}


function getCover(name, ownCover=""){

  if(ownCover){
    return ownCover;
  }

  const key = normalizeName(name);

  return covers[key] || "";

}


function setCoverForName(name, cover){

  const key = normalizeName(name);

  if(!key) return;

  if(cover){

    covers[key]=cover;

  }else{

    delete covers[key];

  }

}


/* =========================================================
   NAVIGATION
========================================================= */

document.querySelectorAll(".nav-btn").forEach(btn=>{

  btn.addEventListener("click",()=>{

    const page = btn.dataset.page;

    document.querySelectorAll(".nav-btn")
      .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    document.querySelectorAll(".page")
      .forEach(x=>x.classList.remove("active"));

    document.getElementById("page-"+page)
      .classList.add("active");

    if(page==="account"){
      renderAccount();
    }

    if(page==="summary"){
      renderSummary();
    }

    if(page==="all"){
      renderAllList();
    }

    if(page==="cost"){

      if(selectedMenuId){

        renderMenuDetail();

      }else{

        renderMenus();

      }

    }

  });

});


/* =========================================================
   ACCOUNT TITLE
========================================================= */

function editTitle(){

  const input = document.getElementById("accountTitle");

  input.focus();

  input.select();

}


document.getElementById("accountTitle")
  .addEventListener("change",()=>{

    localStorage.setItem(
      TITLE_KEY,
      document.getElementById("accountTitle").value
    );

  });


/* =========================================================
   ACCOUNT
========================================================= */

function setTxType(type){

  currentTxType=type;

  document.getElementById("incomeTypeBtn")
    .classList.toggle("active",type==="income");

  document.getElementById("expenseTypeBtn")
    .classList.toggle("active",type==="expense");

}


function changeTxQty(amount){

  const input=document.getElementById("txQty");

  let value=Number(input.value)||1;

  value+=amount;

  if(value<1) value=1;

  input.value=value;

}


function saveTx(){

  const name=document.getElementById("txName").value.trim();

  const qty=Math.max(
    1,
    Number(document.getElementById("txQty").value)||1
  );

  const price=Math.max(
    0,
    Number(document.getElementById("txPrice").value)||0
  );

  const date=document.getElementById("txDate").value || getToday();

  const cover=document.getElementById("txCover").value.trim();

  const note=document.getElementById("txNote").value.trim();

  if(!name){

    alert("กรุณาใส่ชื่อรายการ");

    return;

  }

  const tx={

    id:uid("tx"),

    type:currentTxType,

    name:name,

    qty:qty,

    price:price,

    date:date,

    cover:cover,

    note:note,

    createdAt:Date.now()

  };

  transactions.unshift(tx);

  if(cover){

    setCoverForName(name,cover);

  }

  saveData();

  document.getElementById("txName").value="";
  document.getElementById("txQty").value=1;
  document.getElementById("txPrice").value="";
  document.getElementById("txDate").value=getToday();
  document.getElementById("txCover").value="";
  document.getElementById("txNote").value="";

  renderAccount();

  renderSummary();

  renderAllList();

}


function txTotal(tx){

  return Number(tx.qty || 0) * Number(tx.price || 0);

}


function renderAccount(){

  const box=document.getElementById("accountList");

  if(!transactions.length){

    box.innerHTML=`
      <div class="empty">
        ยังไม่มีรายการ
      </div>
    `;

    return;

  }

  box.innerHTML=transactions.map(tx=>{

    const total=txTotal(tx);

    const symbol=tx.type==="income" ? "+" : "−";

    const cover=getCover(tx.name,tx.cover);

    return `

      <div class="tx-row">

        <div class="tx-symbol">
          ${cover
            ? escapeHTML(cover)
            : escapeHTML(symbol)}
        </div>

        <div class="tx-main">

          <div class="tx-name">
            ${escapeHTML(tx.name)}
          </div>

          <div class="tx-meta">
            ${tx.qty} × ฿${money(tx.price)}
            = ฿${money(total)}
            · ${escapeHTML(tx.date)}
          </div>

          ${
            tx.note
            ? `<div class="tx-meta">${escapeHTML(tx.note)}</div>`
            : ""
          }

        </div>

        <div class="tx-right">

          <div class="tx-total ${tx.type}">
            ${tx.type==="income" ? "+" : "−"}
            ฿${money(total)}
          </div>

          <div class="tx-actions">

            <button class="small-btn edit"
              onclick="editTx('${tx.id}')">
              แก้ไข
            </button>

            <button class="small-btn delete"
              onclick="deleteTx('${tx.id}')">
              ลบ
            </button>

          </div>

        </div>

      </div>
    `;

  }).join("");

}


function editTx(id){

  const tx=transactions.find(x=>x.id===id);

  if(!tx) return;

  const name=prompt("ชื่อรายการ",tx.name);

  if(name===null) return;

  const qty=prompt("จำนวน",tx.qty);

  if(qty===null) return;

  const price=prompt("ราคาต่อหน่วย",tx.price);

  if(price===null) return;

  const date=prompt("วันที่ YYYY-MM-DD",tx.date);

  if(date===null) return;

  const cover=prompt(
    "รูป / สัญลักษณ์ (เว้นว่างเพื่อลบ)",
    getCover(tx.name,tx.cover)
  );

  if(cover===null) return;

  const oldName=tx.name;

  tx.name=name.trim() || oldName;

  tx.qty=Math.max(1,Number(qty)||1);

  tx.price=Math.max(0,Number(price)||0);

  tx.date=date.trim() || tx.date;

  tx.cover=cover.trim();

  if(tx.cover){

    setCoverForName(tx.name,tx.cover);

  }

  saveData();

  renderAccount();
  renderSummary();
  renderAllList();

}


function deleteTx(id){

  if(!confirm("ลบรายการนี้หรือไม่?")) return;

  transactions=transactions.filter(x=>x.id!==id);

  saveData();

  renderAccount();
  renderSummary();
  renderAllList();

}


/* =========================================================
   SUMMARY
========================================================= */

function setPeriod(period){

  currentPeriod=period;

  document.querySelectorAll(".period-btn")
    .forEach(btn=>{
      btn.classList.toggle(
        "active",
        btn.dataset.period===period
      );
    });

  renderPeriodControls();

  renderSummary();

}


function setSummaryMode(mode){

  summaryMode=mode;

  document.getElementById("detailModeBtn")
    .classList.toggle("active",mode==="detail");

  document.getElementById("numberModeBtn")
    .classList.toggle("active",mode==="number");

  renderSummary();

}


function renderPeriodControls(){

  const box=document.getElementById("periodControls");

  if(currentPeriod==="day"){

    box.innerHTML=`
      <input
        id="summaryDate"
        type="date"
        value="${getToday()}"
        onchange="renderSummary()"
      >
    `;

    return;

  }

  if(currentPeriod==="week"){

    box.innerHTML=`
      <input
        id="summaryWeekDate"
        type="date"
        value="${getToday()}"
        onchange="renderSummary()"
      >
    `;

    return;

  }

  if(currentPeriod==="month"){

    box.innerHTML=`

      <select id="summaryMonth"
              onchange="renderSummary()">

        ${[
          ["01","มกราคม"],
          ["02","กุมภาพันธ์"],
          ["03","มีนาคม"],
          ["04","เมษายน"],
          ["05","พฤษภาคม"],
          ["06","มิถุนายน"],
          ["07","กรกฎาคม"],
          ["08","สิงหาคม"],
          ["09","กันยายน"],
          ["10","ตุลาคม"],
          ["11","พฤศจิกายน"],
          ["12","ธันวาคม"]
        ].map(([v,n])=>
          `<option value="${v}">
            ${n}
          </option>`
        ).join("")}

      </select>

      <select id="summaryYear"
              onchange="renderSummary()">

        ${yearOptions()}

      </select>

    `;

    const month=String(
      new Date().getMonth()+1
    ).padStart(2,"0");

    document.getElementById("summaryMonth").value=month;

    return;

  }

  if(currentPeriod==="year"){

    box.innerHTML=`

      <select id="summaryOnlyYear"
              onchange="renderSummary()">

        ${yearOptions()}

      </select>

    `;

  }

}


function yearOptions(){

  let html="";

  for(let year=2026;year<=2035;year++){

    html+=`
      <option value="${year}">
        ${year}
      </option>
    `;

  }

  return html;

}


function getWeekRange(dateString){

  const d=new Date(dateString+"T00:00:00");

  const day=d.getDay();

  const start=new Date(d);

  start.setDate(d.getDate()-day);

  const end=new Date(start);

  end.setDate(start.getDate()+6);

  return {
    start:formatDate(start),
    end:formatDate(end)
  };

}


function formatDate(d){

  const y=d.getFullYear();

  const m=String(d.getMonth()+1).padStart(2,"0");

  const day=String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;

}


function getSummaryTransactions(){

  if(currentPeriod==="day"){

    const date=
      document.getElementById("summaryDate")?.value
      || getToday();

    return transactions.filter(
      tx=>tx.date===date
    );

  }


  if(currentPeriod==="week"){

    const date=
      document.getElementById("summaryWeekDate")?.value
      || getToday();

    const range=getWeekRange(date);

    return transactions.filter(
      tx=>tx.date>=range.start &&
          tx.date<=range.end
    );

  }


  if(currentPeriod==="month"){

    const month=
      document.getElementById("summaryMonth")?.value
      || String(new Date().getMonth()+1).padStart(2,"0");

    const year=
      document.getElementById("summaryYear")?.value
      || new Date().getFullYear();

    const prefix=`${year}-${month}`;

    return transactions.filter(
      tx=>tx.date.startsWith(prefix)
    );

  }


  if(currentPeriod==="year"){

    const year=
      document.getElementById("summaryOnlyYear")?.value
      || new Date().getFullYear();

    return transactions.filter(
      tx=>tx.date.startsWith(String(year))
    );

  }

  return [];

}


function renderSummary(){

  renderPeriodControls();

  const records=getSummaryTransactions();

  let income=0;

  let expense=0;

  records.forEach(tx=>{

    const total=txTotal(tx);

    if(tx.type==="income"){

      income+=total;

    }else{

      expense+=total;

    }

  });

  const balance=income-expense;

  const content=document.getElementById("summaryContent");

  if(summaryMode==="number"){

    content.innerHTML=`

      <div class="summary-total">

        <div class="sum-box income">
          <div class="label">รายรับ</div>
          <div class="value">฿${money(income)}</div>
        </div>

        <div class="sum-box expense">
          <div class="label">รายจ่าย</div>
          <div class="value">฿${money(expense)}</div>
        </div>

        <div class="sum-box balance">
          <div class="label">คงเหลือ</div>
          <div class="value">฿${money(balance)}</div>
        </div>

      </div>

    `;

    return;

  }


  content.innerHTML=`

    <div class="summary-total">

      <div class="sum-box income">
        <div class="label">รายรับ</div>
        <div class="value">฿${money(income)}</div>
      </div>

      <div class="sum-box expense">
        <div class="label">รายจ่าย</div>
        <div class="value">฿${money(expense)}</div>
      </div>

      <div class="sum-box balance">
        <div class="label">คงเหลือ</div>
        <div class="value">฿${money(balance)}</div>
      </div>

    </div>

    <div class="summary-records">

      ${
        records.length

        ? records.map(tx=>`

          <div class="summary-record">

            <div class="summary-record-head">

              <div class="summary-record-name">
                ${getCover(tx.name,tx.cover) || ""}
                ${escapeHTML(tx.name)}
              </div>

              <div class="summary-record-amount ${tx.type}">
                ${tx.type==="income" ? "+" : "−"}
                ฿${money(txTotal(tx))}
              </div>

            </div>

            <div class="summary-record-meta">
              ${tx.qty} × ฿${money(tx.price)}
              · ${escapeHTML(tx.date)}
            </div>

          </div>

        `).join("")

        : `<div class="empty">ไม่มีรายการในช่วงเวลานี้</div>`
      }

    </div>

  `;

}


/* =========================================================
   ALL LIST
========================================================= */

function renderAllList(){

  const box=document.getElementById("allList");

  const search=
    document.getElementById("searchAll")
      ?.value
      .trim()
      .toLowerCase()
      || "";

  const list=transactions.filter(tx=>{

    if(!search) return true;

    return (
      tx.name.toLowerCase().includes(search) ||
      String(tx.note || "")
        .toLowerCase()
        .includes(search)
    );

  });

  if(!list.length){

    box.innerHTML=`
      <div class="empty">
        ไม่พบรายการ
      </div>
    `;

    return;

  }

  box.innerHTML=list.map(tx=>{

    const cover=getCover(tx.name,tx.cover);

    return `

      <div class="all-row">

        <div class="all-symbol">
          ${escapeHTML(
            cover || (tx.type==="income" ? "+" : "−")
          )}
        </div>

        <div>

          <div class="all-name">
            ${escapeHTML(tx.name)}
          </div>

          <div class="all-meta">
            ${tx.qty} × ฿${money(tx.price)}
            · ${escapeHTML(tx.date)}
          </div>

        </div>

        <div class="all-amount ${tx.type}">
          ${tx.type==="income" ? "+" : "−"}
          ฿${money(txTotal(tx))}
        </div>

      </div>

    `;

  }).join("");

}


/* =========================================================
   COST : MENU LIST
========================================================= */

function getMenuCost(menu){

  if(!Array.isArray(menu.ingredients)){
    menu.ingredients=[];
  }

  return menu.ingredients.reduce(
    (sum,ingredient)=>{

      if(!ingredient.active) return sum;

      const qty=Number(ingredient.qty)||0;

      const price=Number(ingredient.price)||0;

      return sum+(qty*price);

    },
    0
  );

}


function renderMenus(){

  selectedMenuId=null;

  document.getElementById("costMain")
    .classList.remove("hidden");

  document.getElementById("costDetail")
    .classList.remove("active");

  const box=document.getElementById("menuList");

  if(!menus.length){

    box.innerHTML=`
      <div class="empty">
        ยังไม่มีรายการขาย
      </div>
    `;

    return;

  }

  box.innerHTML=menus.map(menu=>{

    if(!Array.isArray(menu.ingredients)){
      menu.ingredients=[];
    }

    const cost=getMenuCost(menu);

    const cover=getCover(menu.name,menu.cover);

    return `

      <div class="menu-card">

        <div class="menu-card-inner">

          <div class="menu-left"
               onclick="openMenuDetail('${menu.id}')">

            <div class="menu-cover">
              ${cover ? escapeHTML(cover) : ""}
            </div>

            <div class="menu-info">

              <div class="menu-name">
                ${escapeHTML(menu.name)}
              </div>

              <div class="menu-count">
                วัตถุดิบ ${menu.ingredients.length} รายการ
              </div>

            </div>

          </div>

          <div class="menu-right">

            <div>

              <div class="menu-cost">
                รวมต้นทุน ฿${money(cost)}
              </div>

            </div>

            <div class="menu-actions">

              <button
                onclick="event.stopPropagation();editMenu('${menu.id}')">
                แก้ไข
              </button>

              <button
                onclick="event.stopPropagation();duplicateMenu('${menu.id}')">
                คัดลอก
              </button>

              <button
                class="danger"
                onclick="event.stopPropagation();deleteMenu('${menu.id}')">
                ลบ
              </button>

            </div>

          </div>

        </div>

      </div>

    `;

  }).join("");

}


/* =========================================================
   MENU MODAL
========================================================= */

function openMenuModal(){

  editingMenuId=null;

  document.getElementById("menuModalTitle")
    .textContent="เพิ่มรายการขาย";

  document.getElementById("menuNameInput").value="";

  document.getElementById("menuCoverInput").value="";

  document.getElementById("menuModal")
    .classList.add("show");

}


function editMenu(id){

  const menu=menus.find(x=>x.id===id);

  if(!menu) return;

  editingMenuId=id;

  document.getElementById("menuModalTitle")
    .textContent="แก้ไขรายการขาย";

  document.getElementById("menuNameInput").value=
    menu.name;

  document.getElementById("menuCoverInput").value=
    getCover(menu.name,menu.cover);

  document.getElementById("menuModal")
    .classList.add("show");

}


function closeMenuModal(){

  document.getElementById("menuModal")
    .classList.remove("show");

}


function saveMenuModal(){

  const name=
    document.getElementById("menuNameInput")
      .value
      .trim();

  const cover=
    document.getElementById("menuCoverInput")
      .value
      .trim();

  if(!name){

    alert("กรุณาใส่ชื่อรายการขาย");

    return;

  }

  if(editingMenuId){

    const menu=menus.find(x=>x.id===editingMenuId);

    if(menu){

      menu.name=name;

      menu.cover=cover;

      if(cover){

        setCoverForName(name,cover);

      }

    }

  }else{

    menus.push({

      id:uid("menu"),

      name:name,

      cover:cover,

      ingredients:[],

      createdAt:Date.now()

    });

    if(cover){

      setCoverForName(name,cover);

    }

  }

  saveData();

  closeMenuModal();

  renderMenus();

}


function deleteMenu(id){

  const menu=menus.find(x=>x.id===id);

  if(!menu) return;

  if(!confirm(`ลบ "${menu.name}" หรือไม่?`)) return;

  menus=menus.filter(x=>x.id!==id);

  saveData();

  renderMenus();

}


function duplicateMenu(id){

  const original=menus.find(x=>x.id===id);

  if(!original) return;

  const copy={

    ...original,

    id:uid("menu"),

    name:original.name+" (สำเนา)",

    ingredients:(original.ingredients || [])
      .map(ingredient=>({

        ...ingredient,

        id:uid("ing")

      })),

    createdAt:Date.now()

  };

  menus.push(copy);

  saveData();

  renderMenus();

}


/* =========================================================
   MENU DETAIL
========================================================= */

function openMenuDetail(id){

  const menu=menus.find(x=>x.id===id);

  if(!menu) return;

  if(!Array.isArray(menu.ingredients)){
    menu.ingredients=[];
  }

  selectedMenuId=id;

  document.getElementById("costMain")
    .classList.add("hidden");

  document.getElementById("costDetail")
    .classList.add("active");

  renderMenuDetail();

}


function closeMenuDetail(){

  selectedMenuId=null;

  document.getElementById("costDetail")
    .classList.remove("active");

  document.getElementById("costMain")
    .classList.remove("hidden");

  renderMenus();

}


function renderMenuDetail(){

  const menu=menus.find(x=>x.id===selectedMenuId);

  if(!menu){

    closeMenuDetail();

    return;

  }

  if(!Array.isArray(menu.ingredients)){
    menu.ingredients=[];
  }

  const cover=getCover(menu.name,menu.cover);

  document.getElementById("menuDetailHead").innerHTML=`

    <div class="menu-detail-head">

      <div class="menu-detail-title-row">

        <div class="menu-detail-cover">
          ${cover ? escapeHTML(cover) : ""}
        </div>

        <div>

          <div class="menu-detail-name">
            ${escapeHTML(menu.name)}
          </div>

          <div class="menu-detail-count">
            วัตถุดิบ ${menu.ingredients.length} รายการ
            · รวมต้นทุน ฿${money(getMenuCost(menu))}
          </div>

        </div>

      </div>

    </div>

  `;

  renderIngredients();

}


/* =========================================================
   INGREDIENTS
========================================================= */

function renderIngredients(){

  const menu=menus.find(x=>x.id===selectedMenuId);

  if(!menu) return;

  if(!Array.isArray(menu.ingredients)){
    menu.ingredients=[];
  }

  const box=document.getElementById("ingredientList");

  if(!menu.ingredients.length){

    box.innerHTML=`
      <div class="empty">
        ยังไม่มีวัตถุดิบ
      </div>
    `;

    return;

  }

  box.innerHTML=menu.ingredients.map((ingredient,index)=>{

    const cover=
      getCover(
        ingredient.name,
        ingredient.cover
      );

    const qty=Number(ingredient.qty)||0;

    const price=Number(ingredient.price)||0;

    const total=qty*price;

    return `

      <div class="ingredient-row">

        <div class="ingredient-inner">

          <div class="ingredient-left">

            <div class="ingredient-cover">
              ${cover ? escapeHTML(cover) : ""}
            </div>

            <div class="ingredient-info">

              <div class="ingredient-name">
                ${escapeHTML(ingredient.name)}
              </div>

              <div class="ingredient-equation">
                ${qty} × ฿${money(price)}
                = ฿${money(total)}
              </div>

            </div>

          </div>


          <div class="ingredient-controls">

            <button
              class="order-btn"
              onclick="moveIngredient('${ingredient.id}',-1)"
              title="เลื่อนขึ้น">
              ↑
            </button>

            <button
              class="order-btn"
              onclick="moveIngredient('${ingredient.id}',1)"
              title="เลื่อนลง">
              ↓
            </button>

            <button
              class="detail-btn"
              onclick="openIngredientModal('${ingredient.id}')">
              รายละเอียด
            </button>

            <button
              class="trash-btn"
              onclick="deleteIngredient('${ingredient.id}')"
              title="ลบ">
              🗑️
            </button>

            <label class="toggle">

              <input
                type="checkbox"
                ${ingredient.active ? "checked" : ""}
                onchange="toggleIngredient('${ingredient.id}',this.checked)"
              >

              <span class="slider"></span>

            </label>

            <button
              class="qty-btn"
              onclick="changeIngredientQty('${ingredient.id}',-1)">
              −
            </button>

            <input
              class="qty-input"
              type="number"
              min="1"
              value="${qty}"
              onchange="setIngredientQty('${ingredient.id}',this.value)"
            >

            <button
              class="qty-btn"
              onclick="changeIngredientQty('${ingredient.id}',1)">
              +
            </button>

          </div>

        </div>

      </div>

    `;

  }).join("");

}


/* =========================================================
   ADD / EDIT INGREDIENT
========================================================= */

function openIngredientModal(id=null){

  const menu=menus.find(x=>x.id===selectedMenuId);

  if(!menu) return;

  editingIngredientId=id;

  const ingredient=id
    ? menu.ingredients.find(x=>x.id===id)
    : null;

  document.getElementById("ingredientModalTitle")
    .textContent=
      ingredient
      ? "รายละเอียดวัตถุดิบ"
      : "เพิ่มวัตถุดิบ";

  document.getElementById("ingredientNameInput").value=
    ingredient?.name || "";

  document.getElementById("ingredientCoverInput").value=
    ingredient
      ? getCover(ingredient.name,ingredient.cover)
      : "";

  document.getElementById("ingredientQtyInput").value=
    ingredient?.qty || 1;

  document.getElementById("ingredientPriceInput").value=
    ingredient?.price ?? "";

  document.getElementById("ingredientActiveInput").value=
    ingredient
      ? (ingredient.active ? "1" : "0")
      : "1";

  document.getElementById("ingredientModal")
    .classList.add("show");

}


function closeIngredientModal(){

  document.getElementById("ingredientModal")
    .classList.remove("show");

  editingIngredientId=null;

}


function changeIngredientModalQty(amount){

  const input=
    document.getElementById("ingredientQtyInput");

  let value=Number(input.value)||1;

  value+=amount;

  if(value<1) value=1;

  input.value=value;

}


function saveIngredientModal(){

  const menu=menus.find(x=>x.id===selectedMenuId);

  if(!menu) return;

  if(!Array.isArray(menu.ingredients)){
    menu.ingredients=[];
  }

  const name=
    document.getElementById("ingredientNameInput")
      .value
      .trim();

  const cover=
    document.getElementById("ingredientCoverInput")
      .value
      .trim();

  const qty=Math.max(
    1,
    Number(
      document.getElementById("ingredientQtyInput").value
    ) || 1
  );

  const price=Math.max(
    0,
    Number(
      document.getElementById("ingredientPriceInput").value
    ) || 0
  );

  const active=
    document.getElementById("ingredientActiveInput")
      .value==="1";

  if(!name){

    alert("กรุณาใส่ชื่อวัตถุดิบ");

    return;

  }

  if(editingIngredientId){

    const ingredient=
      menu.ingredients.find(
        x=>x.id===editingIngredientId
      );

    if(ingredient){

      const oldName=ingredient.name;

      ingredient.name=name;

      ingredient.cover=cover;

      ingredient.qty=qty;

      ingredient.price=price;

      ingredient.active=active;

      if(cover){

        setCoverForName(name,cover);

      }else if(
        normalizeName(oldName)!==normalizeName(name)
      ){

        /* ไม่ลบ cover เดิมของชื่อเก่า
           เพื่อให้ชื่อเดิมที่ใช้อยู่ยังคงใช้ cover เดิม */

      }

    }

  }else{

    menu.ingredients.push({

      id:uid("ing"),

      name:name,

      cover:cover,

      qty:qty,

      price:price,

      active:active,

      createdAt:Date.now()

    });

    if(cover){

      setCoverForName(name,cover);

    }

  }

  saveData();

  closeIngredientModal();

  renderMenuDetail();

}


function deleteIngredient(id){

  const menu=menus.find(x=>x.id===selectedMenuId);

  if(!menu) return;

  const ingredient=
    menu.ingredients.find(x=>x.id===id);

  if(!ingredient) return;

  if(!confirm(`ลบ "${ingredient.name}" หรือไม่?`)) return;

  menu.ingredients=
    menu.ingredients.filter(x=>x.id!==id);

  saveData();

  renderMenuDetail();

}


function toggleIngredient(id,checked){

  const menu=menus.find(x=>x.id===selectedMenuId);

  if(!menu) return;

  const ingredient=
    menu.ingredients.find(x=>x.id===id);

  if(!ingredient) return;

  ingredient.active=checked;

  saveData();

  renderMenuDetail();

}


function changeIngredientQty(id,amount){

  const menu=menus.find(x=>x.id===selectedMenuId);

  if(!menu) return;

  const ingredient=
    menu.ingredients.find(x=>x.id===id);

  if(!ingredient) return;

  let qty=Number(ingredient.qty)||1;

  qty+=amount;

  if(qty<1) qty=1;

  ingredient.qty=qty;

  saveData();

  renderMenuDetail();

}


function setIngredientQty(id,value){

  const menu=menus.find(x=>x.id===selectedMenuId);

  if(!menu) return;

  const ingredient=
    menu.ingredients.find(x=>x.id===id);

  if(!ingredient) return;

  ingredient.qty=Math.max(
    1,
    Number(value)||1
  );

  saveData();

  renderMenuDetail();

}


/* =========================================================
   MOVE INGREDIENT UP / DOWN
========================================================= */

function moveIngredient(id,direction){

  const menu=menus.find(x=>x.id===selectedMenuId);

  if(!menu) return;

  if(!Array.isArray(menu.ingredients)){
    menu.ingredients=[];
  }

  const index=
    menu.ingredients.findIndex(
      x=>x.id===id
    );

  if(index===-1) return;

  const newIndex=index+direction;

  if(newIndex<0) return;

  if(newIndex>=menu.ingredients.length) return;

  const temp=menu.ingredients[index];

  menu.ingredients[index]=
    menu.ingredients[newIndex];

  menu.ingredients[newIndex]=temp;

  saveData();

  renderMenuDetail();

}

  document.getElementById("accountTitle").value=

   CLOSE MODALS BY BACKDROP

document.getElementById("menuModal")

      closeMenuModal();
    }

  });


document.getElementById("ingredientModal")
  .addEventListener("click",function(e){

    if(e.target===this){
      closeIngredientModal();
    }

  });


/* =========================================================
   KEYBOARD / INPUT SAFETY
========================================================= */

document.addEventListener("keydown",function(e){

  if(e.key==="Escape"){

    closeMenuModal();

    closeIngredientModal();

  }

});
