<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>สมุดบัญชี</title>

<style>
:root{
  --bg:#fff8fb;
  --card:#ffffff;
  --ink:#2b2730;
  --muted:#8b848d;
  --line:#eee6eb;
  --pink:#e9a8c1;
  --pink-dark:#c96791;
  --green:#6fb28b;
  --red:#df7d87;
  --shadow:0 10px 30px rgba(90,50,70,.08);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
  "Noto Sans Thai",sans-serif;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  max-width:720px;
  margin:auto;
  min-height:100vh;
  padding-bottom:90px;
}

header{
  padding:22px 18px 10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

h1{
  margin:0;
  font-size:25px;
  font-weight:800;
}

.small{
  font-size:13px;
  color:var(--muted);
  margin-top:3px;
}

.iconbtn{
  border:0;
  background:#fff;
  border-radius:14px;
  width:48px;
  height:48px;
  font-size:25px;
  color:#1784ff;
  box-shadow:var(--shadow);
}

main{
  padding:0 14px;
}

.hero{
  background:linear-gradient(135deg,#fff,#fdeaf2);
  border:1px solid #f2dce5;
  border-radius:24px;
  padding:22px;
  box-shadow:var(--shadow);
}

.label{
  font-size:13px;
  color:var(--muted);
}

.balance{
  font-size:36px;
  font-weight:850;
  margin:4px 0 18px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  background:#fff;
  border-radius:18px;
  padding:16px;
}

.stat .title{
  font-size:13px;
  color:var(--muted);
}

.stat .value{
  font-size:20px;
  font-weight:800;
  margin-top:3px;
}

.income{
  color:var(--green);
}

.expense{
  color:var(--red);
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:14px 0 18px;
}

.action{
  border:0;
  border-radius:18px;
  padding:18px 10px;
  font-weight:800;
  font-size:16px;
}

.action.in{
  background:#e7f7ee;
  color:#39825a;
}

.action.out{
  background:#fff0f2;
  color:#c85b67;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:15px 2px 9px;
  font-size:18px;
  font-weight:800;
}

.linkbtn{
  border:0;
  background:none;
  color:var(--pink-dark);
  font-size:13px;
}

.entries{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.entry{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  box-shadow:0 4px 15px rgba(80,40,60,.04);
}

.entry-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.entry-name{
  font-weight:800;
}

.entry-meta{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}

.entry-total{
  font-size:18px;
  font-weight:850;
  white-space:nowrap;
}

.entry-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
}

.type{
  font-size:12px;
  padding:5px 9px;
  border-radius:999px;
}

.type.in{
  background:#e7f7ee;
  color:#39825a;
}

.type.out{
  background:#fff0f2;
  color:#c85b67;
}

.entry-buttons{
  display:flex;
  gap:7px;
}

.smallbtn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:10px;
  padding:7px 10px;
  font-size:12px;
}

.empty{
  text-align:center;
  padding:30px;
  color:var(--muted);
  background:#fff;
  border:1px dashed #ddcfd7;
  border-radius:18px;
}

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  z-index:10;
}

.navin{
  width:min(720px,100%);
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  padding:8px 12px env(safe-area-inset-bottom);
}

nav button{
  border:0;
  background:none;
  padding:8px 4px;
  color:var(--muted);
  font-size:12px;
}

nav button.active{
  color:var(--pink-dark);
  font-weight:800;
}

.sheet{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  display:none;
  align-items:flex-end;
  z-index:20;
}

.sheet.show{
  display:flex;
}

.panel{
  width:100%;
  max-width:720px;
  margin:auto;
  background:#fff;
  border-radius:26px 26px 0 0;
  padding:22px;
  max-height:90vh;
  overflow:auto;
}

.panel h3{
  margin:0 0 14px;
  font-size:20px;
}

.field{
  margin:10px 0;
}

.field label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:5px;
}

.field input,
.field select{
  width:100%;
  border:1px solid var(--line);
  border-radius:13px;
  padding:12px;
  background:#fff;
  outline:none;
}

.field input:focus,
.field select:focus{
  border-color:var(--pink);
}

.form-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.primary,
.secondary{
  border:0;
  border-radius:14px;
  padding:13px;
  font-weight:800;
}

.primary{
  background:var(--pink);
  color:#fff;
}

.secondary{
  background:#f5f1f3;
  color:#6e6670;
}

.table-wrap{
  overflow:auto;
  background:#fff;
  border-radius:18px;
  border:1px solid var(--line);
}

table{
  border-collapse:collapse;
  width:100%;
  min-width:620px;
}

th,td{
  padding:11px 10px;
  border-bottom:1px solid var(--line);
  text-align:left;
  font-size:13px;
}

th{
  background:#fff7fa;
}

@media(max-width:500px){
  .stats{
    grid-template-columns:1fr 1fr;
  }

  .balance{
    font-size:32px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div>
    <h1 id="shopName">📒 สมุดบัญชี</h1>
    <div class="small" id="shopSubtitle">รายรับ–รายจ่ายของร้าน</div>
  </div>

  <button class="iconbtn" onclick="openSettings()">＋</button>
</header>

<main>

<section class="hero">

  <div class="label">คงเหลือทั้งหมด</div>

  <div class="balance" id="balance">฿0.00</div>

  <div class="stats">

    <div class="stat">
      <div class="title">รายรับ</div>
      <div class="value income" id="income">฿0.00</div>
    </div>

    <div class="stat">
      <div class="title">รายจ่าย</div>
      <div class="value expense" id="expense">฿0.00</div>
    </div>

  </div>

</section>

<section class="actions">

  <button class="action in" onclick="openEntry('income')">
    ＋ เพิ่มรายรับ
  </button>

  <button class="action out" onclick="openEntry('expense')">
    − เพิ่มรายจ่าย
  </button>

</section>

<div class="section-title">
  <span>รายการล่าสุด</span>
  <button class="linkbtn" onclick="showAll()">ดูทั้งหมด</button>
</div>

<div id="entries" class="entries"></div>

</main>

</div>

<nav>
  <div class="navin">

    <button class="active" onclick="goHome(this)">
      🏠<br>หน้าหลัก
    </button>

    <button onclick="showAll(this)">
      ▤<br>สมุดบัญชี
    </button>

    <button onclick="openSettings()">
      •••<br>เพิ่มเติม
    </button>

  </div>
</nav>


<!-- เพิ่ม/แก้รายการ -->

<div class="sheet" id="entrySheet">

  <div class="panel">

    <h3 id="formTitle">เพิ่มรายรับ</h3>

    <div class="field">
      <label>ประเภท</label>

      <select id="type">
        <option value="income">รายรับ</option>
        <option value="expense">รายจ่าย</option>
      </select>
    </div>

    <div class="field">
      <label>รายการ</label>
      <input id="name" type="text" placeholder="เช่น ข้าวเหนียวไก่ทอด">
    </div>

    <div class="field">
      <label>จำนวน</label>
      <input id="qty" type="number" min="0" step="1" placeholder="1">
    </div>

    <div class="field">
      <label>ราคาต่อหน่วย</label>
      <input id="price" type="number" min="0" step="0.01" placeholder="0.00">
    </div>

    <div class="field">
      <label>วันที่</label>
      <input id="date" type="date">
    </div>

    <div class="field">
      <label>หมายเหตุ</label>
      <input id="note" type="text" placeholder="ใส่หรือไม่ใส่ก็ได้">
    </div>

    <div class="form-buttons">

      <button class="secondary" onclick="closeSheet()">
        ยกเลิก
      </button>

      <button class="primary" onclick="saveEntry()">
        บันทึก
      </button>

    </div>

  </div>

</div>


<!-- ตั้งค่า -->

<div class="sheet" id="settingsSheet">

  <div class="panel">

    <h3>⚙️ ตั้งค่าร้าน</h3>

    <div class="field">
      <label>ชื่อร้าน</label>
      <input id="settingName" type="text" placeholder="ชื่อร้านของคุณ">
    </div>

    <div class="field">
      <label>คำอธิบาย</label>
      <input id="settingSubtitle" type="text" placeholder="รายรับ–รายจ่ายของร้าน">
    </div>

    <div class="form-buttons">

      <button class="secondary" onclick="closeSettings()">
        ยกเลิก
      </button>

      <button class="primary" onclick="saveSettings()">
        บันทึก
      </button>

    </div>

  </div>

</div>


<!-- ดูทั้งหมด -->

<div class="sheet" id="allSheet">

  <div class="panel">

    <h3>📋 รายการทั้งหมด</h3>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>วันที่</th>
            <th>รายการ</th>
            <th>ประเภท</th>
            <th>จำนวน</th>
            <th>ราคา/หน่วย</th>
            <th>รวม</th>
          </tr>
        </thead>

        <tbody id="allTable"></tbody>

      </table>

    </div>

    <div class="form-buttons">

      <button class="secondary" onclick="closeAll()">
        ปิด
      </button>

    </div>

  </div>

</div>


<script>

let entries = JSON.parse(localStorage.getItem("accountEntries") || "[]");

let settings = JSON.parse(
  localStorage.getItem("accountSettings") ||
  '{"name":"สมุดบัญชี","subtitle":"รายรับ–รายจ่ายของร้าน"}'
);

let editingId = null;


/* =========================
   เริ่มต้น
========================= */

function init(){

  document.getElementById("shopName").textContent =
    "📒 " + settings.name;

  document.getElementById("shopSubtitle").textContent =
    settings.subtitle;

  render();

}


/* =========================
   เงิน
========================= */

function money(value){

  return "฿" + Number(value || 0).toLocaleString(
    "th-TH",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


/* =========================
   แสดงรายการ
========================= */

function render(){

  const box = document.getElementById("entries");

  box.innerHTML = "";

  let income = 0;
  let expense = 0;

  entries.forEach(item => {

    const total =
      Number(item.qty || 0) *
      Number(item.price || 0);

    if(item.type === "income"){
      income += total;
    }else{
      expense += total;
    }

  });


  const balance = income - expense;

  document.getElementById("income").textContent = money(income);

  document.getElementById("expense").textContent = money(expense);

  document.getElementById("balance").textContent = money(balance);


  const latest = [...entries]
    .sort((a,b) => new Date(b.date) - new Date(a.date))
    .slice(0,10);


  if(latest.length === 0){

    box.innerHTML = `
      <div class="empty">
        ยังไม่มีรายการ<br><br>
        กด “เพิ่มรายรับ” หรือ “เพิ่มรายจ่าย” ได้เลย 💗
      </div>
    `;

    return;
  }


  latest.forEach(item => {

    const total =
      Number(item.qty || 0) *
      Number(item.price || 0);

    const typeText =
      item.type === "income"
      ? "รายรับ"
      : "รายจ่าย";

    const sign =
      item.type === "income"
      ? "+"
      : "-";


    const div = document.createElement("div");

    div.className = "entry";

    div.innerHTML = `

      <div class="entry-top">

        <div>

          <div class="entry-name">
            ${escapeHTML(item.name)}
          </div>

          <div class="entry-meta">
            ${item.date}
            ${item.note ? " • " + escapeHTML(item.note) : ""}
          </div>

        </div>

        <div class="entry-total ${
          item.type === "income"
          ? "income"
          : "expense"
        }">

          ${sign}${money(total)}

        </div>

      </div>


      <div class="entry-bottom">

        <span class="type ${
          item.type === "income"
          ? "in"
          : "out"
        }">

          ${typeText}

        </span>


        <div class="entry-buttons">

          <button
            class="smallbtn"
            onclick="editEntry('${item.id}')">

            ✏️ แก้ไข

          </button>

          <button
            class="smallbtn"
            onclick="deleteEntry('${item.id}')">

            🗑️ ลบ

          </button>

        </div>

      </div>

    `;

    box.appendChild(div);

  });

}


/* =========================
   เพิ่มรายการ
========================= */

function openEntry(type){

  editingId = null;

  document.getElementById("formTitle").textContent =
    type === "income"
    ? "เพิ่มรายรับ"
    : "เพิ่มรายจ่าย";

  document.getElementById("type").value = type;

  document.getElementById("name").value = "";

  document.getElementById("qty").value = "1";

  document.getElementById("price").value = "";

  document.getElementById("date").value =
    new Date().toISOString().slice(0,10);

  document.getElementById("note").value = "";

  document.getElementById("entrySheet")
    .classList.add("show");

}


/* =========================
   แก้รายการ
========================= */

function editEntry(id){

  const item = entries.find(x => x.id === id);

  if(!item) return;

  editingId = id;

  document.getElementById("formTitle").textContent =
    "แก้ไขรายการ";

  document.getElementById("type").value =
    item.type;

  document.getElementById("name").value =
    item.name;

  document.getElementById("qty").value =
    item.qty;

  document.getElementById("price").value =
    item.price;

  document.getElementById("date").value =
    item.date;

  document.getElementById("note").value =
    item.note || "";

  document.getElementById("entrySheet")
    .classList.add("show");

}


/* =========================
   บันทึกรายการ
========================= */

function saveEntry(){

  const type =
    document.getElementById("type").value;

  const name =
    document.getElementById("name").value.trim();

  const qty =
    Number(document.getElementById("qty").value);

  const price =
    Number(document.getElementById("price").value);

  const date =
    document.getElementById("date").value;

  const note =
    document.getElementById("note").value.trim();


  if(!name){

    alert("กรุณาใส่ชื่อรายการ");

    return;
  }


  if(qty <= 0){

    alert("จำนวนต้องมากกว่า 0");

    return;
  }


  if(price < 0){

    alert("ราคาต้องไม่ติดลบ");

    return;
  }


  const item = {

    id: editingId || Date.now().toString(),

    type,

    name,

    qty,

    price,

    date,

    note

  };


  if(editingId){

    const index =
      entries.findIndex(x => x.id === editingId);

    if(index !== -1){

      entries[index] = item;

    }

  }else{

    entries.push(item);

  }


  localStorage.setItem(
    "accountEntries",
    JSON.stringify(entries)
  );


  closeSheet();

  render();

}


/* =========================
   ลบ
========================= */

function deleteEntry(id){

  const item =
    entries.find(x => x.id === id);

  if(!item) return;


  const ok =
    confirm(
      `ต้องการลบ "${item.name}" ใช่ไหม?`
    );


  if(!ok) return;


  entries =
    entries.filter(x => x.id !== id);


  localStorage.setItem(
    "accountEntries",
    JSON.stringify(entries)
  );


  render();

}


/* =========================
   ตั้งค่าร้าน
========================= */

function openSettings(){

  document.getElementById("settingName").value =
    settings.name;

  document.getElementById("settingSubtitle").value =
    settings.subtitle;

  document.getElementById("settingsSheet")
    .classList.add("show");

}


function saveSettings(){

  const name =
    document.getElementById("settingName")
    .value.trim();

  const subtitle =
    document.getElementById("settingSubtitle")
    .value.trim();


  settings.name =
    name || "สมุดบัญชี";

  settings.subtitle =
    subtitle || "รายรับ–รายจ่ายของร้าน";


  localStorage.setItem(
    "accountSettings",
    JSON.stringify(settings)
  );


  document.getElementById("shopName").textContent =
    "📒 " + settings.name;

  document.getElementById("shopSubtitle").textContent =
    settings.subtitle;


  closeSettings();

}


/* =========================
   ดูทั้งหมด
========================= */

function showAll(){

  const tbody =
    document.getElementById("allTable");

  tbody.innerHTML = "";


  const sorted =
    [...entries].sort(
      (a,b) =>
      new Date(b.date) - new Date(a.date)
    );


  if(sorted.length === 0){

    tbody.innerHTML = `
      <tr>
        <td colspan="6" style="text-align:center">
          ยังไม่มีรายการ
        </td>
      </tr>
    `;

  }else{

    sorted.forEach(item => {

      const total =
        Number(item.qty || 0) *
        Number(item.price || 0);


      const tr =
        document.createElement("tr");


      tr.innerHTML = `

        <td>${item.date}</td>

        <td>${escapeHTML(item.name)}</td>

        <td>
          ${item.type === "income"
            ? "รายรับ"
            : "รายจ่าย"}
        </td>

        <td>${item.qty}</td>

        <td>${money(item.price)}</td>

        <td>${money(total)}</td>

      `;


      tbody.appendChild(tr);

    });

  }


  document.getElementById("allSheet")
    .classList.add("show");

}


/* =========================
   ปิดหน้าต่าง
========================= */

function closeSheet(){

  document.getElementById("entrySheet")
    .classList.remove("show");

}


function closeSettings(){

  document.getElementById("settingsSheet")
    .classList.remove("show");

}


function closeAll(){

  document.getElementById("allSheet")
    .classList.remove("show");

}


function goHome(){

  closeAll();

}


/* =========================
   ป้องกัน HTML แปลก ๆ
========================= */

function escapeHTML(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   เริ่มทำงาน
========================= */

init();

</script>

</body>
</html>
