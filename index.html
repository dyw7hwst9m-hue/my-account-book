<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">
<title>สมุดบัญชี</title>

<style>
:root{
  --bg:#fff7fb;
  --card:#fff;
  --ink:#29252b;
  --muted:#aaa3aa;
  --line:#f0e2e9;
  --pink:#f8e1eb;
  --pink2:#f5d5e3;
  --pink3:#fff0f6;
  --pinkText:#bd668c;
  --green:#58a77a;
  --red:#df6d7e;
  --blue:#1687ee;
  --blueSoft:#edf6ff;
  --shadow:0 10px 30px rgba(104,70,91,.07);
  --radius:28px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--ink);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Thai",
    "Noto Sans",
    sans-serif;
}

body{
  min-height:100vh;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:1100px;
  margin:0 auto;
  padding:16px 18px 50px;
}

/* =========================
   NAV
========================= */

.nav{
  position:sticky;
  top:0;
  z-index:50;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  padding:8px;
  background:rgba(255,255,255,.94);
  border-radius:28px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(12px);
  margin-bottom:18px;
}

.nav-btn{
  border:0;
  background:transparent;
  min-height:82px;
  border-radius:24px;
  color:#777;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
}

.nav-btn .icon{
  font-size:28px;
  line-height:1;
}

.nav-btn .label{
  font-size:15px;
}

.nav-btn.active{
  background:var(--pink);
  color:var(--pinkText);
  font-weight:700;
}

/* =========================
   COMMON
========================= */

.page{
  display:none;
}

.page.active{
  display:block;
}

.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.section{
  background:#fff;
  border-radius:var(--radius);
  padding:24px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
}

h1,h2,h3,p{
  margin-top:0;
}

.page-title{
  font-size:29px;
  margin:0 0 20px;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:13px;
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:#aaa;
}

/* =========================
   ACCOUNT
========================= */

.account-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.account-title{
  font-size:29px;
  font-weight:800;
  margin:0;
}

.title-edit{
  border:1px solid var(--line);
  background:#fff;
  color:var(--blue);
  border-radius:12px;
  padding:7px 10px;
  font-size:13px;
}

.account-form{
  background:#fff;
  border-radius:28px;
  padding:20px;
  box-shadow:var(--shadow);
  margin-bottom:18px;
}

.type-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:15px;
}

.type-btn{
  border:1px solid var(--line);
  background:#fff;
  padding:13px;
  border-radius:16px;
  font-weight:700;
}

.type-btn.income.active{
  background:#edf8f1;
  color:var(--green);
}

.type-btn.expense.active{
  background:#fff0f3;
  color:var(--red);
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  color:#888;
  font-size:14px;
}

.field input,
.field select{
  width:100%;
  border:1px solid var(--line);
  border-radius:15px;
  padding:12px 13px;
  background:#fff;
  outline:none;
}

.field input:focus,
.field select:focus{
  border-color:#e7aac3;
}

.qty-control{
  display:grid;
  grid-template-columns:42px 1fr 42px;
  gap:7px;
}

.qty-control button{
  border:0;
  background:var(--pink3);
  color:var(--blue);
  border-radius:13px;
  font-size:22px;
}

.qty-control input{
  text-align:center;
}

.primary-btn{
  width:100%;
  border:0;
  background:var(--pink);
  color:var(--pinkText);
  border-radius:16px;
  padding:14px;
  font-weight:800;
  margin-top:15px;
}

.tx-list{
  background:#fff;
  border-radius:28px;
  padding:12px 22px;
  box-shadow:var(--shadow);
}

.tx-row{
  display:grid;
  grid-template-columns:58px 1fr auto;
  gap:10px;
  align-items:center;
  padding:15px 0;
  border-bottom:1px solid var(--line);
}

.tx-row:last-child{
  border-bottom:0;
}

.tx-sign{
  width:58px;
  height:58px;
  border-radius:18px;
  background:#fff0f6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:29px;
}

.tx-main{
  min-width:0;
}

.tx-name{
  font-size:18px;
  font-weight:700;
  overflow-wrap:anywhere;
}

.tx-formula{
  margin-top:3px;
  color:#aaa;
  font-size:15px;
}

.tx-right{
  text-align:right;
}

.tx-amount{
  font-size:19px;
  font-weight:800;
  white-space:nowrap;
}

.tx-amount.income{
  color:var(--green);
}

.tx-amount.expense{
  color:var(--red);
}

.tx-actions{
  display:flex;
  justify-content:flex-end;
  gap:5px;
  margin-top:5px;
}

.small-btn{
  border:1px solid var(--line);
  background:#fff;
  color:var(--blue);
  border-radius:11px;
  padding:5px 9px;
  font-size:12px;
}

.small-btn.delete{
  border:0;
  background:#fff0f3;
  color:var(--red);
}

/* =========================
   SUMMARY
========================= */

.summary-page{
  padding-bottom:10px;
}

.summary-title{
  font-size:30px;
  margin:0 0 18px;
}

.summary-controls{
  background:#fff;
  border-radius:25px;
  padding:15px;
  box-shadow:var(--shadow);
  margin-bottom:15px;
}

.period-buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:12px;
}

.period-btn{
  border:1px solid var(--line);
  background:#fff;
  color:#777;
  border-radius:14px;
  padding:11px 5px;
}

.period-btn.active{
  background:var(--pink);
  color:var(--pinkText);
  font-weight:800;
}

.period-inputs{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

.period-inputs input,
.period-inputs select{
  flex:1;
  min-width:130px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  padding:11px 12px;
  outline:none;
}

.display-mode{
  display:flex;
  gap:8px;
  margin-top:11px;
}

.mode-btn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:13px;
  padding:9px 15px;
  color:#777;
}

.mode-btn.active{
  background:var(--pink);
  color:var(--pinkText);
  font-weight:700;
}

/* Summary total */

.summary-total{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:18px;
}

.total-box{
  background:#fff;
  border-radius:24px;
  padding:18px 15px;
  box-shadow:var(--shadow);
}

.total-label{
  color:#777;
  font-size:16px;
}

.total-value{
  font-size:26px;
  font-weight:900;
  margin-top:5px;
}

.total-value.income{
  color:var(--green);
}

.total-value.expense{
  color:var(--red);
}

.total-value.balance{
  color:#527f98;
}

/* Month / Day groups */

.summary-groups{
  display:flex;
  flex-direction:column;
  gap:22px;
}

.summary-group{
  background:#fff;
  border:1px solid #ecdde5;
  border-radius:23px;
  overflow:hidden;
}

.summary-group-head{
  background:#fdebf3;
  padding:13px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.summary-group-title{
  color:#b75f87;
  font-size:19px;
  font-weight:800;
}

.summary-group-total{
  color:#9b7c8b;
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
}

.summary-items{
  padding:0 18px;
}

.summary-item{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid var(--line);
}

.summary-item:last-child{
  border-bottom:0;
}

.summary-item-left{
  min-width:0;
}

.summary-item-cover{
  font-size:22px;
  line-height:1;
  margin-bottom:4px;
}

.summary-item-name{
  font-size:16px;
  font-weight:600;
  overflow-wrap:anywhere;
}

.summary-item-detail{
  color:#aaa;
  font-size:14px;
  margin-top:3px;
}

.summary-item-amount{
  font-size:19px;
  font-weight:800;
  white-space:nowrap;
}

.summary-item-amount.income{
  color:var(--green);
}

.summary-item-amount.expense{
  color:var(--red);
}

.summary-number-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.number-card{
  background:#fff7fa;
  border-radius:18px;
  padding:18px;
}

.number-card .label{
  color:#999;
}

.number-card .value{
  font-size:24px;
  font-weight:900;
  margin-top:5px;
}

.number-card.income .value{
  color:var(--green);
}

.number-card.expense .value{
  color:var(--red);
}

/* =========================
   COMBINED
========================= */

.search-box{
  margin-bottom:15px;
}

.search-box input{
  width:100%;
  border:1px solid var(--line);
  border-radius:17px;
  padding:14px;
  outline:none;
}

.combined-list{
  background:#fff;
  border-radius:28px;
  padding:0 22px;
  box-shadow:var(--shadow);
}

/* =========================
   COST
========================= */

.cost-sales{
  background:#fff;
  border-radius:28px;
  padding:20px;
  box-shadow:var(--shadow);
}

.sales-card{
  border:1px solid var(--line);
  border-radius:22px;
  padding:14px;
  margin-bottom:12px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:15px;
  align-items:center;
}

.sales-left{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.sales-cover{
  width:58px;
  height:58px;
  border-radius:18px;
  background:var(--pink3);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:29px;
  flex:none;
}

.sales-name{
  font-size:22px;
  font-weight:900;
  overflow-wrap:anywhere;
}

.sales-info{
  margin-top:3px;
  color:#999;
  font-size:13px;
}

.sales-right{
  text-align:right;
}

.sales-cost{
  color:#5aa779;
  font-size:19px;
  font-weight:900;
}

.sales-count{
  color:#aaa;
  font-size:12px;
  margin-top:2px;
}

.sales-actions{
  display:flex;
  justify-content:flex-end;
  flex-wrap:wrap;
  gap:5px;
  margin-top:7px;
}

.cost-add{
  width:100%;
  border:0;
  background:var(--pink);
  color:var(--pinkText);
  padding:14px;
  border-radius:17px;
  font-weight:800;
  margin-bottom:15px;
}

/* Ingredients */

.ingredient-page-head{
  background:#fff;
  border-radius:28px;
  padding:18px;
  box-shadow:var(--shadow);
  margin-bottom:18px;
}

.back-btn{
  border:0;
  background:var(--pink3);
  color:var(--blue);
  border-radius:13px;
  padding:8px 13px;
  margin-bottom:13px;
}

.sales-edit-box{
  display:flex;
  gap:12px;
  align-items:center;
}

.sales-edit-cover{
  width:72px;
  height:72px;
  border-radius:20px;
  background:var(--pink3);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
  flex:none;
}

.sales-edit-name{
  font-size:26px;
  font-weight:900;
}

.ingredient-section{
  background:#fff;
  border-radius:28px;
  padding:20px;
  box-shadow:var(--shadow);
}

.ingredient-heading{
  font-size:25px;
  margin:0 0 10px;
}

.ingredient-note{
  color:#aaa;
  margin-bottom:18px;
}

.ingredient-row{
  border:1px solid var(--line);
  border-radius:22px;
  padding:14px;
  margin-bottom:11px;
}

.ingredient-inner{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  align-items:center;
}

.ingredient-left{
  min-width:0;
}

.ingredient-cover{
  width:56px;
  height:56px;
  border-radius:17px;
  background:var(--pink3);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  float:left;
  margin-right:11px;
}

.ingredient-name{
  font-size:21px;
  font-weight:900;
  overflow-wrap:anywhere;
}

.ingredient-equation{
  color:#aaa;
  font-size:14px;
  margin-top:5px;
}

.ingredient-tools{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:5px;
  flex-wrap:nowrap;
}

.arrow-btn,
.detail-btn,
.delete-ing-btn,
.qty-btn{
  border:0;
  background:#f8eff4;
  color:var(--blue);
  min-width:35px;
  height:35px;
  border-radius:10px;
  padding:0 9px;
}

.delete-ing-btn{
  color:#777;
}

.detail-btn{
  color:#777;
  font-size:12px;
}

.switch{
  width:53px;
  height:31px;
  background:#d7d7d7;
  border-radius:30px;
  position:relative;
  border:0;
  padding:0;
  flex:none;
}

.switch::after{
  content:"";
  width:25px;
  height:25px;
  background:#fff;
  border-radius:50%;
  position:absolute;
  top:3px;
  left:3px;
  transition:.2s;
  box-shadow:0 1px 4px rgba(0,0,0,.15);
}

.switch.on{
  background:#66b38a;
}

.switch.on::after{
  left:25px;
}

.qty-mini{
  display:flex;
  align-items:center;
  gap:4px;
}

.qty-number{
  width:38px;
  height:35px;
  border:0;
  background:#fff;
  text-align:center;
  border-radius:10px;
  font-size:17px;
}

.add-ingredient{
  width:100%;
  border:0;
  background:var(--pink);
  color:var(--pinkText);
  border-radius:17px;
  padding:14px;
  font-weight:800;
  margin-top:8px;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(40,30,38,.35);
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:12px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:620px;
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:28px;
  padding:22px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}

.modal-head h3{
  margin:0;
  font-size:24px;
}

.close-btn{
  border:0;
  background:var(--pink3);
  border-radius:12px;
  width:38px;
  height:38px;
}

.modal-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:18px;
}

.cancel-btn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:15px;
  padding:13px;
}

.save-btn{
  border:0;
  background:var(--pink);
  color:var(--pinkText);
  border-radius:15px;
  padding:13px;
  font-weight:800;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

  .app{
    padding:8px 16px 35px;
  }

  .nav{
    border-radius:24px;
    padding:6px;
  }

  .nav-btn{
    min-height:72px;
    border-radius:20px;
  }

  .nav-btn .icon{
    font-size:25px;
  }

  .nav-btn .label{
    font-size:13px;
  }

  .section{
    padding:18px;
  }

  .summary-total{
    gap:8px;
  }

  .total-box{
    padding:14px 10px;
  }

  .total-label{
    font-size:13px;
  }

  .total-value{
    font-size:20px;
  }

  .summary-group-head{
    padding:12px 14px;
  }

  .summary-group-title{
    font-size:17px;
  }

  .summary-group-total{
    font-size:12px;
  }

  .summary-items{
    padding:0 14px;
  }

  .summary-item-amount{
    font-size:17px;
  }

  .ingredient-inner{
    grid-template-columns:1fr;
  }

  .ingredient-tools{
    justify-content:flex-end;
    overflow-x:auto;
    padding-top:4px;
  }

  .sales-card{
    grid-template-columns:1fr;
  }

  .sales-right{
    text-align:left;
  }

  .sales-actions{
    justify-content:flex-start;
  }
}

@media(max-width:470px){

  .period-buttons{
    gap:5px;
  }

  .period-btn{
    font-size:13px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .tx-row{
    grid-template-columns:48px 1fr;
  }

  .tx-sign{
    width:48px;
    height:48px;
    border-radius:15px;
  }

  .tx-right{
    grid-column:2;
  }

  .summary-total{
    grid-template-columns:1fr;
  }

  .summary-number-row{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- ================= NAV ================= -->

  <nav class="nav">

    <button class="nav-btn active" data-page="account">
      <span class="icon">📒</span>
      <span class="label">บัญชี</span>
    </button>

    <button class="nav-btn" data-page="summary">
      <span class="icon">📊</span>
      <span class="label">สรุป</span>
    </button>

    <button class="nav-btn" data-page="combined">
      <span class="icon">📋</span>
      <span class="label">รวมรายการ</span>
    </button>

    <button class="nav-btn" data-page="cost">
      <span class="icon">🧮</span>
      <span class="label">ต้นทุน</span>
    </button>

  </nav>


  <!-- =====================================================
       PAGE 1 : ACCOUNT
  ====================================================== -->

  <main id="page-account" class="page active">

    <section class="section">

      <div class="account-head">
        <h1 class="account-title" id="accountTitle">📋 รายการล่าสุด</h1>
        <button class="title-edit" onclick="editTitle()">แก้ชื่อ</button>
      </div>

    </section>


    <section class="account-form">

      <div class="type-buttons">

        <button
          id="incomeTypeBtn"
          class="type-btn income active"
          onclick="setAccountType('income')">
          ＋ รายรับ
        </button>

        <button
          id="expenseTypeBtn"
          class="type-btn expense"
          onclick="setAccountType('expense')">
          − รายจ่าย
        </button>

      </div>


      <div class="form-grid">

        <div class="field full">
          <label>รายการ</label>
          <input
            id="txName"
            type="text"
            placeholder="ชื่อรายการ">
        </div>


        <div class="field">
          <label>จำนวน</label>

          <div class="qty-control">

            <button onclick="changeTxQty(-1)">−</button>

            <input
              id="txQty"
              type="number"
              value="1"
              min="0.01"
              step="any">

            <button onclick="changeTxQty(1)">＋</button>

          </div>
        </div>


        <div class="field">
          <label>ราคาต่อหน่วย</label>
          <input
            id="txPrice"
            type="number"
            min="0"
            step="any"

<script>

/* =========================================================
   DATA
========================================================= */

const STORAGE_KEY = "myAccountBook_final_v10";

let state = {
  title:"สมุดบัญชี",
  transactions:[],
  menus:[],
  covers:{}
};

let accountType = "income";

let summaryPeriod = "day";

let summaryMode = "detail";

let selectedIngredientMenuId = null;

let editingSalesId = null;

let editingIngredientId = null;


/* =========================================================
   LOAD / SAVE
========================================================= */

function loadState(){

  try{

    const raw = localStorage.getItem(STORAGE_KEY);

    if(raw){

      const saved = JSON.parse(raw);

      state = {
        ...state,
        ...saved
      };

    }

  }catch(e){

    console.error(e);

  }


  migrateOldData();

  saveState();

}


function saveState(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );

}


/* =========================================================
   MIGRATION
   รองรับข้อมูลจากเวอร์ชันเก่า
========================================================= */

function migrateOldData(){

  if(!Array.isArray(state.transactions)){
    state.transactions = [];
  }

  if(!Array.isArray(state.menus)){
    state.menus = [];
  }

  if(!state.covers || typeof state.covers !== "object"){
    state.covers = {};
  }


  state.transactions =
    state.transactions.map(t => {

      return {

        id:t.id || uid(),

        type:
          t.type === "expense"
            ? "expense"
            : "income",

        name:
          t.name ||
          t.description ||
          "รายการ",

        qty:
          Number(t.qty ?? t.quantity ?? 1) || 1,

        price:
          Number(t.price ?? t.amount ?? 0) || 0,

        date:
          t.date ||
          today(),

        note:
          t.note || "",

        cover:
          t.cover || ""

      };

    });


  state.menus =
    state.menus.map(menu => {

      return {

        id:menu.id || uid(),

        name:
          menu.name ||
          menu.title ||
          "รายการขาย",

        cover:
          menu.cover || "",

        ingredients:
          Array.isArray(menu.ingredients)
            ? menu.ingredients.map(ing => {

                return {

                  id:ing.id || uid(),

                  name:
                    ing.name ||
                    "วัตถุดิบ",

                  cover:
                    ing.cover || "",

                  qty:
                    Number(
                      ing.qty ??
                      ing.purchaseQty ??
                      1
                    ) || 1,

                  price:
                    Number(
                      ing.price ??
                      ing.purchasePrice ??
                      0
                    ) || 0,

                  enabled:
                    ing.enabled !== false

                };

              })
            : []

      };

    });

}


/* =========================================================
   BASIC HELPERS
========================================================= */

function uid(){

  return Date.now().toString(36) +
    Math.random().toString(36).slice(2);

}


function today(){

  const d = new Date();

  const y = d.getFullYear();

  const m = String(d.getMonth()+1).padStart(2,"0");

  const day = String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;

}


function money(n){

  return Number(n || 0).toLocaleString(
    "th-TH",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


function moneyBaht(n){

  return "฿" + money(n);

}


function escapeHtml(str){

  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function normName(name){

  return String(name || "")
    .trim()
    .toLowerCase();

}


function getCover(name, ownCover=""){

  const key = normName(name);

  if(ownCover){

    state.covers[key] = ownCover;

    return ownCover;

  }

  return state.covers[key] || "";

}


/* =========================================================
   NAVIGATION
========================================================= */

document.querySelectorAll(".nav-btn")
  .forEach(btn => {

    btn.addEventListener("click",() => {

      const page = btn.dataset.page;

      showPage(page);

    });

  });


function showPage(page){

  document
    .querySelectorAll(".page")
    .forEach(p => p.classList.remove("active"));


  const target =
    document.getElementById(
      "page-" + page
    );

  if(target){

    target.classList.add("active");

  }


  document
    .querySelectorAll(".nav-btn")
    .forEach(btn => {

      btn.classList.toggle(
        "active",
        btn.dataset.page === page
      );

    });


  if(page === "account"){
    renderAccount();
  }

  if(page === "summary"){
    renderSummary();
  }

  if(page === "combined"){
    renderCombined();
  }

  if(page === "cost"){
    renderSales();
  }

}


/* =========================================================
   ACCOUNT
========================================================= */

function setAccountType(type){

  accountType = type;

  document
    .getElementById("incomeTypeBtn")
    .classList.toggle(
      "active",
      type === "income"
    );

  document
    .getElementById("expenseTypeBtn")
    .classList.toggle(
      "active",
      type === "expense"
    );

}


function changeTxQty(delta){

  const input =
    document.getElementById("txQty");

  let value =
    Number(input.value) || 0;

  value += delta;

  if(value < 0.01){
    value = 0.01;
  }

  input.value = value;

}


function saveTx(){

  const name =
    document.getElementById("txName")
      .value.trim();

  const qty =
    Number(
      document.getElementById("txQty")
        .value
    );

  const price =
    Number(
      document.getElementById("txPrice")
        .value
    );

  const date =
    document.getElementById("txDate")
      .value || today();

  const cover =
    document.getElementById("txCover")
      .value.trim();

  const note =
    document.getElementById("txNote")
      .value.trim();


  if(!name){

    alert("กรุณาใส่ชื่อรายการ");

    return;

  }


  if(!qty || qty <= 0){

    alert("กรุณาใส่จำนวน");

    return;

  }


  if(price < 0 || Number.isNaN(price)){

    alert("กรุณาใส่ราคา");

    return;

  }


  const tx = {

    id:uid(),

    type:accountType,

    name:name,

    qty:qty,

    price:price,

    date:date,

    note:note,

    cover:cover

  };


  state.transactions.unshift(tx);


  if(cover){

    state.covers[
      normName(name)
    ] = cover;

  }


  saveState();

  clearTxForm();

  renderAccount();

  renderSummary();

  renderCombined();

}


function clearTxForm(){

  document.getElementById("txName").value = "";

  document.getElementById("txQty").value = "1";

  document.getElementById("txPrice").value = "";

  document.getElementById("txDate").value = today();

  document.getElementById("txCover").value = "";

  document.getElementById("txNote").value = "";

}


function editTitle(){

  const oldTitle =
    state.title || "สมุดบัญชี";

  const value =
    prompt(
      "แก้ชื่อหัวข้อ",
      oldTitle
    );

  if(value === null){
    return;
  }

  const text =
    value.trim();

  if(!text){
    return;
  }

  state.title = text;

  saveState();

  renderAccount();

}


function renderAccount(){

  document.getElementById("accountTitle")
    .textContent =
      "📋 " +
      (state.title || "รายการล่าสุด");


  const box =
    document.getElementById("accountList");


  if(!state.transactions.length){

    box.innerHTML =
      `<div class="empty">
        ยังไม่มีรายการ
      </div>`;

    return;

  }


  box.innerHTML =
    state.transactions
      .map(tx => transactionHtml(tx))
      .join("");

}


function transactionHtml(tx){

  const cover =
    getCover(tx.name,tx.cover);


  const sign =
    tx.type === "income"
      ? "+"
      : "−";


  const total =
    Number(tx.qty || 0) *
    Number(tx.price || 0);


  return `

    <div class="tx-row">

      <div class="tx-sign">
        ${cover
          ? escapeHtml(cover)
          : sign}
      </div>


      <div class="tx-main">

        <div class="tx-name">
          ${escapeHtml(tx.name)}
        </div>

        <div class="tx-formula">
          ${formatNumber(tx.qty)}
          ×
          ${moneyBaht(tx.price)}
          =
          ${moneyBaht(total)}
          ·
          ${escapeHtml(tx.date)}
        </div>

        ${
          tx.note
            ? `<div class="small muted">
                ${escapeHtml(tx.note)}
              </div>`
            : ""
        }

      </div>


      <div class="tx-right">

        <div class="tx-amount ${tx.type}">
          ${tx.type === "income" ? "+" : "−"}
          ${moneyBaht(total)}
        </div>


        <div class="tx-actions">

          <button
            class="small-btn"
            onclick="editTx('${tx.id}')">
            แก้ไข
          </button>

          <button
            class="small-btn delete"
            onclick="deleteTx('${tx.id}')">
            ลบ
          </button>

        </div>

      </div>

    </div>

  `;

}


function formatNumber(n){

  return Number(n || 0)
    .toLocaleString(
      "th-TH",
      {
        maximumFractionDigits:6
      }
    );

}


function editTx(id){

  const tx =
    state.transactions.find(
      t => t.id === id
    );

  if(!tx){
    return;
  }


  const name =
    prompt(
      "ชื่อรายการ",
      tx.name
    );

  if(name === null){
    return;
  }


  const qty =
    prompt(
      "จำนวน",
      tx.qty
    );

  if(qty === null){
    return;
  }


  const price =
    prompt(
      "ราคาต่อหน่วย",
      tx.price
    );

  if(price === null){
    return;
  }


  const date =
    prompt(
      "วันที่ YYYY-MM-DD",
      tx.date
    );

  if(date === null){
    return;
  }


  const cover =
    prompt(
      "รูป / สัญลักษณ์ (เว้นว่างเพื่อลบ)",
      getCover(tx.name,tx.cover)
    );

  if(cover === null){
    return;
  }


  tx.name =
    name.trim() || tx.name;

  tx.qty =
    Number(qty) || 1;

  tx.price =
    Number(price) || 0;

  tx.date =
    date || tx.date;

  tx.cover =
    cover.trim();


  if(tx.cover){

    state.covers[
      normName(tx.name)
    ] = tx.cover;

  }else{

    delete state.covers[
      normName(tx.name)
    ];

  }


  saveState();

  renderAll();

}


function deleteTx(id){

  if(!confirm("ลบรายการนี้หรือไม่?")){
    return;
  }

  state.transactions =
    state.transactions.filter(
      t => t.id !== id
    );

  saveState();

  renderAll();

}


/* =========================================================
   SUMMARY
   ⭐ ส่วนที่ปรับตามภาพ
========================================================= */

function setSummaryPeriod(period){

  summaryPeriod = period;

  document
    .querySelectorAll(".period-btn")
    .forEach(btn => {

      btn.classList.toggle(
        "active",
        btn.dataset.period === period
      );

    });


  renderSummaryInputs();

  renderSummary();

}


function setSummaryMode(mode){

  summaryMode = mode;

  document
    .getElementById("detailModeBtn")
    .classList.toggle(
      "active",
      mode === "detail"
    );

  document
    .getElementById("numberModeBtn")
    .classList.toggle(
      "active",
      mode === "number"
    );


  renderSummary();

}


/* ---------- Inputs ---------- */

function renderSummaryInputs(){

  const box =
    document.getElementById(
      "summaryInputs"
    );


  if(summaryPeriod === "day"){

    box.innerHTML = `
      <input
        id="summaryDate"
        type="date"
        value="${summarySelectedDate}"
        onchange="summaryInputChanged()">
    `;

    return;

  }


  if(summaryPeriod === "week"){

    box.innerHTML = `
      <input
        id="summaryWeekDate"
        type="date"
        value="${summarySelectedDate}"
        onchange="summaryInputChanged()">
    `;

    return;

  }


  if(summaryPeriod === "month"){

    box.innerHTML = `

      <select
        id="summaryMonth"
        onchange="summaryInputChanged()">

        ${monthOptions()}

      </select>


      <select
        id="summaryMonthYear"
        onchange="summaryInputChanged()">

        ${yearOptions()}

      </select>

    `;

    return;

  }


  if(summaryPeriod === "year"){

    box.innerHTML = `

      <select
        id="summaryYear"
        onchange="summaryInputChanged()">

        ${yearOptions()}

      </select>

    `;

  }

}


/* ---------- Selected date ---------- */

let summarySelectedDate = today();


function summaryInputChanged(){

  if(summaryPeriod === "day"){

    const value =
      document.getElementById(
        "summaryDate"
      ).value;

    if(value){
      summarySelectedDate = value;
    }

  }


  if(summaryPeriod === "week"){

    const value =
      document.getElementById(
        "summaryWeekDate"
      ).value;

    if(value){
      summarySelectedDate = value;
    }

  }


  renderSummary();

}


function monthOptions(){

  const months = [
    "มกราคม",
    "กุมภาพันธ์",
    "มีนาคม",
    "เมษายน",
    "พฤษภาคม",
    "มิถุนายน",
    "กรกฎาคม",
    "สิงหาคม",
    "กันยายน",
    "ตุลาคม",
    "พฤศจิกายน",
    "ธันวาคม"
  ];


  const current =
    Number(
      summaryMonthValue()
    );


  return months
    .map(
      (name,index) =>
        `<option
          value="${index}"
          ${index === current ? "selected" : ""}>
          ${name}
        </option>`
    )
    .join("");

}


function summaryMonthValue(){

  const d =
    new Date(
      summarySelectedDate +
      "T00:00:00"
    );

  return d.getMonth();

}


function summaryYearValue(){

  const d =
    new Date(
      summarySelectedDate +
      "T00:00:00"
    );

  return d.getFullYear();

}


function yearOptions(){

  const selected =
    summaryYearValue();


  let html = "";


  for(
    let y = 2026;
    y <= 2035;
    y++
  ){

    html += `
      <option
        value="${y}"
        ${y === selected ? "selected" : ""}>
        ${y + 543}
      </option>
    `;

  }


  return html;

}


/* =========================================================
   SUMMARY DATA FILTER
========================================================= */

function txTotal(tx){

  return Number(tx.qty || 0) *
         Number(tx.price || 0);

}


function transactionIncome(txs){

  return txs
    .filter(t => t.type === "income")
    .reduce(
      (sum,t) => sum + txTotal(t),
      0
    );

}


function transactionExpense(txs){

  return txs
    .filter(t => t.type === "expense")
    .reduce(
      (sum,t) => sum + txTotal(t),
      0
    );

}


function getDayRange(date){

  return {
    start:date,
    end:date
  };

}


function getWeekRange(dateString){

  const d =
    new Date(
      dateString + "T00:00:00"
    );


  const day =
    d.getDay();


  const start =
    new Date(d);

  start.setDate(
    d.getDate() - day
  );


  const end =
    new Date(start);

  end.setDate(
    start.getDate() + 6
  );


  return {
    start:dateStringLocal(start),
    end:dateStringLocal(end)
  };

}


function dateStringLocal(d){

  const y =
    d.getFullYear();

  const m =
    String(
      d.getMonth()+1
    ).padStart(2,"0");

  const day =
    String(
      d.getDate()
    ).padStart(2,"0");


  return `${y}-${m}-${day}`;

}


/* =========================================================
   SUMMARY MAIN
========================================================= */

function renderSummary(){

  renderSummaryInputs();


  let txs = [];


  if(summaryPeriod === "day"){

    txs =
      state.transactions.filter(
        t =>
          t.date === summarySelectedDate
      );

  }


  if(summaryPeriod === "week"){

    const range =
      getWeekRange(
        summarySelectedDate
      );


    txs =
      state.transactions.filter(
        t =>
          t.date >= range.start &&
          t.date <= range.end
      );

  }


  if(summaryPeriod === "month"){

    const monthEl =
      document.getElementById(
        "summaryMonth"
      );

    const yearEl =
      document.getElementById(
        "summaryMonthYear"
      );


    let month =
      monthEl
        ? Number(monthEl.value)
        : summaryMonthValue();


    let year =
      yearEl
        ? Number(yearEl.value)
        : summaryYearValue();


    txs =
      state.transactions.filter(t => {

        if(!t.date){
          return false;
        }

        const d =
          new Date(
            t.date + "T00:00:00"
          );

        return (
          d.getFullYear() === year &&
          d.getMonth() === month
        );

      });

  }


  if(summaryPeriod === "year"){

    const yearEl =
      document.getElementById(
        "summaryYear"
      );


    const year =
      yearEl
        ? Number(yearEl.value)
        : summaryYearValue();


    txs =
      state.transactions.filter(t => {

        if(!t.date){
          return false;
        }

        return (
          Number(
            t.date.slice(0,4)
          ) === year
        );

      });

  }


  const income =
    transactionIncome(txs);


  const expense =
    transactionExpense(txs);


  const balance =
    income - expense;


  document.getElementById(
    "summaryIncome"
  ).textContent =
    moneyBaht(income);


  document.getElementById(
    "summaryExpense"
  ).textContent =
    moneyBaht(expense);


  document.getElementById(
    "summaryBalance"
  ).textContent =
    moneyBaht(balance);


  const content =
    document.getElementById(
      "summaryContent"
    );


  if(!txs.length){

    content.innerHTML =
      `<div class="empty">
        ไม่มีรายการในช่วงเวลานี้
      </div>`;

    return;

  }


  /*
    ⭐ สำคัญ

    ปี = แบ่งเป็นเดือน
    เดือน = แบ่งเป็นเดือนเดียว
    สัปดาห์ = แบ่งเป็นวัน
    วัน = แบ่งเป็นวันเดียว
  */

  if(summaryPeriod === "year"){

    renderYearSummary(
      content,
      txs
    );

    return;

  }


  if(summaryPeriod === "month"){

    renderMonthSummary(
      content,
      txs
    );

    return;

  }


  if(
    summaryPeriod === "week" ||
    summaryPeriod === "day"
  ){

    renderDaySummary(
      content,
      txs
    );

    return;

  }

}

========================================================= */

function renderYearSummary(container,txs){

  const groups = {};


  txs.forEach(tx => {

    const month =
      tx.date.slice(0,7);


    if(!groups[month]){
      groups[month] = [];
    }


    groups[month].push(tx);

  });


  const months =
    Object.keys(groups)
      .sort()
      .reverse();


  if(summaryMode === "number"){

    container.innerHTML = `

      <div class="summary-number-row">

        <div class="number-card income">

          <div class="label">
            รายรับทั้งปี
          </div>

          <div class="value">
            ${moneyBaht(
              transactionIncome(txs)
            )}
          </div>

        </div>


        <div class="number-card expense">

          <div class="label">
            รายจ่ายทั้งปี
          </div>

          <div class="value">
            ${moneyBaht(
              transactionExpense(txs)
            )}
          </div>

        </div>

      </div>

    `;

    return;

  }


  container.innerHTML = `

    <div class="summary-groups">

      ${months
        .map(
          month =>
            summaryMonthGroupHtml(
              month,
              groups[month]
            )
        )
        .join("")}

    </div>

  `;

}

/* =========================================================
   MONTH GROUP
========================================================= */

function summaryMonthGroupHtml(
  monthKey,
  txs
){

  const [year,month] =
    monthKey.split("-");


  const date =
    new Date(
      Number(year),
      Number(month)-1,
      1
    );


  const monthName =
    date.toLocaleDateString(
      "th-TH",
      {
        month:"long"
      }
    );


  const income =
    transactionIncome(txs);


  const expense =
    transactionExpense(txs);


  const groups = {};


  txs.forEach(tx => {

    if(!groups[tx.date]){
      groups[tx.date] = [];
    }

    groups[tx.date].push(tx);

  });


  const dates =
    Object.keys(groups)
      .sort()
      .reverse();


  return `

    <div class="summary-group">

      <div class="summary-group-head">

        <div class="summary-group-title">

          ${monthName}
          ${Number(year) + 543}

        </div>


        <div class="summary-group-total">

          รับ ${moneyBaht(income)}
          ·
          จ่าย ${moneyBaht(expense)}

        </div>

      </div>


      <div class="summary-items">

        ${
          dates
            .map(
              date =>
                groups[date]
                  .map(
                    tx =>
                      summaryItemHtml(
                        tx
                      )
                  )
                  .join("")
            )
            .join("")
        }

      </div>

    </div>

  `;

}

/* =========================================================
   SUMMARY ITEM
========================================================= */

function summaryItemHtml(tx){

  const total =
    txTotal(tx);


  const cover =
    getCover(tx.name,tx.cover);


  return `

    <div class="summary-item">

      <div class="summary-item-left">

        ${
          cover
            ? `<div class="summary-item-cover">
                ${escapeHtml(cover)}
              </div>`
            : ""
        }


        ${
          summaryMode === "detail"
            ? `<div class="summary-item-name">
                ${escapeHtml(tx.name)}
              </div>

              <div class="summary-item-detail">
                ${formatNumber(tx.qty)}
                ×
                ${moneyBaht(tx.price)}
              </div>`
            : ""
        }

      </div>


      <div
        class="summary-item-amount ${tx.type}">

        ${tx.type === "income" ? "+" : "−"}
        ${moneyBaht(total)}

      </div>

    </div>

  `;

}


function formatThaiDate(dateString){

  const d =
    new Date(
      dateString + "T00:00:00"
    );


  return d.toLocaleDateString(
    "th-TH",
    {
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  );

}

function renderCombined(){

  const keyword =
    document.getElementById(
      "searchCombined"
    )?.value
      .trim()
      .toLowerCase() || "";


  const txs =
    state.transactions.filter(tx => {

      if(!keyword){
        return true;
      }

      return (
        tx.name
          .toLowerCase()
          .includes(keyword) ||

        tx.note
          .toLowerCase()
          .includes(keyword)
      );

    });


  const box =
    document.getElementById(
      "combinedList"
    );


  if(!txs.length){

    box.innerHTML =
      `<div class="empty">
        ไม่พบรายการ
      </div>`;

    return;

  }


  box.innerHTML =
    txs
      .map(
        tx =>
          transactionHtml(tx)
      )
      .join("");

}


/* =========================================================
   COST : SALES
========================================================= */

function renderSales(){

  const box =
    document.getElementById(
      "salesList"
    );


  if(!state.menus.length){

    box.innerHTML =
      `<div class="empty">
        ยังไม่มีรายการขาย
      </div>`;

    return;

  }


  box.innerHTML =
    state.menus
      .map(menu => {

        const ingredients =
          Array.isArray(menu.ingredients)
            ? menu.ingredients
            : [];


        const enabled =
          ingredients.filter(
            i => i.enabled !== false
          );


        const total =
          enabled.reduce(
            (sum,i) =>
              sum +
              Number(i.qty || 0) *
              Number(i.price || 0),
            0
          );


        const cover =
          getCover(
            menu.name,
            menu.cover
          );


        return `

          <div class="sales-card">

            <div
              class="sales-left"
              onclick="openIngredients('${menu.id}')">

              <div class="sales-cover">

                ${
                  cover
                    ? escapeHtml(cover)
                    : "○"
                }

              </div>


              <div>

                <div class="sales-name">
                  ${escapeHtml(menu.name)}
                </div>

                <div class="sales-info">
                  วัตถุดิบ ${ingredients.length} รายการ
                </div>

              </div>

            </div>


            <div class="sales-right">

              <div class="sales-cost">
                รวมต้นทุน ${moneyBaht(total)}
              </div>

              <div class="sales-count">
                วัตถุดิบ ${ingredients.length} รายการ
              </div>


              <div class="sales-actions">

                <button
                  class="small-btn"
                  onclick="event.stopPropagation();editSales('${menu.id}')">
                  แก้ไข
                </button>

                <button
                  class="small-btn"
                  onclick="event.stopPropagation();duplicateSales('${menu.id}')">
                  สำเนา
                </button>

                <button
                  class="small-btn delete"
                  onclick="event.stopPropagation();deleteSales('${menu.id}')">
                  ลบ
                </button>

              </div>

            </div>

          </div>

        `;

      })
      .join("");

}

function openSalesModal(id=null){

  editingSalesId = id;


  document.getElementById(
    "salesModalTitle"
  ).textContent =
    id
      ? "แก้ไขรายการขาย"
      : "เพิ่มรายการขาย";


  if(id){

    const menu =
      state.menus.find(
        m => m.id === id
      );


    document.getElementById(
      "salesName"
    ).value =
      menu?.name || "";


    document.getElementById(
      "salesCover"
    ).value =
      getCover(
        menu?.name,
        menu?.cover
      );

  }else{

    document.getElementById(
      "salesName"
    ).value = "";


    document.getElementById(
      "salesCover"
    ).value = "";

  }


  document
    .getElementById("salesModal")
    .classList.add("show");

}


function saveSales(){

  const name =
    document.getElementById(
      "salesName"
    ).value.trim();


  const cover =
    document.getElementById(
      "salesCover"
    ).value.trim();


  if(!name){

    alert("กรุณาใส่ชื่อรายการขาย");

    return;

  }


  if(editingSalesId){

    const menu =
      state.menus.find(
        m => m.id === editingSalesId
      );


    if(menu){

      menu.name = name;

      menu.cover = cover;


      if(cover){

        state.covers[
          normName(name)
        ] = cover;

      }else{

        delete state.covers[
          normName(name)
        ];

      }

    }

  }else{

    const menu = {

      id:uid(),

      name:name,

      cover:cover,

      ingredients:[]

    };


    state.menus.push(menu);


    if(cover){

      state.covers[
        normName(name)
      ] = cover;

    }

  }


  saveState();

  closeModal("salesModal");

  renderSales();

}


function editSales(id){

  openSalesModal(id);

}


function duplicateSales(id){

  const original =
    state.menus.find(
      m => m.id === id
    );


  if(!original){
    return;
  }


  const copy = {

    id:uid(),

    name:
      original.name +
      " (สำเนา)",

    cover:
      original.cover || "",

    ingredients:
      (original.ingredients || [])
        .map(i => ({

          ...i,

          id:uid()

        }))

  };


  state.menus.push(copy);

  saveState();

  renderSales();

}


function deleteSales(id){

  if(!confirm(
    "ลบรายการขายนี้หรือไม่?"
  )){
    return;
  }


  state.menus =
    state.menus.filter(
      m => m.id !== id
    );


  saveState();

  renderSales();

}

function openIngredients(menuId){

  selectedIngredientMenuId =
    menuId;


  document
    .querySelectorAll(".page")
    .forEach(p =>
      p.classList.remove("active")
    );


  document
    .getElementById(
      "page-ingredients"
    )
    .classList.add("active");


  document
    .querySelectorAll(".nav-btn")
    .forEach(btn =>
      btn.classList.remove("active")
    );


  document
    .querySelector(
      '.nav-btn[data-page="cost"]'
    )
    .classList.add("active");


  renderIngredients();

}


function backToCost(){

  selectedIngredientMenuId =
    null;

  showPage("cost");

}


/* =========================================================
   INGREDIENT RENDER
========================================================= */

function renderIngredients(){

  const menu =
    state.menus.find(
      m =>
        m.id ===
        selectedIngredientMenuId
    );


  if(!menu){

    backToCost();

    return;

  }


  if(!Array.isArray(menu.ingredients)){

    menu.ingredients = [];

    saveState();

  }


  const cover =
    getCover(
      menu.name,
      menu.cover
    );


  document.getElementById(
    "ingredientSalesCover"
  ).textContent =
    cover || "○";


  document.getElementById(
    "ingredientSalesName"
  ).textContent =
    menu.name;


  const total =
    menu.ingredients
      .filter(
        i => i.enabled !== false
      )
      .reduce(
        (sum,i) =>
          sum +
          Number(i.qty || 0) *
          Number(i.price || 0),
        0
      );


  document.getElementById(
    "ingredientSalesCost"
  ).textContent =
    "รวมต้นทุน " +
    moneyBaht(total);


  const box =
    document.getElementById(
      "ingredientList"
    );


  if(!menu.ingredients.length){

    box.innerHTML =
      `<div class="empty">
        ยังไม่มีวัตถุดิบ
      </div>`;

    return;

  }


  box.innerHTML =
    menu.ingredients
      .map(
        (ing,index) =>
          ingredientHtml(
            menu,
            ing,
            index
          )
      )
      .join("");

}


function ingredientHtml(
  menu,
  ing,
  index
){

  const total =
    Number(ing.qty || 0) *
    Number(ing.price || 0);


  const cover =
    getCover(
      ing.name,
      ing.cover
    );


  const isOn =
    ing.enabled !== false;


  return `

    <div class="ingredient-row">

      <div class="ingredient-inner">


        <div class="ingredient-left">

          <div
            class="ingredient-cover">

            ${
              cover
                ? escapeHtml(cover)
                : "○"
            }

          </div>


          <div class="ingredient-name">

            ${escapeHtml(ing.name)}

          </div>


          <div class="ingredient-equation">

            ${formatNumber(ing.qty)}
            ×
            ${moneyBaht(ing.price)}
            =
            ${moneyBaht(total)}

          </div>

        </div>


        <div class="ingredient-tools">

          <button
            class="arrow-btn"
            title="เลื่อนขึ้น"
            onclick="moveIngredient('${menu.id}',${index},-1)">
            ↑
          </button>


          <button
            class="arrow-btn"
            title="เลื่อนลง"
            onclick="moveIngredient('${menu.id}',${index},1)">
            ↓
          </button>


          <button
            class="detail-btn"
            onclick="editIngredient('${menu.id}','${ing.id}')">
            รายละเอียด
          </button>


          <button
            class="delete-ing-btn"
            onclick="deleteIngredient('${menu.id}','${ing.id}')">
            🗑
          </button>


          <button
            class="switch ${isOn ? "on" : ""}"
            onclick="toggleIngredient('${menu.id}','${ing.id}')"
            aria-label="เปิดปิด">
          </button>


          <div class="qty-mini">

            <button
              class="qty-btn"
              onclick="changeIngredientInline('${menu.id}','${ing.id}',-1)">
              −
            </button>


            <input
              class="qty-number"
              type="number"
              min="0.01"
              step="any"
              value="${ing.qty}"
              onchange="setIngredientQty('${menu.id}','${ing.id}',this.value)">


            <button
              class="qty-btn"
              onclick="changeIngredientInline('${menu.id}','${ing.id}',1)">
              ＋
            </button>

          </div>

        </div>

      </div>

    </div>

  `;

}

      String(
        ing.enabled !== false
      );


    updateIngredientTotal();

  }else{

    document.getElementById(
      "ingredientName"
    ).value = "";


    document.getElementById(
      "ingredientCover"
    ).value = "";


    document.getElementById(
      "ingredientQty"
    ).value = "1";


    document.getElementById(
      "ingredientPrice"
    ).value = "";


    document.getElementById(
      "ingredientEnabled"
    ).value = "true";


    updateIngredientTotal();

  }


  document
    .getElementById(
      "ingredientModal"
    )
    .classList.add("show");

}


function updateIngredientTotal(){

  const qty =
    Number(
      document.getElementById(
        "ingredientQty"
      ).value
    ) || 0;


  const price =
    Number(
      document.getElementById(
        "ingredientPrice"
      ).value
    ) || 0;


  document.getElementById(
    "ingredientTotal"
  ).value =
    moneyBaht(
      qty * price
    );

}


document.addEventListener(
  "input",
  e => {

    if(
      e.target.id ===
        "ingredientQty" ||
      e.target.id ===
        "ingredientPrice"
    ){

      updateIngredientTotal();

    }

  }
);


function changeIngredientQty(delta){

  const input =
    document.getElementById(
      "ingredientQty"
    );


  let value =
    Number(input.value) || 0;


  value += delta;


  if(value < 0.01){
    value = 0.01;
  }


  input.value = value;

  updateIngredientTotal();

}


function saveIngredient(){

  const menu =
    state.menus.find(
      m =>
        m.id ===
        selectedIngredientMenuId
    );


  if(!menu){
    return;
  }


  if(!Array.isArray(menu.ingredients)){
    menu.ingredients = [];
  }


  const name =
    document.getElementById(
      "ingredientName"
    ).value.trim();


  const cover =
    document.getElementById(
      "ingredientCover"
    ).value.trim();


  const qty =
    Number(
      document.getElementById(
        "ingredientQty"
      ).value
    );


  const price =
    Number(
      document.getElementById(
        "ingredientPrice"
      ).value
    );


  const enabled =
    document.getElementById(
      "ingredientEnabled"
    ).value === "true";


  if(!name){

    alert("กรุณาใส่ชื่อวัตถุดิบ");

    return;

  }


  if(!qty || qty <= 0){

    alert("กรุณาใส่จำนวนซื้อ");

    return;

  }


  if(price < 0 || Number.isNaN(price)){

    alert("กรุณาใส่ราคาซื้อ");

    return;

  }


  if(editingIngredientId){

    const ing =
      menu.ingredients.find(
        i =>
          i.id ===
          editingIngredientId
      );


    if(ing){

      ing.name = name;

      ing.cover = cover;

      ing.qty = qty;

      ing.price = price;

      ing.enabled = enabled;

    }

  }else{

    menu.ingredients.push({

      id:uid(),

      name:name,

      cover:cover,

      qty:qty,

      price:price,

      enabled:enabled

    });

  }


  if(cover){

    state.covers[
      normName(name)
    ] = cover;

  }else{

    delete state.covers[
      normName(name)
    ];

  }


  saveState();

  closeModal(
    "ingredientModal"
  );

  renderIngredients();

}


/* =========================================================
   INGREDIENT EDIT
========================================================= */

function editIngredient(
  menuId,
  ingredientId
){

  selectedIngredientMenuId =
    menuId;

  openIngredientModal(
    ingredientId
  );

}


/* =========================================================
   INGREDIENT DELETE
========================================================= */

function deleteIngredient(
  menuId,
  ingredientId
){

  const menu =
    state.menus.find(
      m => m.id === menuId
    );


  if(!menu){
    return;
  }


  if(!confirm(
    "ลบวัตถุดิบนี้หรือไม่?"
  )){
    return;
  }


  menu.ingredients =
    menu.ingredients.filter(
      i =>
        i.id !== ingredientId
    );


  saveState();

  renderIngredients();

}


/* =========================================================
   INGREDIENT MOVE
========================================================= */

function moveIngredient(
  menuId,
  index,
  direction
){

  const menu =
    state.menus.find(
      m => m.id === menuId
    );


  if(!menu){
    return;
  }


  const newIndex =
    index + direction;


  if(
    newIndex < 0 ||
    newIndex >= menu.ingredients.length
  ){

    return;

  }


  const temp =
    menu.ingredients[index];


  menu.ingredients[index] =
    menu.ingredients[newIndex];


  menu.ingredients[newIndex] =
    temp;


  saveState();

  renderIngredients();

}


/* =========================================================
   INGREDIENT TOGGLE
========================================================= */

function toggleIngredient(
  menuId,
  ingredientId
){

  const menu =
    state.menus.find(
      m => m.id === menuId
    );


  const ing =
    menu?.ingredients?.find(
      i => i.id === ingredientId
    );


  if(!ing){
    return;
  }


  ing.enabled =
    ing.enabled === false;


  saveState();

  renderIngredients();

}


/* =========================================================
   INLINE QUANTITY
========================================================= */

function changeIngredientInline(
  menuId,
  ingredientId,
  delta
){

  const menu =
    state.menus.find(
      m => m.id === menuId
    );


  const ing =
    menu?.ingredients?.find(
      i => i.id === ingredientId
    );


  if(!ing){
    return;
  }


  let value =
    Number(ing.qty) || 0;


  value += delta;


  if(value < 0.01){
    value = 0.01;
  }


  ing.qty = value;


  saveState();

  renderIngredients();

}


function setIngredientQty(
  menuId,
  ingredientId,
  value
){

  const menu =
    state.menus.find(
      m => m.id === menuId
    );


  const ing =
    menu?.ingredients?.find(
      i => i.id === ingredientId
    );


  if(!ing){
    return;
  }


  let number =
    Number(value);


  if(!number || number < 0.01){
    number = 0.01;
  }


  ing.qty = number;


  saveState();

  renderIngredients();

}


/* =========================================================
   MODAL
========================================================= */

function closeModal(id){

  document
    .getElementById(id)
    .classList.remove("show");

}


/* =========================================================
   RENDER ALL
========================================================= */

function renderAll(){

  renderAccount();

  renderSummary();

  renderCombined();

  renderSales();


  if(
    selectedIngredientMenuId
  ){

    renderIngredients();

  }

}


/* =========================================================
   INIT
========================================================= */

loadState();


document.getElementById(
  "txDate"
).value = today();


renderAccount();

renderSummary();

renderCombined();

renderSales();

</script>
