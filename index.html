<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">

<title>สมุดบัญชี</title>

<style>
:root{
  --bg:#fff7fb;
  --card:#fff;
  --ink:#29252b;
  --muted:#9b969b;
  --line:#eee6eb;
  --pink:#f9e3ee;
  --pink2:#fff0f6;
  --green:#55a879;
  --red:#df7180;
  --blue:#3188e8;
  --shadow:0 10px 28px rgba(91,65,80,.08);
  --radius:22px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--ink);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Thai",
    "Noto Sans",
    Arial,
    sans-serif;
}

body{
  min-height:100vh;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:1100px;
  margin:0 auto;
  padding:0 16px 40px;
}

/* =====================================================
   NAV
===================================================== */

.nav{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(14px);
  border-radius:0 0 26px 26px;
  box-shadow:0 8px 25px rgba(80,60,70,.06);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:9px;
  margin-bottom:12px;
}

.nav button{
  border:0;
  background:transparent;
  min-height:78px;
  border-radius:20px;
  color:#777;
  font-size:14px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:5px;
}

.nav button .nav-icon{
  font-size:27px;
  line-height:1;
}

.nav button.active{
  background:#f8dfeb;
  color:#ce6e9a;
  font-weight:700;
}

/* =====================================================
   COMMON
===================================================== */

.page{
  display:none;
}

.page.active{
  display:block;
}

.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
  margin-bottom:16px;
}

.page-title{
  font-size:28px;
  font-weight:800;
  margin:8px 8px 14px;
}

.sub-title{
  color:var(--muted);
  font-size:14px;
}

.empty{
  text-align:center;
  color:#aaa;
  padding:45px 20px;
}

.primary-btn{
  border:0;
  background:#f8dfeb;
  color:#bd638e;
  padding:11px 17px;
  border-radius:14px;
  font-weight:700;
}

.primary-btn:active{
  transform:scale(.98);
}

.small-btn{
  border:1px solid #eadfe5;
  background:#fff;
  color:#3188e8;
  border-radius:10px;
  padding:5px 9px;
  font-size:12px;
}

.delete-btn{
  border:0;
  background:#fff0f3;
  color:#d96d7a;
  border-radius:50%;
  width:31px;
  height:31px;
  padding:0;
  font-size:12px;
}

.edit-btn{
  border:1px solid #eadfe5;
  background:#fff;
  color:#3188e8;
  border-radius:10px;
  padding:5px 9px;
  font-size:12px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.section-head h2{
  margin:0;
  font-size:23px;
}

/* =====================================================
   ACCOUNT
===================================================== */

.account-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:0 8px 8px;
}

.account-title-wrap{
  display:flex;
  align-items:center;
  gap:6px;
  min-width:0;
}

.account-title{
  margin:0;
  font-size:28px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.title-edit{
  border:0;
  background:transparent;
  color:#c46b94;
  font-size:12px;
  padding:5px;
  flex-shrink:0;
}

.account-summary{
  background:#fff;
  border-radius:20px;
  box-shadow:var(--shadow);
  padding:14px 17px;
  margin-bottom:12px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.account-summary-box{
  text-align:center;
}

.account-summary-label{
  color:#aaa;
  font-size:12px;
  margin-bottom:3px;
}

.account-summary-value{
  font-size:18px;
  font-weight:800;
}

.account-summary-value.balance{
  color:#bc6b91;
}

.account-summary-value.income{
  color:var(--green);
}

.account-summary-value.expense{
  color:var(--red);
}

.account-list{
  background:#fff;
  border-radius:25px;
  box-shadow:var(--shadow);
  padding:8px 22px;
  overflow:hidden;
}

.account-row{
  display:grid;
  grid-template-columns:58px minmax(0,1fr) 115px;
  gap:10px;
  align-items:center;
  min-height:92px;
  border-bottom:1px solid var(--line);
}

.account-row:last-child{
  border-bottom:0;
}

.type-symbol{
  width:56px;
  height:56px;
  border-radius:18px;
  background:#fff0f6;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:31px;
  color:#29252b;
  flex-shrink:0;
}

.account-main{
  min-width:0;
}

.account-name-line{
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0;
}

.account-cover{
  font-size:20px;
  width:25px;
  flex-shrink:0;
}

.account-name{
  font-size:17px;
  font-weight:700;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.account-equation{
  margin-top:4px;
  color:#aaa;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.account-right{
  text-align:right;
  min-width:0;
}

.account-money{
  font-size:19px;
  font-weight:800;
  white-space:nowrap;
}

.account-money.income{
  color:var(--green);
}

.account-money.expense{
  color:var(--red);
}

.account-actions{
  display:flex;
  justify-content:flex-end;
  gap:5px;
  margin-top:5px;
}

.account-add{
  margin:12px 0 8px;
  display:flex;
  justify-content:center;
}

.account-add button{
  border:0;
  background:#f9e3ee;
  color:#bd638e;
  border-radius:15px;
  padding:10px 20px;
  font-weight:700;
}

/* =====================================================
   SUMMARY
===================================================== */

.summary-card{
  background:#fff;
  border-radius:25px;
  box-shadow:var(--shadow);
  padding:18px;
}

.period-tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-bottom:15px;
}

.period-tabs button{
  border:0;
  background:#f7f4f6;
  color:#888;
  border-radius:13px;
  padding:10px 5px;
}

.period-tabs button.active{
  background:#f7dfeb;
  color:#bd638e;
  font-weight:700;
}

.period-controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.period-controls input,
.period-controls select,
.search-input{
  border:1px solid #e9e1e6;
  background:#fff;
  border-radius:12px;
  padding:10px 11px;
  color:#444;
  min-width:0;
}

.mode-toggle{
  display:flex;
  gap:6px;
  margin-bottom:15px;
}

.mode-toggle button{
  border:1px solid #eadfe5;
  background:#fff;
  color:#888;
  border-radius:11px;
  padding:7px 11px;
  font-size:13px;
}

.mode-toggle button.active{
  background:#f9e3ee;
  color:#bd638e;
  border-color:#f1d4e2;
}

.summary-total{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:15px;
}

.summary-total-box{
  background:#fff8fb;
  border-radius:16px;
  padding:13px 7px;
  text-align:center;
}

.summary-total-box .label{
  color:#999;
  font-size:12px;
}

.summary-total-box .value{
  font-size:18px;
  font-weight:800;
  margin-top:3px;
}

.summary-total-box.balance .value{
  color:#bd6c93;
}

.summary-total-box.income .value{
  color:var(--green);
}

.summary-total-box.expense .value{
  color:var(--red);
}

.summary-list{
  border-top:1px solid var(--line);
}

.summary-item{
  padding:12px 3px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.summary-item:last-child{
  border-bottom:0;
}

.summary-item-left{
  min-width:0;
}

.summary-item-name{
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.summary-item-detail{
  color:#aaa;
  font-size:13px;
  margin-top:3px;
}

.summary-item-money{
  font-weight:800;
  white-space:nowrap;
}

.summary-item-money.income{
  color:var(--green);
}

.summary-item-money.expense{
  color:var(--red);
}

/* =====================================================
   ALL RECORDS
===================================================== */

.search-box{
  background:#fff;
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:12px;
  margin-bottom:12px;
}

.search-input{
  width:100%;
  outline:none;
}

.all-list{
  background:#fff;
  border-radius:25px;
  box-shadow:var(--shadow);
  padding:8px 18px;
}

/* =====================================================
   COST - MENU LIST
===================================================== */

.cost-page{
  padding-bottom:20px;
}

.menu-card{
  background:#fff;
  border-radius:23px;
  box-shadow:var(--shadow);
  margin-bottom:12px;
  padding:16px;
}

.menu-card-main{
  display:grid;
  grid-template-columns:minmax(0,1fr) 155px;
  gap:15px;
  align-items:center;
}

.menu-left{
  min-width:0;
}

.menu-title-line{
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
}

.menu-cover{
  font-size:30px;
  width:40px;
  text-align:center;
  flex-shrink:0;
}

.menu-name{
  font-size:23px;
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.menu-sub{
  margin-top:8px;
  color:#999;
  font-size:13px;
}

.menu-right{
  text-align:right;
}

.menu-cost{
  color:#bd6c93;
  font-size:19px;
  font-weight:800;
  white-space:nowrap;
}

.menu-count{
  color:#aaa;
  font-size:12px;
  margin-top:3px;
}

.menu-actions{
  display:flex;
  justify-content:flex-end;
  gap:5px;
  margin-top:7px;
}

.menu-actions button{
  font-size:11px;
  padding:5px 8px;
}

/* =====================================================
   COST - INGREDIENT PAGE
   ปรับตามภาพที่ผู้ใช้ส่งมา
===================================================== */

.ingredient-page-wrap{
  width:100%;
}

.back-btn{
  border:0;
  background:#fff;
  color:#bd638e;
  border-radius:12px;
  padding:8px 12px;
  box-shadow:0 4px 14px rgba(70,50,60,.06);
}

.ingredient-header{
  display:flex;
  align-items:center;
  gap:10px;
  margin:8px 0 13px;
}

.ingredient-header h2{
  margin:0;
  font-size:25px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.ingredient-menu-editor{
  background:#f9e6ef;
  border-radius:25px;
  padding:18px 22px;
  margin-bottom:18px;
  display:flex;
  align-items:center;
  gap:14px;
}

.ingredient-menu-cover{
  width:72px;
  height:72px;
  border-radius:20px;
  background:#fff5f8;
  border:1px solid #f1dce6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  flex-shrink:0;
}

.ingredient-menu-info{
  flex:1;
  min-width:0;
}

.ingredient-menu-label{
  font-size:13px;
  color:#a49aa0;
  margin-bottom:5px;
}

.ingredient-menu-name{
  width:100%;
  background:#fff;
  border:1px solid #eadfe5;
  border-radius:16px;
  padding:11px 14px;
  font-size:24px;
  font-weight:800;
  outline:none;
}

.ingredient-section-card{
  background:#fff;
  border-radius:25px;
  box-shadow:var(--shadow);
  padding:20px 22px;
}

.ingredient-section-title{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:4px;
}

.ingredient-section-title h3{
  margin:0;
  font-size:24px;
}

.ingredient-section-note{
  color:#a29ba0;
  font-size:14px;
  margin:0 0 18px;
}

.add-ingredient-wrap{
  margin-bottom:12px;
}

.add-ingredient-btn{
  width:100%;
  border:0;
  background:#f8dfeb;
  color:#bd638e;
  border-radius:16px;
  padding:12px;
  font-weight:800;
}

/* ===== ROW แบบในภาพ ===== */

.ingredients-card{
  background:#fff;
  border-radius:24px;
  padding:0;
}

.ingredient-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:12px;
  align-items:center;

  min-height:88px;

  border:1px solid #eee1e8;
  border-radius:22px;

  padding:10px 14px;
  margin-bottom:10px;

  background:#fff;
}

.ingredient-row:last-child{
  margin-bottom:0;
}

.ingredient-left{
  min-width:0;
  display:flex;
  align-items:center;
  gap:12px;
}

/*
  ซ้ายสุด:
  - ถ้ามี cover → แสดง cover
  - ถ้าไม่มี cover → แสดงจำนวนซื้อ
*/

.ingredient-badge{
  width:56px;
  height:56px;
  border-radius:18px;
  background:#fff0f6;
  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:29px;
  color:#29252b;
}

.ingredient-badge.number{
  font-size:29px;
  font-weight:400;
}

.ingredient-info{
  min-width:0;
}

.ingredient-name-line{
  display:flex;
  align-items:center;
  min-width:0;
}

.ingredient-name{
  font-size:21px;
  font-weight:800;
  line-height:1.15;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.ingredient-equation{
  color:#aaa;
  font-size:14px;
  margin-top:4px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ===== ปุ่มด้านขวาอยู่แถวเดียว ===== */

.ingredient-right{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:5px;
  white-space:nowrap;
}

/* ลูกศรขึ้นลง */

.order-btn{
  width:35px;
  height:35px;

  padding:0;

  border:0;
  border-radius:11px;

  background:#f8f0f5;
  color:#168fe8;

  font-size:20px;

  display:inline-flex;
  align-items:center;
  justify-content:center;
}

.order-btn:active{
  transform:scale(.94);
}

/* รายละเอียด */

.detail-btn{
  height:35px;

  border:0;
  border-radius:11px;

  background:#f8f0f5;
  color:#8e878c;

  padding:0 12px;

  font-size:13px;
}

/* ถังขยะ */

.ingredient-delete{
  width:35px;
  height:35px;

  border:0;
  border-radius:11px;

  background:#fff0f4;
  color:#555;

  font-size:16px;

  display:inline-flex;
  align-items:center;
  justify-content:center;
}

/* switch */

.switch{
  position:relative;
  width:52px;
  height:32px;
  flex-shrink:0;
}

.switch input{
  opacity:0;
  width:0;
  height:0;
}

.slider{
  position:absolute;
  inset:0;

  background:#ddd;

  border-radius:30px;

  transition:.2s;
}

.slider:before{
  content:"";

  position:absolute;

  width:24px;
  height:24px;

  left:4px;
  top:4px;

  background:#fff;

  border-radius:50%;

  transition:.2s;

  box-shadow:0 1px 4px rgba(0,0,0,.15);
}

.switch input:checked + .slider{
  background:#68b48a;
}

.switch input:checked + .slider:before{
  transform:translateX(20px);
}

/* quantity controls */

.qty-control{
  display:flex;
  align-items:center;
  gap:5px;
}

.qty-btn{
  width:35px;
  height:35px;

  border:0;
  border-radius:11px;

  background:#f8f0f5;
  color:#168fe8;

  font-size:20px;

  padding:0;

  display:inline-flex;
  align-items:center;
  justify-content:center;
}

.qty-btn:active{
  transform:scale(.94);
}

.qty-input{
  width:44px;
  height:35px;

  border:0;
  background:#f8f0f5;

  border-radius:10px;

  text-align:center;

  font-size:15px;

  outline:none;
}

/* =====================================================
   MODAL
===================================================== */

.modal-backdrop{
  display:none;

  position:fixed;
  inset:0;

  z-index:100;

  background:rgba(40,30,36,.35);

  backdrop-filter:blur(4px);

  padding:18px;

  align-items:flex-end;
  justify-content:center;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:560px;

  max-height:90vh;

  overflow:auto;

  background:#fff;

  border-radius:26px 26px 20px 20px;

  padding:20px;

  box-shadow:0 20px 60px rgba(40,25,35,.2);
}

.modal h3{
  margin:0 0 15px;
  font-size:22px;
}

.form-group{
  margin-bottom:12px;
}

.form-group label{
  display:block;

  font-size:13px;

  color:#777;

  margin-bottom:5px;
}

.form-group input,
.form-group select{
  width:100%;

  border:1px solid #e8dfe5;

  border-radius:12px;

  padding:11px;

  background:#fff;

  outline:none;
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:17px;
}

.modal-actions button{
  flex:1;

  border:0;

  border-radius:13px;

  padding:11px;
}

.cancel-btn{
  background:#f4f1f3;
  color:#777;
}

.save-btn{
  background:#f7dce9;
  color:#b95f89;
  font-weight:800;
}

.modal-qty{
  display:flex;
  align-items:center;
  gap:8px;
}

.modal-qty button{
  width:38px;
  height:38px;

  border:0;

  border-radius:11px;

  background:#fff0f6;
}

.modal-qty input{
  flex:1;
  text-align:center;
}

.cover-preview{
  display:flex;
  align-items:center;
  gap:8px;
}

.cover-preview span{
  font-size:27px;
  width:40px;
  text-align:center;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:900px){

  .ingredient-right{
    gap:4px;
  }

  .order-btn,
  .qty-btn,
  .ingredient-delete{
    width:33px;
    height:33px;
  }

  .detail-btn{
    height:33px;
    padding:0 9px;
  }

  .switch{
    width:48px;
    height:29px;
  }

  .slider:before{
    width:21px;
    height:21px;
  }

  .switch input:checked + .slider:before{
    transform:translateX(19px);
  }

  .qty-input{
    width:40px;
    height:33px;
  }

}

@media(max-width:700px){

  .app{
    padding-left:12px;
    padding-right:12px;
  }

  .nav{
    margin-left:-12px;
    margin-right:-12px;
    border-radius:0 0 24px 24px;
  }

  .account-list{
    padding-left:15px;
    padding-right:15px;
  }

  .account-row{
    grid-template-columns:58px minmax(0,1fr) 103px;
    gap:7px;
  }

  .account-money{
    font-size:17px;
  }

  .account-name{
    font-size:16px;
  }

  .account-equation{
    font-size:13px;
  }

  .menu-card-main{

<script>

/* =====================================================
   STORAGE
===================================================== */

const STORAGE_KEY =
  "myAccountBook_v7";

const OLD_TX_KEY =
  "myAccountTransactions_v5";

const OLD_MENU_KEY =
  "myAccountMenus_v5";

const OLD_TITLE_KEY =
  "myAccountTitle_v1";


let state = {

  title:"สมุดบัญชี",

  accounts:[],

  menus:[],

  covers:{}

};


let currentAccountEditId = null;

let currentMenuEditId = null;

let currentIngredientEditId = null;

let currentIngredientMenuId = null;


let summaryPeriod = "day";

let summaryMode = "detail";

let summaryDate = todayString();


/* =====================================================
   HELPERS
===================================================== */

function uid(prefix="id"){

  return prefix +
    "_" +
    Date.now().toString(36) +
    "_" +
    Math.random()
      .toString(36)
      .slice(2,8);

}


function todayString(){

  const d = new Date();

  const y = d.getFullYear();

  const m =
    String(d.getMonth()+1)
      .padStart(2,"0");

  const day =
    String(d.getDate())
      .padStart(2,"0");

  return `${y}-${m}-${day}`;

}


function money(n){

  return "฿" +
    Number(n || 0)
      .toLocaleString("th-TH",{
        minimumFractionDigits:2,
        maximumFractionDigits:2
      });

}


function num(v){

  const n = Number(v);

  return Number.isFinite(n)
    ? n
    : 0;

}


function esc(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


function normalizeName(name){

  return String(name || "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g," ");

}


function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );

}


function safeDate(date){

  return date || todayString();

}


/* =====================================================
   LOAD
===================================================== */

function loadData(){

  try{

    const saved =
      localStorage.getItem(STORAGE_KEY);

    if(saved){

      const parsed =
        JSON.parse(saved);

      state = {

        title:
          parsed.title ||
          "สมุดบัญชี",

        accounts:
          Array.isArray(parsed.accounts)
            ? parsed.accounts
            : [],

        menus:
          Array.isArray(parsed.menus)
            ? parsed.menus
            : [],

        covers:
          parsed.covers || {}

      };

    }

  }catch(e){

    console.warn(e);

  }


  migrateOldData();

  normalizeState();

  saveData();

  renderAll();

}


/* =====================================================
   MIGRATE OLD DATA
===================================================== */

function migrateOldData(){

  /* TITLE */

  if(
    !state.title ||
    state.title === "สมุดบัญชี"
  ){

    const oldTitle =
      localStorage.getItem(
        OLD_TITLE_KEY
      );

    if(oldTitle){

      try{

        state.title =
          JSON.parse(oldTitle) ||
          oldTitle;

      }catch(e){

        state.title = oldTitle;

      }

    }

  }


  /* ACCOUNT */

  if(state.accounts.length === 0){

    try{

      const old =
        localStorage.getItem(
          OLD_TX_KEY
        );

      if(old){

        const arr =
          JSON.parse(old);

        if(Array.isArray(arr)){

          state.accounts =
            arr.map(x => {

              const type =
                x.type === "expense" ||
                x.type === "รายจ่าย"
                  ? "expense"
                  : "income";


              const qty =
                x.qty != null
                  ? num(x.qty)
                  : x.quantity != null
                    ? num(x.quantity)
                    : 1;


              const price =
                x.price != null
                  ? num(x.price)
                  : x.amount != null
                    ? num(x.amount)
                    : x.total != null
                      ? num(x.total)
                      : 0;


              return {

                id:
                  x.id ||
                  uid("tx"),

                type,

                name:
                  x.name ||
                  x.item ||
                  x.description ||
                  "รายการ",

                cover:
                  x.cover ||
                  x.emoji ||
                  "",

                qty:
                  qty || 1,

                price,

                date:
                  safeDate(x.date),

                note:
                  x.note || ""

              };

            });

        }

      }

    }catch(e){

      console.warn(e);

    }

  }


  /* MENUS */

  if(state.menus.length === 0){

    try{

      const old =
        localStorage.getItem(
          OLD_MENU_KEY
        );

      if(old){

        const arr =
          JSON.parse(old);

        if(Array.isArray(arr)){

          state.menus =
            arr.map(menu => {

              const ingredients =
                Array.isArray(menu.ingredients)
                  ? menu.ingredients
                  : [];


              return {

                id:
                  menu.id ||
                  uid("menu"),

                name:
                  menu.name ||
                  "รายการขาย",

                cover:
                  menu.cover ||
                  menu.emoji ||
                  "",

                ingredients:
                  ingredients.map(i => ({

                    id:
                      i.id ||
                      uid("ing"),

                    name:
                      i.name ||
                      "วัตถุดิบ",

                    cover:
                      i.cover ||
                      i.emoji ||
                      "",

                    qty:
                      i.qty != null
                        ? num(i.qty)
                        : i.purchaseQty != null
                          ? num(i.purchaseQty)
                          : 1,

                    price:
                      i.price != null
                        ? num(i.price)
                        : i.purchasePrice != null
                          ? num(i.purchasePrice)
                          : 0,

                    enabled:
                      i.enabled !== false

                  }))

              };

            });

        }

      }

    }catch(e){

      console.warn(e);

    }

  }

}


/* =====================================================
   NORMALIZE
===================================================== */

function normalizeState(){

  if(!Array.isArray(state.accounts)){
    state.accounts = [];
  }

  if(!Array.isArray(state.menus)){
    state.menus = [];
  }

  if(!state.covers){
    state.covers = {};
  }


  state.accounts =
    state.accounts.map(tx => ({

      id:
        tx.id ||
        uid("tx"),

      type:
        tx.type === "expense"
          ? "expense"
          : "income",

      name:
        tx.name ||
        tx.item ||
        "รายการ",

      cover:
        tx.cover ||
        "",

      qty:
        num(
          tx.qty != null
            ? tx.qty
            : 1
        ) || 1,

      price:
        num(tx.price),

      date:
        safeDate(tx.date),

      note:
        tx.note || ""

    }));


  state.menus =
    state.menus.map(menu => {

      if(!Array.isArray(menu.ingredients)){
        menu.ingredients = [];
      }


      menu.ingredients =
        menu.ingredients.map(i => ({

          id:
            i.id ||
            uid("ing"),

          name:
            i.name ||
            "วัตถุดิบ",

          cover:
            i.cover ||
            "",

          qty:
            num(
              i.qty != null
                ? i.qty
                : 1
            ) || 1,

          price:
            num(i.price),

          enabled:
            i.enabled !== false

        }));


      return {

        id:
          menu.id ||
          uid("menu"),

        name:
          menu.name ||
          "รายการขาย",

        cover:
          menu.cover ||
          "",

        ingredients:
          menu.ingredients

      };

    });


  /* shared cover */

  state.accounts.forEach(tx => {

    const key =
      normalizeName(tx.name);

    if(tx.cover){
      state.covers[key] =
        tx.cover;
    }

  });


  state.menus.forEach(menu => {

    const key =
      normalizeName(menu.name);

    if(menu.cover){
      state.covers[key] =
        menu.cover;
    }


    menu.ingredients.forEach(i => {

      const ikey =
        normalizeName(i.name);

      if(i.cover){
        state.covers[ikey] =
          i.cover;
      }

    });

  });


  /* apply */

  state.accounts.forEach(tx => {

    if(!tx.cover){

      tx.cover =
        state.covers[
          normalizeName(tx.name)
        ] || "";

    }

  });


  state.menus.forEach(menu => {

    if(!menu.cover){

      menu.cover =
        state.covers[
          normalizeName(menu.name)
        ] || "";

    }


    menu.ingredients.forEach(i => {

      if(!i.cover){

        i.cover =
          state.covers[
            normalizeName(i.name)
          ] || "";

      }

    });

  });

}

    state.accounts

      .filter(
        x => x.type === "income"
      )

      .reduce(
        (s,x) =>
          s +
          num(x.qty) *
          num(x.price),
        0
      );


  const expense =
    state.accounts

      .filter(
        x => x.type === "expense"
      )

      .reduce(
        (s,x) =>
          s +
          num(x.qty) *
          num(x.price),
        0
      );


  const balance =
    income - expense;


  document
    .getElementById("accountIncome")
    .textContent =
      money(income);


  document
    .getElementById("accountExpense")
    .textContent =
      money(expense);


  document
    .getElementById("accountBalance")
    .textContent =
      money(balance);


  const list =
    document.getElementById(
      "accountList"
    );


  const arr =
    [...state.accounts]
      .sort((a,b) => {

        const da =
          String(a.date || "");

        const db =
          String(b.date || "");

        if(db !== da){

          return db.localeCompare(da);

        }

        return String(b.id)
          .localeCompare(
            String(a.id)
          );

      });


  if(arr.length === 0){

    list.innerHTML = `

      <div class="empty">

        <br>

        กด ＋ เพิ่มรายการ ได้เลย 💗

      </div>

    `;

    return;

  }


  list.innerHTML =
    arr.map(tx => {

      const total =
        num(tx.qty) *
        num(tx.price);

      const isIncome =
        tx.type === "income";

      const cover =
        tx.cover ||
        state.covers[
          normalizeName(tx.name)

        "";


      return `

            ${isIncome ? "+" : "−"}

            <div class="account-name-line">

                  ? `
                    <span class="account-cover">
                      ${esc(cover)}
                    </span>
                  `
                  : ""
              }

              <span class="account-name">
                ${esc(tx.name)}
              </span>

            </div>


            <div class="account-equation">

              ${num(tx.qty)}
              ×
              ${money(tx.price)}
              =
              ${money(total)}
              ·
              ${esc(tx.date)}

            </div>


            ${
              tx.note
                ? `
                  <div
                    style="
                      font-size:12px;
                      color:#b0aaae;
                      margin-top:2px;
                    "
                  >
                    ${esc(tx.note)}
                  </div>
                `
                : ""
            }

          </div>


          <div class="account-right">

            <div
              class="
                account-money
                ${isIncome ? "income" : "expense"}
              "
            >
              ${isIncome ? "+" : "-"}

            </div>

function saveAccountModal(){

  const type =
    document.getElementById(
      "txType"
    ).value;


  const name =
    document.getElementById(
      "txName"
    ).value
    .trim();


  const cover =
    document.getElementById(
      "txCover"
    ).value
    .trim();


  const qty =
    num(
      document.getElementById(
        "txQty"
      ).value
    );


  const price =
    num(
      document.getElementById(
        "txPrice"
      ).value
    );


  const date =
    document.getElementById(
      "txDate"
    ).value ||
    todayString();


  const note =
    document.getElementById(
      "txNote"
    ).value
    .trim();


  if(!name){

    alert(
      "กรุณาใส่ชื่อรายการ"
    );

    return;

  }


  if(currentAccountEditId){

    const tx =
      state.accounts.find(
        x =>
          x.id ===
          currentAccountEditId
      );


    if(tx){

      tx.type = type;

      tx.name = name;

      tx.cover = cover;

      tx.qty = qty;

      tx.price = price;

      tx.date = date;

      tx.note = note;

    }

  }else{

    state.accounts.push({

      id:
        uid("tx"),

      type,

      name,

      cover,

      qty,

      price,

      date,

      note

    });

  }


  if(cover){

    state.covers[
      normalizeName(name)
    ] = cover;

  }


  normalizeState();

  saveData();

  closeModal(
    "accountModal"
  );

  renderAll();

}

===================================================== */

function deleteAccount(id){

  const tx =
    state.accounts.find(
      x => x.id === id
    );

  if(!tx) return;


  if(
    !confirm(
      `ลบรายการ "${tx.name}" ใช่ไหม?`
    )
  ){

    return;

  }


  state.accounts =
    state.accounts.filter(
      x => x.id !== id
    );


  saveData();

  renderAll();

}

/* =====================================================
   SUMMARY FILTER
===================================================== */

function getSummaryAccounts(){

  let arr = [];


  if(summaryPeriod === "day"){

    arr =
      state.accounts.filter(
        x =>
          x.date ===
          summaryDate
      );

  }


  else if(summaryPeriod === "week"){

    const d =
      new Date(
        summaryDate +
        "T00:00:00"
      );


    const day =
      d.getDay();


    const sunday =
      new Date(d);


    sunday.setDate(
      d.getDate() - day
    );


    const saturday =
      new Date(sunday);


    saturday.setDate(
      sunday.getDate() + 6
    );


    const start =
      dateToString(
        sunday
      );


    const end =
      dateToString(
        saturday
      );


    arr =
      state.accounts.filter(
        x =>
          x.date >= start &&
          x.date <= end
      );

  }


  else if(summaryPeriod === "month"){

    const d =
      new Date(
        summaryDate +
        "T00:00:00"
      );


    const year =
      d.getFullYear();


    const month =
      d.getMonth()+1;


    arr =
      state.accounts.filter(
        x => {

          if(!x.date){
            return false;
          }


          const parts =
            x.date.split("-");


          return (

            Number(parts[0]) ===
              year &&

            Number(parts[1]) ===
              month

          );

        }
      );

  }


  else if(summaryPeriod === "year"){

    const d =
      new Date(
        summaryDate +
        "T00:00:00"
      );


    const year =
      d.getFullYear();


    arr =
      state.accounts.filter(
        x => {

          if(!x.date){
            return false;
          }


          return Number(
            x.date.slice(0,4)
          ) === year;

        }
      );

  }


  return arr;

}


function dateToString(d){

  return [

    d.getFullYear(),

    String(
      d.getMonth()+1
    ).padStart(2,"0"),

    String(
      d.getDate()
    ).padStart(2,"0")

  ].join("-");

}

/* =====================================================
   MENU MODAL
===================================================== */

function openMenuModal(
  mode,
  id=null
){

  currentMenuEditId =
    mode === "edit"
      ? id
      : null;


  document
    .getElementById(
      "menuModalTitle"
    )
    .textContent =
      mode === "edit"
        ? "แก้ไขรายการขาย"
        : "เพิ่มรายการขาย";


  if(mode === "edit"){

    const menu =
      state.menus.find(
        x => x.id === id
      );

    if(!menu) return;


    document
      .getElementById(
        "menuName"
      )
      .value =
        menu.name;


    document
      .getElementById(
        "menuCover"
      )
      .value =
        menu.cover || "";

  }else{

    document
      .getElementById(
        "menuName"
      )
      .value =
        "";


    document
      .getElementById(
        "menuCover"
      )
      .value =
        "";

  }


  document
    .getElementById(
      "menuModal"
    )
    .classList.add("show");

}


function saveMenuModal(){

  const name =
    document
      .getElementById(
        "menuName"
      )
      .value
      .trim();


  const cover =
    document
      .getElementById(
        "menuCover"
      )
      .value
      .trim();


  if(!name){

    alert(
      "กรุณาใส่ชื่อรายการขาย"
    );

    return;

  }


  if(currentMenuEditId){

    const menu =
      state.menus.find(
        x =>
          x.id ===
          currentMenuEditId
      );


    if(menu){

      menu.name = name;

      menu.cover = cover;

    }

  }else{

    state.menus.push({

      id:
        uid("menu"),

      name,

      cover,

      ingredients:[]

    });

  }


  if(cover){

    state.covers[
      normalizeName(name)
    ] = cover;

  }


  normalizeState();

  saveData();

  closeModal(
    "menuModal"
  );

  renderMenus();

}


/* =====================================================
   DUPLICATE MENU
===================================================== */

function duplicateMenu(id){

  const source =
    state.menus.find(
      x => x.id === id
    );


  if(!source) return;


  const newMenu = {

    id:
      uid("menu"),

    name:
      source.name +
      " (สำเนา)",

    cover:
      source.cover || "",

    ingredients:

      (
        Array.isArray(
          source.ingredients
        )
          ? source.ingredients
          : []
      )
        .map(i => ({

          id:
            uid("ing"),

          name:
            i.name,

          cover:
            i.cover || "",

          qty:
            num(i.qty),

          price:
            num(i.price),

          enabled:
            i.enabled !== false

        }))

  };


  state.menus.push(
    newMenu
  );


  saveData();

  renderMenus();

}


/* =====================================================
   DELETE MENU
===================================================== */

function deleteMenu(id){

  const menu =
    state.menus.find(
      x => x.id === id
    );


  if(!menu) return;


  if(
    !confirm(
      `ลบรายการขาย "${menu.name}" และวัตถุดิบทั้งหมดใช่ไหม?`
    )
  ){

    return;

  }


  state.menus =
    state.menus.filter(
      x => x.id !== id
    );


  saveData();

  renderMenus();

}

/* =====================================================
   INGREDIENTS RENDER
===================================================== */

function renderIngredients(){

  const menu =
    state.menus.find(
      x =>
        x.id ===
        currentIngredientMenuId
    );


  const list =
    document.getElementById(
      "ingredientList"
    );


  if(!menu){

    list.innerHTML = "";

    return;

  }


  if(!Array.isArray(
    menu.ingredients
  )){

    menu.ingredients = [];

  }


  if(menu.ingredients.length === 0){

    list.innerHTML = `

      <div class="empty">

        ยังไม่มีวัตถุดิบ

        <br>

        กด ＋ เพิ่มวัตถุดิบ ได้เลย 💗

      </div>

    `;

    return;

  }


  list.innerHTML =
    menu.ingredients
      .map(
        (item,index) => {

          const total =
            num(item.qty) *
            num(item.price);


          const cover =
            item.cover ||
            state.covers[
              normalizeName(
                item.name
              )
            ] ||
            "";


          /*
            ถ้ามีสัญลักษณ์:
              กล่องซ้าย = สัญลักษณ์

            ถ้าไม่มี:
              กล่องซ้าย = จำนวนซื้อ

            เพื่อให้หน้าตาเหมือนภาพที่ส่งมา
          */

          const badge =
            cover
              ? `
                <div
                  class="
                    ingredient-badge
                  "
                >
                  ${esc(cover)}
                </div>
              `
              : `
                <div
                  class="
                    ingredient-badge
                    number
                  "
                >
                  ${num(item.qty)}
                </div>
              `;


          return `

            <div
              class="ingredient-row"
              data-id="${item.id}"
            >

              <!-- LEFT -->

              <div class="ingredient-left">

                ${badge}


                <div class="ingredient-info">

                  <div
                    class="ingredient-name-line"
                  >

                    <span
                      class="ingredient-name"
                    >
                      ${esc(item.name)}
                    </span>

                  </div>


                  <div
                    class="ingredient-equation"
                  >

                    ${num(item.qty)}
                    ×
                    ${money(item.price)}
                    =
                    ${money(total)}

                  </div>

                </div>

              </div>


              <!-- RIGHT -->

              <div class="ingredient-right">

                <!-- ขึ้น -->

                <button
                  class="order-btn"
                  onclick="
                    moveIngredient(
                      '${item.id}',
                      -1
                    )
                  "
                  title="เลื่อนขึ้น"
                >
                  ↑
                </button>


                <!-- ลง -->

                <button
                  class="order-btn"
                  onclick="
                    moveIngredient(
                      '${item.id}',
                      1
                    )
                  "
                  title="เลื่อนลง"
                >
                  ↓
                </button>


                <!-- รายละเอียด -->

                <button
                  class="detail-btn"
                  onclick="
                    openIngredientModal(
                      'edit',
                      '${item.id}'
                    )
                  "
                >
                  รายละเอียด
                </button>


                <!-- ลบ -->

                <button
                  class="ingredient-delete"
                  onclick="
                    deleteIngredient(
                      '${item.id}'
                    )
                  "
                  title="ลบ"
                >
                  🗑️
                </button>


                <!-- เปิด / ปิด -->

                <label class="switch">

                  <input
                    type="checkbox"
                    ${
                      item.enabled !== false
                        ? "checked"
                        : ""
                    }
                    onchange="
                      toggleIngredient(
                        '${item.id}',
                        this.checked
                      )
                    "
                  >

                  <span class="slider"></span>

                </label>


                <!-- จำนวน - -->

                <div class="qty-control">

                  <button
                    class="qty-btn"
                    onclick="
                      changeIngredientQty(
                        '${item.id}',
                        -1
                      )
                    "
                  >
                    −
                  </button>


                  <input
                    class="qty-input"
                    type="number"
                    min="0"
                    value="${num(item.qty)}"
                    onchange="
                      setIngredientQty(
                        '${item.id}',
                        this.value
                      )
                    "
                  >


                  <button
                    class="qty-btn"
                    onclick="
                      changeIngredientQty(
                        '${item.id}',
                        1
                      )
                    "
                  >
                    ＋
                  </button>

                </div>

              </div>

            </div>

          `;

        }
      )
      .join("");

}

function changeIngredientModalQty(
  delta
){

  const input =
    document.getElementById(
      "ingredientQty"

  let value =

    value = 0;
  }


  input.value =

/* =====================================================
   TOGGLE INGREDIENT
===================================================== */

function toggleIngredient(
  id,
  enabled
){

  const menu =
    state.menus.find(
      x =>
        x.id ===
        currentIngredientMenuId
    );


  if(!menu) return;


  const item =
    menu.ingredients.find(
      x =>
        x.id === id
    );


  if(!item) return;


  item.enabled =
    enabled;


  saveData();

  renderIngredients();

}


/* =====================================================
   INGREDIENT QTY
===================================================== */

function changeIngredientQty(
  id,
  delta
){

  const menu =
    state.menus.find(
      x =>
        x.id ===
        currentIngredientMenuId
    );


  if(!menu) return;


  const item =
    menu.ingredients.find(
      x =>
        x.id === id
    );


  if(!item) return;


  let value =
    num(item.qty) +
    delta;


  if(value < 0){
    value = 0;
  }


  item.qty =
    value;


  saveData();

  renderIngredients();

}


function setIngredientQty(
  id,
  value
){

  const menu =
    state.menus.find(
      x =>
        x.id ===
        currentIngredientMenuId
    );


  if(!menu) return;


  const item =
    menu.ingredients.find(
      x =>
        x.id === id
    );


  if(!item) return;


  item.qty =
    Math.max(
      0,
      num(value)
    );


  saveData();

  renderIngredients();

}


/* =====================================================
   MOVE INGREDIENT ↑ ↓
===================================================== */

function moveIngredient(
  id,
  direction
){

  const menu =
    state.menus.find(
      x =>
        x.id ===
        currentIngredientMenuId
    );


  if(!menu) return;


  if(!Array.isArray(
    menu.ingredients
  )){

    menu.ingredients = [];

  }


  const index =
    menu.ingredients.findIndex(
      x =>
        x.id === id
    );


  if(index === -1){
    return;
  }


  const newIndex =
    index +
    direction;


  if(
    newIndex < 0 ||
    newIndex >=
      menu.ingredients.length
  ){

    return;

  }


  const temp =
    menu.ingredients[index];


  menu.ingredients[index] =
    menu.ingredients[newIndex];


  menu.ingredients[newIndex] =
    temp;


  saveData();

  renderIngredients();

}


/* =====================================================
   MODAL CLOSE
===================================================== */

function closeModal(id){

  document
    .getElementById(id)
    .classList.remove("show");

}


document
  .querySelectorAll(

  )

    backdrop.addEventListener(
      "click",
      e => {

        if(
          e.target ===
          backdrop
        ){

          backdrop
            .classList
            .remove("show");

        }

      }
    );

  });

  normalizeState();

  renderAccount();

  renderSummary();

  renderAllRecords();

  renderMenus();

}
